  const data = useFetch('/api/anchors', []);
  const richPlaces = useFetch('/api/rich-places', []); // ישויות שמקבלות Rich Place Panel
  const richIds = (richPlaces && richPlaces.ids) || [];
  const [selected, setSelected] = useState(null);
  const [creatorsOpen, setCreatorsOpen] = useState(false);
  const [communityDirectoryOpen, setCommunityDirectoryOpen] = useState(false);
  const [businessDirectoryOpen, setBusinessDirectoryOpen] = useState(false);
  const [shareOpen, setShareOpen] = useState(false);
  // הכפתור מוצג רק כשהשרת אומר שהשיתוף פתוח - כלומר יש מפעיל פעיל שיאשר (lib/moderation.ts)
  const shareStatus = useFetch('/api/share/status', []);
  const shareAvailable = !!(shareStatus && shareStatus.open);
  // "מה קורה עכשיו": null = סגור; אחרת { tab, itemId } (פתיחה מהמקרא / מסמן / מסע היוצרים)
  const [nowOpen, setNowOpen] = useState(null);
  // שכבת-המקרא הפעילה: מציגה את נקודות-המשנה של השכבה בלבד (שכבה אחת בכל רגע).
  const [activeLayer, setActiveLayer] = useState(null);
  const [selectedSecondary, setSelectedSecondary] = useState(null);
  const secondaryData = useFetch('/api/secondary-points', []);
  const secondaryPoints = ((secondaryData && secondaryData.points) || []).filter((p) => p.layer === activeLayer);
  // "גיבורים וגיבורות השכונה": נקודת מפה אחת לכל האוסף - רק אם השרת מחזיר לה
  // מיקום מקור מאומת. #giborim פותח את החלון ישירות (תצוגה מקדימה/קישור).
  const heroes = useFetch('/api/neighborhood-heroes', []);
  const heroesPoint = heroes && heroes.mapPoint && heroes.mapPoint.layer === activeLayer ? heroes.mapPoint : null;
  const [heroesOpen, setHeroesOpen] = useState(() => { try { return window.location.hash === '#giborim'; } catch (e) { return false; } });
  const closeHeroes = useCallback(() => setHeroesOpen(false), []);
  const anchorPoints = (data && data.points) || []; // תמיד בדיוק 11 העוגנים
  // "מה קורה עכשיו": פיד ה-workspace. פתיחת החלון לא משנה את המפה; רק פריט
  // שנבחר בחלון (ויש לו מיקום) מסומן בנקודה אחת. סוגרים את החלון - המפה הרגילה חוזרת.
  const nowData = useFetch('/api/now', []);
  const [nowFocus, setNowFocus] = useState(null);
  const bg = data && data.background;

  const close = useCallback(() => setSelected(null), []);
  const closeSecondary = useCallback(() => setSelectedSecondary(null), []);
  const closeCreators = useCallback(() => setCreatorsOpen(false), []);
  const closeCommunityDirectory = useCallback(() => {
    setCommunityDirectoryOpen(false);
    setActiveLayer((cur) => (cur === 'community' ? null : cur));
  }, []);
  const closeBusinessDirectory = useCallback(() => setBusinessDirectoryOpen(false), []);
  const closeShare = useCallback(() => setShareOpen(false), []);
  // מתוך חלון-מקום עשיר: סוגר את החלון ופותח את מדריך העסקים הקיים (לא מדריך שני)
  const openBusinessDirectoryFromPlace = useCallback(() => { setSelected(null); setBusinessDirectoryOpen(true); }, []);
  const closeNow = useCallback(() => {
    setNowOpen(null);
    setNowFocus(null);
    setActiveLayer((cur) => (cur === 'now_initiatives' ? null : cur));
  }, []);
  // מסע היצירה בתוך "יוצרים שכונה" - שלבי "פעילות/אירוע" ו"השתתפות" מובילים
  // לפאנל האירועים האמיתי (לא שכבת-מפה, לא marker) - סוגר את שער היוצרים ופותח אירועים.
  const navigateFromCreatorsToEvents = useCallback(() => { setCreatorsOpen(false); setNowOpen({ tab: 'upcoming' }); }, []);
  // מקרא המפה: בוחר את השכבה (נקודות-המשנה שלה מופיעות, של השכבה הקודמת
  // נעלמות) ופותח את היעד הקיים כמו קודם. 11 העוגנים תמיד נשארים - אין סינון.
  const openMapLegendItem = useCallback((key) => {
    // "סיפור מקום" לא פותח חלון - קליק נוסף עליו מחזיר למפה הניטרלית
    setActiveLayer((cur) => (key === 'place_story' && cur === 'place_story' ? null : key));
    setCommunityDirectoryOpen(key === 'community'); // שכבת הקהילה נסגרת כשבוחרים שכבה אחרת
    if (key === 'business_resource') setBusinessDirectoryOpen(true);
    else if (key === 'now_initiatives') setNowOpen({ tab: 'today' });
  }, []);

  // גודל החלונות והטקסט שבהם נגזר מגודל המפה, לא מגודל החלון: --map-w/--map-h,
  // ו-data-map-size='s' כשהמפה צרה (<=420px - אותו סף שבו המקרא יורד ל-9.5px).
  useEffect(() => {
    const stage = document.querySelector('.am-map-stage');
    if (!stage) return undefined;
    const root = document.documentElement;
    const apply = () => {
      const r = stage.getBoundingClientRect();
      if (!r.width) return;
      root.style.setProperty('--map-w', Math.round(r.width) + 'px');
      root.style.setProperty('--map-h', Math.round(r.height) + 'px');
      root.dataset.mapSize = r.width <= 420 ? 's' : 'l';
      // "יש לי משהו לשתף": בתוך המפה, מימין למעלה מתחת לכותרת "ארמון הנציב" - כשהוא נכנס
      // לאזור הפנוי שם (עד ~5.6% מגובה המפה ו-21% מרוחבה). אחרת (בעיקר בטלפון, שבו יעד המגע
      // גדול יחסית למפה) הוא היה מכסה את האיור - ולכן יוצא אל מחוץ למפה, צמוד לפינה
      // הימנית-התחתונה שלה: מתחתיה כשיש מקום, אחרת לצידה.
      const fab = document.querySelector('.am-share-fab');
      if (fab) {
        root.dataset.shareDock = 'inside';
        const fits = fab.offsetHeight <= r.height * 0.056 && fab.offsetWidth <= r.width * 0.21; // האזור הפנוי מתחת לכותרת: ~21% מהרוחב
        if (!fits) root.dataset.shareDock = window.innerHeight - r.bottom >= 56 || window.innerWidth - r.right < 160 ? 'below' : 'beside';
      }
    };
    apply();
    const ro = typeof ResizeObserver === 'function' ? new ResizeObserver(apply) : null;
    if (ro) ro.observe(stage);
    window.addEventListener('resize', apply);
    return () => { if (ro) ro.disconnect(); window.removeEventListener('resize', apply); };
  }, [shareAvailable]); // הכפתור מופיע רק אחרי בדיקת /api/share/status - למדוד שוב

  // Escape סוגר את מה שפתוח (קודם הכרטיס, אחר-כך שער היוצרים/מדריכים)
  useEffect(() => {
    function onKey(e) {
      if (e.key !== 'Escape') return;
      if (shareOpen) closeShare();
      else if (selected) close();
      else if (selectedSecondary) closeSecondary();
      else if (heroesOpen) closeHeroes();
      else if (creatorsOpen) closeCreators();
      else if (communityDirectoryOpen) closeCommunityDirectory();
      else if (businessDirectoryOpen) closeBusinessDirectory();
      else if (nowOpen) closeNow();
      else setActiveLayer(null); // שום חלון לא פתוח - חזרה למפה הניטרלית
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [shareOpen, closeShare, selected, selectedSecondary, closeSecondary, heroesOpen, closeHeroes, creatorsOpen, communityDirectoryOpen, businessDirectoryOpen, nowOpen, close, closeCreators, closeCommunityDirectory, closeBusinessDirectory, closeNow]);

  return h('div', { className: 'am-app' },
    h('div', { className: 'am-map-stage' },
      bg ? h('img', { className: 'base-photo', src: bg.imageUrl, alt: 'מפת השכונה' }) : null,
      /* קו-רקיע ירושלמי דק בתחתית המפה (כפי שנראה צפונה מהטיילת) - נכס נפרד וניתן
         להחלפה /decor/armon-skyline-line.svg, קישוט בלבד, מתחת לכל הכפתורים. */
      bg ? h('img', { className: 'am-skyline-line', src: '/decor/armon-skyline-line.svg', alt: '', 'aria-hidden': 'true', draggable: false }) : null,
      /* רחוב עולי הגרדום והכיכר המרכזית שעליו (ליד המינהל הקהילתי) - שכבת SVG בגודל הבמה, כמו במפת רחובות
         (נכס נפרד, להחלפה); קישוט בלבד */
      bg ? h('img', { className: 'am-street-layer', src: '/decor/armon-olei-hagardom.svg', alt: '', 'aria-hidden': 'true', draggable: false }) : null,
      /* שלושה מוטיבים מאוירים, מיושרים לבמת המפה (לא למסך); שכבה דקורטיבית בלבד וללא אירועי לחיצה. */
      bg ? h('img', { className: 'am-place-motifs', src: '/decor/armon-place-motifs.svg', alt: '', 'aria-hidden': 'true', draggable: false }) : null,
      /* "יש לי משהו לשתף" - כפתור HTML בפינה הימנית-התחתונה של המפה, מעל קו-הרקיע
         המשורבט (בבקשת בעל הפרויקט). שכבה מעל האיור כמו הסמנים - האיור הנעול לא משתנה.
         הגודל יחסי לרוחב המפה, בערך כגודל הכותרת "עושים קהילה". */
      shareAvailable ? h('button', { className: 'am-share-fab', onClick: () => setShareOpen(true), 'aria-haspopup': 'dialog' }, 'יש לי הצעה') : null,

      /* 11 העוגנים: אזורי-קליק שקופים בלבד מעל האייקונים המצוירים ב-Master
         Visual הנעול - בלי אייקון/פאץ'/נקודה מעל האיור. */
      /* רקע v4 (בלי אייקונים מצוירים): עוגן עם אייקון נעול מאושר
         (LOCKED_ICON_ASSET_BY_TITLE) מוצג ככפתור עגול מורם ובתוכו האייקון.
         עוגנים בלי אייקון מאושר נשארים אזור-קליק שקוף כמו קודם. */
      anchorPoints.map((p) => {
        const icon = LOCKED_ICON_ASSET_BY_TITLE[p.title];
        const contentId = ANCHOR_CONTENT_BY_TITLE[p.title] || p.entityId;
        return h('button', {
          key: p.id,
          className: 'am-hotspot am-hotspot--artwork' + (icon ? ' am-hotspot--icon' : '') + (contentId === selected ? ' is-active' : ''),
          style: { left: stageX(p.display.mapX) + '%', top: stageY(p.display.mapY) + '%' },
          onClick: () => setSelected(contentId),
          'aria-label': p.title,
        }, icon ? h('img', { className: 'am-hotspot-icon', src: icon, alt: '', draggable: false }) : null,
          icon ? h('span', { className: 'am-hotspot-name', 'aria-hidden': 'true' }, p.title) : null);
      }),
      /* נקודות צמודות לעוגן (פארק הדרקונים ליד המרכז המסחרי) - מוצגות רק כשהעוגן קיים */
      ANCHOR_COMPANIONS.filter((c) => anchorPoints.some((p) => p.title === c.anchorTitle)).map((c) => h('button', {
        key: c.id,
        className: 'am-hotspot am-hotspot--artwork am-hotspot--icon am-hotspot--companion' + (c.entityId === selected ? ' is-active' : ''),
        style: { left: stageX(c.mapX) + '%', top: stageY(c.mapY) + '%' },
        onClick: () => setSelected(c.entityId),
        'aria-label': c.title,
        'data-companion': c.id,
      }, h('img', { className: 'am-hotspot-icon', src: LOCKED_ICON_ASSET_BY_TITLE[c.title], alt: '', draggable: false }),
        h('span', { className: 'am-hotspot-name', 'aria-hidden': 'true' }, c.title))),

      /* נקודות-המשנה של השכבה הפעילה: נקודה אדומה קטנה במיקום המקור המדויק,
         ומעליה אייקון המקור הנעול (אם סופק) - קטן מ-11 העוגנים. */
      secondaryPoints.map((p) => h(SecondaryMarker, {
        key: p.id, point: p, active: selectedSecondary === p.id, onOpen: () => setSelectedSecondary(p.id),
      })),

      heroesPoint
        ? h(SecondaryMarker, { key: heroesPoint.id, point: heroesPoint, collection: 'neighborhood_heroes', onOpen: () => setHeroesOpen(true) })
        : null,

      nowOpen && nowFocus ? h(NowMarker, { key: nowFocus.id, item: nowFocus }) : null,

      communityDirectoryOpen ? h(CommunityLayer, { onClose: closeCommunityDirectory }) : null,

      /* מקרא המפה - פאנל HTML קריא מעל המקרא הקטן המצויר ב-Master Visual */
      h('nav', { className: 'am-map-legend', 'aria-label': 'מקרא המפה' },
        MAP_LEGEND_ITEMS.map((item) =>
          h('button', {
            key: item.key,
            className: 'am-map-legend-item',
            'aria-pressed': activeLayer === item.key,
            style: { '--legend-color': item.color },
            onClick: () => openMapLegendItem(item.key),
          },
            h('span', { className: 'am-map-legend-label' }, item.label),
            h('span', { className: 'am-map-legend-swatch', 'aria-hidden': 'true' })
          )
        )
      ),

      /* כפתור המותג "עושים קהילה" - פעולה אחת ברורה, ללא שורת המשנה מהלוגו הישן. */
      h('button', {
        className: 'am-legend-dot am-brand-button',
        onClick: () => setCreatorsOpen(true),
        title: 'עושים קהילה',
        'aria-label': 'עושים קהילה',
      },
        h('span', { 'aria-hidden': 'true', className: 'am-brand-plus' }, '+'),
        h('span', null, 'עושים קהילה')
      )
    ),
    selected && richIds.includes(selected)
      ? h(RichPlacePanel, { key: selected, entityId: selected, onClose: close, onOpenBusinessDirectory: openBusinessDirectoryFromPlace })
      : h(EntityCard, { entityId: selected, onClose: close }),
    selectedSecondary
      ? h(EntityCard, { key: 's-' + selectedSecondary, entityId: selectedSecondary, fetchUrl: '/api/secondary-points/' + selectedSecondary, onClose: closeSecondary })
      : null,
    heroesOpen ? h(NeighborhoodHeroesPanel, { data: heroes, onClose: closeHeroes }) : null,
    creatorsOpen ? h(CreatorsGatePanel, { onClose: closeCreators, onOpenEvents: navigateFromCreatorsToEvents }) : null,
    businessDirectoryOpen ? h(BusinessDirectoryPanel, { onClose: closeBusinessDirectory }) : null,
    nowOpen ? h(NowPanel, { data: nowData, initialTab: nowOpen.tab, initialItemId: nowOpen.itemId, onClose: closeNow, onFocusItem: setNowFocus }) : null,
    shareOpen ? h(SharePanel, { onClose: closeShare, places: anchorPoints }) : null
  );
}

// עמוד שמשתמש ברכיבים האלה (למשל אב-הטיפוס /givatayim) מגדיר OSIM_EMBED לפני הטעינה
// ומרנדר את עצמו; בלי הדגל (מפת ארמון הנציב) - בדיוק כמו קודם.
if (!window.OSIM_EMBED) ReactDOM.createRoot(document.getElementById('root')).render(h(App));

</script>

  <script>/* שיתוף של נקודה אחת במפה (28.10.2026, בקשת בעל הפרויקט: "קהילה ושיווק").

  layers: [h('path', { key: 1, d: 'M12 4l8 4.2-8 4.2-8-4.2z', ...GV_STROKE }), h('path', { key: 2, d: 'M4 12.2l8 4.2 8-4.2M4 16l8 4.2 8-4.2', ...GV_STROKE })],
  people: [h('circle', { key: 1, cx: 9, cy: 8.5, r: 2.4, ...GV_STROKE }), h('circle', { key: 2, cx: 15.5, cy: 9.5, r: 2, ...GV_STROKE, stroke: '#e2725b' }), h('path', { key: 3, d: 'M4.5 18.5c.6-3.2 2.3-5 4.5-5s3.9 1.8 4.5 5M13 18.5c.4-2.4 1.3-3.8 2.5-3.8s2.6 1.4 3 3.8', ...GV_STROKE })],
};
function GvIcon({ name }) {
  return h('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true' }, GV_ICONS[name] || GV_ICONS.house);
}

/* ---------- המפה: האיור המאושר עצמו, בלי שום שינוי ----------
   התמונה מוצגת כפי שהיא; החיתוך (art.crop) נעשה בתצוגה בלבד - כדי להוציא את הפאנל
   המצויר שבשולי האיור - והקובץ עצמו לא משתנה. נקודות הלחיצה נשמרות בנפרד, בפיקסלים
   של האיור המקורי, ומתורגמות כאן לאחוזים מהחיתוך. */
function gvCropStyle(art) {
  const c = art.crop;
  return { width: (art.width / c.w) * 100 + '%', height: (art.height / c.h) * 100 + '%', left: (-c.x / c.w) * 100 + '%', top: (-c.y / c.h) * 100 + '%' };
}
function gvHotspotStyle(art, r) {
  const c = art.crop;
  return { left: ((r.x - c.x) / c.w) * 100 + '%', top: ((r.y - c.y) / c.h) * 100 + '%', width: (r.w / c.w) * 100 + '%', height: (r.h / c.h) * 100 + '%' };
}

/* ---------- "מה קורה עכשיו": פיד לדוגמה בצורה ש-NowPanel מכיר ---------- */
function gvNowFeed(cfg) {
  const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  const addDays = (n) => { const d = new Date(today + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const item = (s) => ({
    id: s.id, workspace: 'givatayim-demo', kind: s.kind, type: s.type, title: s.title, description: s.description || null,
    date: s.dayOffset === undefined ? null : addDays(s.dayOffset), startTime: s.startTime || null, endTime: s.endTime || null, startAt: null,
    locationLabel: s.locationLabel || null, mapPosition: null, status: 'demo', url: null,
    provenance: { kind: 'demo', verified: false, note: 'תוכן לדוגמה לאב-טיפוס - לא אירוע מאומת' },
  });
  const n = cfg.now || {};
  return { workspace: { id: 'givatayim-demo', name: cfg.city }, today, tabs: { today: (n.today || []).map(item), upcoming: (n.upcoming || []).map(item), useful: (n.useful || []).map(item) } };
}

/* ---------- הבסיס הגיאוגרפי: Leaflet, אריחי OpenStreetMap ושני סגנונות (כמו במפת רמת גן) ----------
   "כמו שזוכרים" (ברירת המחדל): מפה קוגניטיבית מעל הגיאוגרפיה האמיתית. פאזל השכונות ורחוב כצנלסון
   (givatayim/illustrated.json), וכל עוגן (geo.weight / geo.reach במטרים) מותח את המרחב סביבו, כמו יריעת גומי:
   העוגן והשכונה שלו גדלים, האזורים הרחוקים נדחסים. הסדר והכיוונים נשארים נכונים, הגודל לא.
   "מפורטת": המפה כמו שהיא, עם גבול העיר והשכונות כפי שמופו ב-OSM (givatayim/geo.json).
   העוגנים הם הציורים מהאיור המאושר, חתוכים בתצוגה בלבד לפי נקודות הלחיצה (הקובץ עצמו לא משתנה). */
const GV_PIECE_TONES = ['#f7e6c4', '#f6d6c8', '#dcebe6', '#e3e7f0'];
const gvReducedMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

function gvMakeWarp(landmarks) {
  const lat0 = 32.07, kx = 111320 * Math.cos((lat0 * Math.PI) / 180), ky = 110540;
  const anchors = landmarks.filter((l) => l.geo && l.geo.weight > 0).map((l) => ({ lat: l.geo.lat, lng: l.geo.lng, w: l.geo.weight, r: l.geo.reach || 300 }));
  return (lat, lng) => {
    let dx = 0, dy = 0; // מטרים
    for (const a of anchors) {
      const ex = (lng - a.lng) * kx, ey = (lat - a.lat) * ky;
      const g = a.w * Math.exp(-(ex * ex + ey * ey) / (a.r * a.r));
      dx += ex * g; dy += ey * g;
    }
    return [lat + dy / ky, lng + dx / kx];
  };
}
// מצפיף קווים (כל ~20 מ') כדי שגם קטעים ישרים יתעקמו עם המתיחה
function gvDensify(ring, step = 0.0002) {
  const out = [];
  for (let i = 0; i < ring.length; i++) {
    const a = ring[i], b = ring[i + 1];
    out.push(a);
    if (!b) break;
    const n = Math.floor(Math.hypot(b[0] - a[0], b[1] - a[1]) / step);
    for (let k = 1; k < n; k++) out.push([a[0] + ((b[0] - a[0]) * k) / n, a[1] + ((b[1] - a[1]) * k) / n]);
  }
  return out;
}
function gvWarpGeometry(g, warp) {
  const ring = (r) => gvDensify(r).map(([x, y]) => { const [la, ln] = warp(y, x); return [ln, la]; });
  if (g.type === 'LineString') return { type: g.type, coordinates: ring(g.coordinates) };
  if (g.type === 'Polygon') return { type: g.type, coordinates: g.coordinates.map(ring) };
  if (g.type === 'MultiPolygon') return { type: g.type, coordinates: g.coordinates.map((p) => p.map(ring)) };
  return g;
}

/** הציור של מקום מתוך האיור המאושר: רקע חתוך לפי נקודת הלחיצה, בתוך עיגול בגודל size.
    ריבוע מהחלק העליון של נקודת הלחיצה: בתחתית שלה מצויר באיור שם המקום, והשם מוצג כאן בנפרד */
function gvArtCrop(art, r, size) {
  const side = Math.min(r.w, r.h * 0.64);
  const s = size / side;
  return {
    backgroundImage: 'url(' + art.src + ')', backgroundSize: Math.round(art.width * s) + 'px ' + Math.round(art.height * s) + 'px',
    backgroundPosition: Math.round(-(r.x + (r.w - side) / 2) * s) + 'px ' + Math.round(-(r.y + r.h * 0.02) * s) + 'px',
  };
}

/* המפה ממלאת את המסך, ולכן ההתאמה משאירה מקום לפס המקרא משמאל, לבורר הסגנון למעלה ול"יש לי משהו לשתף" למטה */
const gvFit = (el) => (el.clientWidth < 520
  ? { paddingTopLeft: [10, 64], paddingBottomRight: [10, 72] } // בטלפון המפה עוברת מתחת לפס המקרא, כדי לנצל את הרוחב
  : { paddingTopLeft: [76, 64], paddingBottomRight: [16, 84] });
function createGvMap(el, cfg, geo, ill, onOpen) {
  const mapCfg = cfg.map;
  const still = gvReducedMotion();
  const map = L.map(el, {
    zoomAnimation: !still, fadeAnimation: !still, markerZoomAnimation: !still,
    zoomControl: false, minZoom: mapCfg.minZoom, maxZoom: mapCfg.maxZoom, zoomSnap: 0.25, wheelPxPerZoomLevel: 90,
  });
  L.control.zoom({ position: 'bottomleft', zoomInTitle: 'הגדלה', zoomOutTitle: 'הקטנה' }).addTo(map);
  map.attributionControl.setPrefix(false);
  const tiles = L.tileLayer(mapCfg.tiles, { maxZoom: 19, attribution: mapCfg.attribution }).addTo(map);

  const city = geo.features.find((f) => f.properties.kind === 'city');
  const hoods = geo.features.filter((f) => f.properties.kind === 'neighborhood');
  const named = geo.features.filter((f) => f.properties.kind === 'neighborhood' || f.properties.kind === 'neighborhood-label');
  const [w, s, e, n] = geo.bbox;
  const ll = (ring) => ring.map(([x, y]) => [y, x]);
  const pad = 0.4;
  const world = [[s - pad, w - pad], [s - pad, e + pad], [n + pad, e + pad], [n + pad, w - pad]];
  // עמעום מחוץ לעיר: מלבן גדול עם "חור" בצורת העיר
  const mask = (holes, opacity) => L.polygon([world, ...holes], { className: 'gv-geo-mask', stroke: false, fillColor: '#f4ecdd', fillOpacity: opacity, interactive: false });

  const detail = L.layerGroup([
    mask(city.geometry.coordinates.map((poly) => ll(poly[0])), 0.7),
    L.geoJSON({ type: 'FeatureCollection', features: hoods }, {
      interactive: false, style: { className: 'gv-geo-hood', color: '#2f8f83', weight: 1.6, opacity: 0.85, dashArray: '5 5', fillColor: '#2f8f83', fillOpacity: 0.05 },
    }),
    L.geoJSON(city, { interactive: false, style: { className: 'gv-geo-city', color: '#1f3a5f', weight: 3, opacity: 0.9, fill: false } }),
  ]);

  const warp = gvMakeWarp(cfg.landmarks);
  const memory = L.layerGroup();
  const of = (k) => ill.features.filter((f) => f.properties.kind === k).map((f) => ({ ...f, geometry: gvWarpGeometry(f.geometry, warp) }));
  const artCity = of('city')[0];
  memory.addLayer(mask([ll(artCity.geometry.coordinates[0])], 0.9));
  memory.addLayer(L.geoJSON({ type: 'FeatureCollection', features: of('piece') }, {
    interactive: false,
    style: (f) => ({ className: 'gv-art-piece', color: '#fffdf6', weight: 3.5, opacity: 1, fillColor: GV_PIECE_TONES[f.properties.tone % GV_PIECE_TONES.length], fillOpacity: 0.95 }),
  }));
  // כצנלסון: הרחוב הראשי, קו אלמוג עבה עם שוליים בצבע שמנת ושם
  for (const road of of('road')) {
    memory.addLayer(L.geoJSON(road, { interactive: false, style: { className: 'gv-art-road-casing', color: '#fffdf6', weight: 15, opacity: 1, lineCap: 'round', lineJoin: 'round' } }));
    memory.addLayer(L.geoJSON(road, { interactive: false, style: { className: 'gv-art-road', color: '#e2725b', weight: 9, opacity: 1, lineCap: 'round', lineJoin: 'round' } }));
    const c = road.geometry.coordinates;
    const [lng, lat] = c[Math.floor(c.length * 0.3)];
    const tag = document.createElement('span');
    tag.textContent = road.properties.name;
    memory.addLayer(L.marker([lat, lng], { icon: L.divIcon({ className: 'gv-road-label', html: tag, iconSize: null }), interactive: false, keyboard: false, zIndexOffset: 300 }));
  }
  memory.addLayer(L.geoJSON(artCity, { interactive: false, style: { className: 'gv-art-city', color: '#1f3a5f', weight: 3.5, opacity: 0.95, fill: false } }));

  // שמות השכונות: קודם אלה שיש להן גבול ממופה; שם שמתנגש בעוגן או בשם אחר מוסתר עד שמגדילים
  const labels = L.layerGroup();
  const spans = [];
  const labelMarkers = [];
  for (const f of [...named].sort((a, b) => (a.properties.kind === 'neighborhood' ? 0 : 1) - (b.properties.kind === 'neighborhood' ? 0 : 1))) {
    const span = document.createElement('span');
    span.textContent = f.properties.name;
    spans.push(span);
    const m = L.marker(f.properties.center, {
      icon: L.divIcon({ className: 'gv-hood-label' + (f.properties.kind === 'neighborhood' ? '' : ' is-name-only'), html: span, iconSize: null }),
      interactive: false, keyboard: false,
    });
    labelMarkers.push([m, f.properties.center]);
    labels.addLayer(m);
  }

  // העוגנים: כפתור עם הציור מהאיור ושם, במקום האמיתי (ב"כמו שזוכרים" - אחרי המתיחה, ובגודל לפי המשקל)
  const anchors = L.layerGroup();
  const anchorMarkers = [];
  for (const lm of cfg.landmarks.filter((l) => l.geo)) {
    const wrap = document.createElement('span');
    wrap.className = 'gv-anchor-wrap';
    const line = document.createElement('span');
    line.className = 'gv-anchor-line';
    const pin = document.createElement('span');
    pin.className = 'gv-anchor-pin';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'gv-anchor' + (lm.key ? ' is-key' : '');
    btn.dataset.entity = lm.entityId;
    btn.setAttribute('aria-label', lm.title);
    const pic = document.createElement('span');
    pic.className = 'gv-anchor-art';
    const cap = document.createElement('span');
    cap.className = 'gv-anchor-cap'; cap.textContent = lm.title;
    btn.append(pic, cap);
    wrap.append(line, pin, btn);
    L.DomEvent.disableClickPropagation(wrap);
    btn.addEventListener('click', () => onOpen(lm));
    const m = L.marker([lm.geo.lat, lm.geo.lng], { icon: L.divIcon({ className: 'gv-anchor-marker', html: wrap, iconSize: null }), keyboard: false, zIndexOffset: lm.key ? 600 : 500 });
    anchorMarkers.push({ m, lm, wrap, pic });
    anchors.addLayer(m);
  }

  const hit = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
  const declutter = () => {
    // עוגן שמתנגש בעוגן שכבר הוצג זז הצידה, עם קו למקום האמיתי; רק אם אין לו מקום בכלל הוא מוסתר עד שמגדילים.
    // קודם העוגנים המרכזיים (key), אחר כך השאר
    const frame = el.getBoundingClientRect();
    const shown = [...el.querySelectorAll('.gv-road-label span'), ...(el.parentNode ? el.parentNode.querySelectorAll('.gv-style') : [])]
      .map((x) => x.getBoundingClientRect()).filter((r) => r.width);
    const moves = [[0, 0]];
    for (const rad of [56, 92]) for (let k = 0; k < 8; k++) moves.push([Math.round(rad * Math.cos((k * Math.PI) / 4 - Math.PI / 2)), Math.round(rad * Math.sin((k * Math.PI) / 4 - Math.PI / 2))]);
    const order = [...anchorMarkers].sort((a, b) => (b.lm.key ? 1 : 0) - (a.lm.key ? 1 : 0) || (b.lm.geo.weight - a.lm.geo.weight));
    for (const { wrap } of order) {
      const b = wrap.querySelector('.gv-anchor');
      wrap.classList.remove('is-hidden', 'is-moved');
      wrap.style.setProperty('--dx', '0px'); wrap.style.setProperty('--dy', '0px');
      const r = b.getBoundingClientRect();
      if (!r.width) continue;
      const at = moves.find(([dx, dy]) => {
        const q = { left: r.left + dx, right: r.right + dx, top: r.top + dy, bottom: r.bottom + dy };
        return q.left >= frame.left && q.right <= frame.right && q.top >= frame.top && q.bottom <= frame.bottom && !shown.some((o) => hit(q, o));
      });
      if (!at) { wrap.classList.add('is-hidden'); continue; }
      const [dx, dy] = at;
      if (dx || dy) {
        wrap.classList.add('is-moved');
        wrap.style.setProperty('--dx', dx + 'px'); wrap.style.setProperty('--dy', dy + 'px');
        wrap.style.setProperty('--len', Math.hypot(dx, dy) + 'px'); wrap.style.setProperty('--angle', Math.atan2(dy, dx) + 'rad');
      }
      shown.push({ left: r.left + dx, right: r.right + dx, top: r.top + dy, bottom: r.bottom + dy });
    }
    const box = el.getBoundingClientRect();
    for (const span of spans) {
      span.classList.remove('is-hidden');
      const r = span.getBoundingClientRect();
      if (!r.width) continue;
      const cut = r.left < box.left || r.right > box.right || r.top < box.top || r.bottom > box.bottom;
      if (cut || shown.some((q) => hit(r, q))) span.classList.add('is-hidden'); else shown.push(r);
    }
  };

  const bounds = L.latLngBounds([s, w], [n, e]);
  const memoryBounds = L.latLngBounds([]);
  for (const r of artCity.geometry.coordinates.flat()) memoryBounds.extend([r[1], r[0]]);
  map.setMaxBounds(L.latLngBounds(bounds.getSouthWest(), bounds.getNorthEast()).extend(memoryBounds).pad(0.5));
  const zoomClass = () => el.classList.toggle('gv-z-far', map.getZoom() < 14.5);
  map.on('zoomend', zoomClass);
  map.on('zoomend moveend resize', declutter);

  let current = null;
  const place = (lat, lng) => (current === 'memory' ? warp(lat, lng) : [lat, lng]);
  const groups = { memory, detail };

  /** מחליף סגנון: 'memory' (כמו שזוכרים) או 'detail' (מפורטת) */
  const setStyle = (style) => {
    const was = current;
    current = style;
    for (const k of Object.keys(groups)) if (k !== style) map.removeLayer(groups[k]);
    groups[style].addTo(map);
    for (const [m, c] of labelMarkers) m.setLatLng(place(c[0], c[1]));
    for (const { m, lm, wrap, pic } of anchorMarkers) {
      m.setLatLng(place(lm.geo.lat, lm.geo.lng));
      // במפה הקוגניטיבית הציור גדל לפי המשקל של העוגן; במסך צר הכל קטן יותר
      const base = el.clientWidth < 520 ? 36 : 52;
      const size = style === 'memory' ? Math.round(base * (1 + 0.45 * lm.geo.weight)) : base;
      wrap.style.setProperty('--lm', size + 'px');
      Object.assign(pic.style, gvArtCrop(cfg.art, lm.hotspot, size));
    }
    labels.remove(); labels.addTo(map); // השמות מעל הצורות
    anchors.remove(); anchors.addTo(map); // והעוגנים מעל הכל
    // במפה הקוגניטיבית הרחובות האמיתיים כבר לא מתאימים לצורות, ולכן האריחים לא מוצגים
    tiles.setOpacity(style === 'memory' ? 0 : 1);
    el.classList.toggle('gv-style-memory', style === 'memory');
    if ((was === 'memory') !== (style === 'memory') || !was) map.fitBounds(style === 'memory' ? memoryBounds : bounds, { ...gvFit(el), animate: false });
    zoomClass();
    declutter();
  };
  /** הגדלה לעוגן: טיסה למקום שלו בסגנון הנוכחי */
  const focus = (lm) => {
    const to = place(lm.geo.lat, lm.geo.lng);
    const z = Math.max(map.getZoom(), 16);
    if (still) map.setView(to, z, { animate: false }); else map.flyTo(to, z, { duration: 0.6 });
  };
  /** הדגשת עוגנים לפי השכבות הפעילות (כמו בנקודות הלחיצה של האיור) */
  const highlight = (active) => {
    for (const { lm, wrap } of anchorMarkers) {
      const lit = active.length && lm.layers.some((k) => active.includes(k));
      wrap.classList.toggle('is-lit', !!(active.length && lit));
      wrap.classList.toggle('is-dim', !!(active.length && !lit));
    }
  };
  return { map, setStyle, focus, highlight, declutter, place };
}

/** הבמה של המפה הגיאוגרפית: טוענת את הנתונים, יוצרת את המפה פעם אחת ומחליפה סגנון בלי ליצור מחדש */
function GvGeoMap({ cfg, style, active, focusId, onOpen }) {
  const geo = useFetch(cfg.map.geo, []);
  const ill = useFetch(cfg.map.illustrated, []);
  const ref = React.useRef(null);
  const inst = React.useRef(null);
  const openRef = React.useRef(onOpen);
  openRef.current = onOpen;
  useEffect(() => {
    if (!geo || !ill || !ref.current || inst.current) return undefined;
    inst.current = createGvMap(ref.current, cfg, geo, ill, (lm) => openRef.current(lm.entityId));
    window.__gvMap = inst.current; // לבדיקות
    return () => { inst.current.map.remove(); inst.current = null; };
  }, [!!geo, !!ill]);
  useEffect(() => { if (inst.current) inst.current.setStyle(style); }, [style, !!inst.current, !!geo, !!ill]);
  useEffect(() => { if (inst.current) inst.current.highlight(active); }, [active.join(','), !!inst.current, !!geo, !!ill]);
  // המקום הפתוח: המפה שמאחור מתמקדת בו, כך ש"חזרה למפה" מגיעה אליו
  useEffect(() => {
    const lm = focusId && cfg.landmarks.find((l) => l.entityId === focusId && l.geo);
    if (inst.current && lm) inst.current.focus(lm);
  }, [focusId, !!inst.current, !!geo, !!ill]);
  return h('div', { className: 'gv-geo-stage' }, h('div', { className: 'gv-leaflet', ref }));
}

/* ---------- עמוד מקום: לחיצה על עוגן הופכת את העמוד לתצוגה של המקום (בקשת בעל הפרויקט, 25.10.2026) ----------
   המפה נשארת טעונה מאחור (ומתמקדת בעוגן), כך ש"חזרה למפה" מחזירה בדיוק למקום שבו היינו.
   התוכן: הרשומה מה-DB (/api/entities/:id) אם יש; אחרת summary מ-landmarks.json - כך שהעמוד עובד גם בשרת
   שאין בו את הנתונים לדוגמה של גבעתיים. הכל מסומן כתוכן לדוגמה. הכתובת מקבלת #place/<id>, כך שאפשר
   לשתף קישור למקום וכפתור "אחורה" של הדפדפן חוזר למפה. */
const gvPlaceFromHash = () => {
  const m = /^#place\/([\w-]+)$/.exec(window.location.hash || '');
  return m ? m[1] : null;
};
const gvDistance = (a, b) => Math.hypot((a.lat - b.lat) * 110540, (a.lng - b.lng) * 94400);

function GvPlaceView({ cfg, lm, onClose, onOpen, onShare }) {
  const [entity, setEntity] = useState(undefined);
  const [biz, setBiz] = useState([]);
  const ref = React.useRef(null);
  useEffect(() => {
    let alive = true;
    setEntity(undefined);
    fetch('/api/entities/' + encodeURIComponent(lm.entityId))
      .then((r) => (r.ok ? r.json() : null)).catch(() => null)
      .then((d) => { if (alive) setEntity(d && !d.error ? d : null); });
    // עסקים לדוגמה שהכתובת שלהם במקום הזה (רק של גבעתיים - gvt_)
    fetch('/api/business-directory').then((r) => (r.ok ? r.json() : null)).catch(() => null)
      .then((d) => { if (alive) setBiz(((d && d.items) || []).filter((b) => /^gvt_/.test(b.id) && (b.address || '').startsWith(lm.title))); });
    if (ref.current) { ref.current.scrollTop = 0; ref.current.focus({ preventScroll: true }); }
    return () => { alive = false; };
  }, [lm.entityId]);

  const demoNote = 'תוכן לדוגמה לאב-טיפוס - לא מידע מאומת.';
  const text = entity && entity.description ? entity.description.replace(' ' + demoNote, '') : lm.summary || '';
  const layers = cfg.layers.filter((l) => lm.layers.includes(l.key));
  const feed = gvNowFeed(cfg);
  const happenings = [...feed.tabs.today.map((x) => ({ ...x, when: 'היום' })), ...feed.tabs.upcoming.map((x) => ({ ...x, when: x.date }))]
    .filter((x) => { const src = [...(cfg.now.today || []), ...(cfg.now.upcoming || [])].find((n) => n.id === x.id); return src && src.landmark === lm.entityId; });
  const nearby = cfg.landmarks.filter((o) => o.entityId !== lm.entityId && o.geo)
    .map((o) => ({ o, d: gvDistance(o.geo, lm.geo) })).sort((a, b) => a.d - b.d).slice(0, 3);
  const fmtDate = (d) => (d && d.includes('-') ? new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'numeric' }).format(new Date(d + 'T12:00:00')) : d);

  return h('section', { className: 'gv-place', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'gv-place-title', tabIndex: -1, ref },
    h('div', { className: 'gv-place-bar' },
      h('button', { type: 'button', className: 'gv-place-back', onClick: onClose }, h('span', { 'aria-hidden': 'true' }, '›'), ' חזרה למפה')),
    h('div', { className: 'gv-place-inner' },
      h('header', { className: 'gv-place-hero' + (lm.key ? ' is-key' : '') },
        lm.hotspot ? h('span', { className: 'gv-place-art', 'aria-hidden': 'true', style: gvArtCrop(cfg.art, lm.hotspot, 168) }) : null,
        h('div', { className: 'gv-place-head' },
          h('h1', { className: 'gv-place-title', id: 'gv-place-title' }, lm.title),
          h('ul', { className: 'gv-place-tags' }, layers.map((l) => h('li', { key: l.key, className: 'gv-place-tag' },
            h('span', { className: 'gv-place-tag-icon' }, h(GvIcon, { name: GV_LAYER_ICON[l.key] })), l.label))))),
      h('p', { className: 'gv-place-text' }, entity === undefined && !lm.summary ? 'טוען...' : text),
      h('p', { className: 'gv-place-demo' }, demoNote),
      // קישור ישיר למקום (#place/<id>) ושיתוף שלו, כדי שכל מקום יוכל להפיץ את עצמו (28.10.2026, map-share.js)
      window.OsimShare ? h('div', { className: 'gv-place-sharelink' },
        h(window.OsimShare.ShareItem, { title: lm.title + ' | גבעתיים - מפת הקהילה', hash: 'place/' + lm.entityId })) : null,
      h('button', { type: 'button', className: 'gv-place-share', onClick: onShare },
        h('span', { className: 'gv-share-plus', 'aria-hidden': 'true' }, '+'),
        h('span', null, 'יש לי משהו לשתף על ' + lm.title)),
      h('section', { className: 'gv-place-sec' },
        h('h2', null, 'מה קורה כאן'),
        happenings.length
          ? h('ul', { className: 'gv-place-list' }, happenings.map((x) => h('li', { key: x.id },
              h('span', { className: 'gv-place-when' }, fmtDate(x.when) + (x.startTime ? ' · ' + x.startTime : '')),
              h('strong', null, x.title), x.description ? h('span', null, x.description) : null)))
          : h('p', { className: 'gv-place-empty' }, 'עוד אין כאן פעילות. אפשר להציע אחת דרך "יש לי משהו לשתף".')),
      biz.length ? h('section', { className: 'gv-place-sec' },
        h('h2', null, 'עסקים במקום'),
        h('ul', { className: 'gv-place-list' }, biz.map((b) => h('li', { key: b.id },
          h('span', { className: 'gv-place-when' }, b.category), h('strong', null, b.name), b.description ? h('span', null, b.description.replace(' ' + demoNote, '')) : null)))) : null,
      nearby.length ? h('section', { className: 'gv-place-sec' },
        h('h2', null, 'קרוב לכאן'),
        h('ul', { className: 'gv-place-near' }, nearby.map(({ o, d }) => h('li', { key: o.entityId },
          h('button', { type: 'button', className: 'gv-place-near-btn', 'data-entity': o.entityId, onClick: () => onOpen(o) },
            o.hotspot ? h('span', { className: 'gv-place-near-art', 'aria-hidden': 'true', style: gvArtCrop(cfg.art, o.hotspot, 48) }) : null,
            h('span', { className: 'gv-place-near-name' }, o.title),
            h('span', { className: 'gv-place-near-dist' }, 'כ-' + (Math.round(d / 50) * 50) + ' מ\' בקו אווירי')))))) : null,
      lm.geo && lm.geo.source ? h('p', { className: 'gv-place-source' }, 'מיקום: ' + lm.geo.source) : null));
}

/* ---------- העמוד ---------- */
const GV_STYLES = [
  { key: 'memory', label: 'כמו שזוכרים' },
  { key: 'detail', label: 'מפורטת' },
  { key: 'art', label: 'האיור' },
];
const GV_LAYER_ICON = { community: 'people', business: 'street', now: 'calendar', environment: 'leaf' };
const GV_LAYER_TONE = { community: 'teal', business: 'coral', now: 'coral', environment: 'teal' };

function GivatayimApp() {
  const cfg = useFetch('/givatayim/landmarks.json', []);
  // כמה שכבות יכולות להיות פעילות יחד (מתגים, כמו בסקיצה); סמן מודגש אם הוא באחת מהן
  const [active, setActive] = useState([]);
  // המקום הפתוח (עמוד מקום), לפי #place/<id> בכתובת
  const [placeId, setPlaceId] = useState(gvPlaceFromHash);
  const pushed = React.useRef(false); // האם העמוד נפתח מהמפה (ואז "חזרה למפה" = אחורה בדפדפן)
  const [shareOpen, setShareOpen] = useState(false);
  const [businessOpen, setBusinessOpen] = useState(false);
  const [nowOpen, setNowOpen] = useState(false);
  // סגנון המפה: 'memory' (כמו שזוכרים, ברירת המחדל), 'detail' (מפורטת) או 'art' (האיור המאושר)
  const [style, setStyle] = useState('memory');
  // המקרא: פס אייקונים צר כברירת מחדל; נפתח לשמות, למתגים ולהערות
  const [legendOpen, setLegendOpen] = useState(false);

  // גודל החלונות הקיימים נגזר מ--map-w (כמו במפת ארמון הנציב) - כאן לפי הקנבס של גבעתיים
  useEffect(() => {
    const stage = document.querySelector('.gv-stage, .gv-geo-stage');
    if (!stage) return undefined;
    const apply = () => {
      const r = stage.getBoundingClientRect();
      if (!r.width) return;
      document.documentElement.style.setProperty('--map-w', Math.round(r.width) + 'px');
      document.documentElement.style.setProperty('--map-h', Math.round(r.height) + 'px');
      document.documentElement.dataset.mapSize = r.width <= 420 ? 's' : 'l';
    };
    apply();
    const ro = typeof ResizeObserver === 'function' ? new ResizeObserver(apply) : null;
    if (ro) ro.observe(stage);
    return () => { if (ro) ro.disconnect(); };
  }, [!!cfg, style === 'art']);

  useEffect(() => {
    const onHash = () => { const id = gvPlaceFromHash(); if (!id) pushed.current = false; setPlaceId(id); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  /** פתיחת עמוד מקום: מהמפה - רשומה חדשה בהיסטוריה; מתוך עמוד מקום (קרוב לכאן) - מחליפים אותה */
  const openPlace = (id) => {
    if (gvPlaceFromHash() === id) return;
    if (placeId) { window.history.replaceState(null, '', '#place/' + id); setPlaceId(id); return; }
    pushed.current = true;
    window.location.hash = 'place/' + id;
  };
  const closePlace = () => {
    if (pushed.current) { pushed.current = false; window.history.back(); return; }
    window.history.replaceState(null, '', window.location.pathname + window.location.search);
    setPlaceId(null);
  };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== 'Escape') return;
      if (shareOpen) setShareOpen(false); else if (placeId) closePlace(); else if (businessOpen) setBusinessOpen(false); else if (nowOpen) setNowOpen(false); else setActive([]);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [placeId, shareOpen, businessOpen, nowOpen]);

  if (!cfg) return h('div', { className: 'gv-app' }, 'טוען...');
  const toggleLayer = (key) => {
    const on = !active.includes(key);
    setActive((cur) => (on ? [...cur, key] : cur.filter((k) => k !== key)));
    // כמו במקרא של המפה הקיימת: "עסק מקומי" ו"מה קורה עכשיו" פותחים גם את החלון שלהם
    if (on && key === 'business') setBusinessOpen(true);
    if (on && key === 'now') setNowOpen(true);
  };
  const places = cfg.landmarks.map((p) => ({ entityId: p.entityId, title: p.title }));
  const place = placeId ? cfg.landmarks.find((l) => l.entityId === placeId) : null;

  // ההסבר על סגנון המפה כבר כתוב ב-.gv-maplabel שמעליו, ולכן כאן רק מה שמוסיף עליו
  const note = 'אב-טיפוס · ' + (style === 'art' ? '' : 'מיקומי המקומות לפי OpenStreetMap. ') + 'כל התוכן במפה הוא לדוגמה, עד שיתווספו נתונים מאומתים.';

  // המפה ממלאת את כל המסך (בקשת בעל הפרויקט, 20.10.2026): המקרא הוא פס צר של אייקונים בצד שמאל שנפתח לפירוט,
  // ו"יש לי משהו לשתף" צף על המפה למטה
  return h('main', { className: 'gv-app' },
    h('figure', { className: 'gv-figure' + (style === 'art' ? '' : ' is-geo') },
      style !== 'art' ? h(GvGeoMap, { cfg, style, active, focusId: placeId, onOpen: openPlace }) : null,
      style === 'art' ? h('div', { className: 'gv-art-frame' }, h('div', { className: 'gv-stage', style: { aspectRatio: cfg.art.crop.w + ' / ' + cfg.art.crop.h, '--gv-ratio': cfg.art.crop.w / cfg.art.crop.h } },
        h('img', { className: 'gv-art', src: cfg.art.src, alt: 'מפה קהילתית מאוירת של גבעתיים (המחשה)', style: gvCropStyle(cfg.art), draggable: false }),
        cfg.landmarks.filter((p) => p.hotspot).map((p) => {
          const lit = active.length && p.layers.some((k) => active.includes(k));
          return h('button', {
            key: p.entityId, type: 'button',
            className: 'gv-hotspot' + (p.key ? ' is-key' : '') + (active.length ? (lit ? ' is-lit' : ' is-dim') : ''),
            style: gvHotspotStyle(cfg.art, p.hotspot),
            onClick: () => openPlace(p.entityId), 'aria-label': p.title, title: p.title, 'data-entity': p.entityId,
          });
        }))) : null,
      h('div', { className: 'gv-styles', role: 'group', 'aria-label': 'סגנון המפה' },
        GV_STYLES.map((st) => h('button', { key: st.key, type: 'button', className: 'gv-style', 'data-style': st.key, 'aria-pressed': style === st.key, onClick: () => setStyle(st.key) }, st.label)))),
    h('aside', { className: 'gv-panel' + (legendOpen ? ' is-open' : ''), 'aria-label': 'שכבות במפה' },
      h('button', { type: 'button', className: 'gv-legend-toggle', 'aria-expanded': legendOpen, 'aria-controls': 'gv-layers', onClick: () => setLegendOpen((o) => !o),
        title: legendOpen ? 'צמצום המקרא' : 'פתיחת המקרא' },
        h('span', { className: 'gv-layers-icon' }, h(GvIcon, { name: 'layers' })),
        h('span', { className: 'gv-legend-title', id: 'gv-layers-title' }, 'שכבות במפה'),
        h('span', { className: 'gv-legend-chev', 'aria-hidden': 'true' }, legendOpen ? '›' : '‹')),
      // שתי קבוצות: קהילה (מה קורה כאן) וגילוי (מה אפשר למצוא כאן), 28.10.2026; בפס הצר רק קו מפריד ביניהן
      h('ul', { className: 'gv-layers', id: 'gv-layers', 'aria-labelledby': 'gv-layers-title' },
        (cfg.groups || [{ key: 'all', layers: cfg.layers.map((l) => l.key) }]).flatMap((g) => [
          g.label ? h('li', { key: 'g-' + g.key, className: 'gv-group-head', 'data-group': g.key }, h('strong', null, g.label), ' ', g.question) : null,
          ...g.layers.map((k) => cfg.layers.find((l) => l.key === k)).filter(Boolean).map((l) => h('li', { key: l.key, className: g.label && l.key === g.layers[0] ? 'gv-group-first' : undefined },
          h('button', { type: 'button', className: 'gv-layer', 'aria-pressed': active.includes(l.key), 'data-layer': l.key, title: l.label, onClick: () => toggleLayer(l.key) },
            h('span', { className: 'gv-layer-icon gv-tone-' + GV_LAYER_TONE[l.key] }, h(GvIcon, { name: GV_LAYER_ICON[l.key] })),
            h('span', { className: 'gv-layer-label' }, l.label),
            h('span', { className: 'gv-switch', 'aria-hidden': 'true' }))))])),
      h('div', { className: 'gv-panel-notes' },
        h('p', { className: 'gv-maplabel' }, style === 'art' ? cfg.mapLabel : cfg.map.labels[style]),
        h('p', { className: 'gv-note' }, note),
        h('p', { className: 'gv-principle' }, 'הידע נמצא אצל רבים. המפה מחברת אותו. הקהילה הופכת אותו לאפשרות לפעול יחד.'))),
    h('button', { type: 'button', className: 'gv-share', onClick: () => setShareOpen(true), 'aria-haspopup': 'dialog' },
      h('span', { className: 'gv-share-plus', 'aria-hidden': 'true' }, '+'),
      h('span', { className: 'gv-share-text' },
        h('span', { className: 'gv-share-title' }, 'יש לי משהו לשתף'),
        h('span', { className: 'gv-share-sub' }, 'סיפור · רעיון · יוזמה · מקום'))),
    place ? h(GvPlaceView, { cfg, lm: place, onClose: closePlace, onOpen: (o) => openPlace(o.entityId), onShare: () => setShareOpen(true) }) : null,
    businessOpen ? h(BusinessDirectoryPanel, { onClose: () => setBusinessOpen(false) }) : null,
    nowOpen ? h(NowPanel, { data: gvNowFeed(cfg), initialTab: 'today', onClose: () => setNowOpen(false), onFocusItem: () => {} }) : null,
    shareOpen ? h(SharePanel, { onClose: () => setShareOpen(false), places }) : null
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(GivatayimApp));

</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script></body>
