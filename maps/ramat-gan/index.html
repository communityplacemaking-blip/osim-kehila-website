const isApprox = (item) => !item.location || item.location.source !== 'osm';

/* ---------- העמוד ---------- */
function RamatGanApp() {
  const cfg = useFetch('/ramat-gan/config.json', []);
  const geo = useFetch(cfg && cfg.map.geo, [cfg && cfg.map.geo]);
  const ill = useFetch(cfg && cfg.map.illustrated, [cfg && cfg.map.illustrated]);
  const [mapStyle, setMapStyle] = useState('memory'); // 'memory' מאוירת (העוגנים מוגדלים) | 'detail' מפורטת - לביקור הזה בלבד. 'art' (בלי הגדלה) נשאר בקוד ולא מוצג בבורר
  const styleRef = useRef(null);
  const placeRef = useRef((lat, lng) => [lat, lng]); // נקודה אמיתית -> מקום במפה בסגנון הנוכחי
  const declutterRef = useRef(null); // מסתיר שמות שכונות שמתנגשים בנקודות או בתוויות שלהן
  const dir = useFetch('/api/business-directory', []);
  const apiEvents = useFetch('/api/events', []);
  const shareStatus = useFetch('/api/share/status', []);
  // תצוגה מקדימה סטטית: לא מחוברת לשרת, ולכן השיתוף לא מוצג כפעיל
  const preview = !!window.RG_PREVIEW;
  const shareAvailable = !preview && !!(shareStatus && shareStatus.open);
  // תצוגה מקדימה יכולה לחבר תיבת הצעות משלה (window.RG_SHARE_INBOX = { Panel }): ההצעות נשמרות לבדיקת הצוות ולא מתפרסמות במפה
  const inbox = preview && window.RG_SHARE_INBOX && window.RG_SHARE_INBOX.Panel ? window.RG_SHARE_INBOX : null;

  const [activeLayer, setActiveLayer] = useState(null);
  const [selected, setSelected] = useState(null); // { kind: 'point' | 'business' | 'event', ref }
  const [tab, setTab] = useState('now');
  const [eventsOpen, setEventsOpen] = useState(false);
  const [eventsDock, setEventsDock] = useState(false); // פס "מה קורה בעיר?" בתחתית המפה - סגור כברירת מחדל, כדי שהמפה תהיה פנויה
  const [legendOpen, setLegendOpen] = useState(false); // "על המפה" מתחת לשכבות: הערת המפה, העיקרון והקישור לעירייה
  const [directory, setDirectory] = useState(null); // null | { initialBusinessId }
  const [shareOpen, setShareOpen] = useState(false);
  const [communityOpen, setCommunityOpen] = useState(false);
  const [focusId, setFocusId] = useState(null); // עסק שנבחר באינדקס ("הצג במפה")
  const [filterOpen, setFilterOpen] = useState(false);
  const [interests, setInterests] = useState([]); // state בלבד - לא נשמר
  const [query, setQuery] = useState('');
  const [searchOpen, setSearchOpen] = useState(false); // החיפוש הוא כפתור עגול שנפתח לשדה, כדי שלא יסתיר את המפה
  const [nowTick, setNowTick] = useState(() => Date.now());
  const stageRef = useRef(null);
  const mapElRef = useRef(null);
  const mapRef = useRef(null);
  const [view, setView] = useState(0); // עולה בכל הזזה או זום, כדי לחשב מחדש את מיקומי הנקודות
  const [moving, setMoving] = useState(false); // בזמן אנימציית זום הנקודות מוסתרות ומופיעות במקומן בסופה
  const [fitted, setFitted] = useState(''); // השכבה שהמפה סיימה להתמקד בה (data-fit, גם לבדיקות)
  const focusRef = useRef(null); // נקודה שנבחרה בחיפוש או ב"הצג במפה": המפה טסה אליה ולא לכל השכבה

  useEffect(() => {
    if (!cfg || !geo || !ill || !mapElRef.current || mapRef.current) return undefined;
    const { map, setStyle, declutter, place } = createRgMap(mapElRef.current, cfg.map, geo, ill);
    mapRef.current = map;
    placeRef.current = place;
    styleRef.current = setStyle;
    declutterRef.current = declutter;
    setStyle(mapStyle);
    const bump = () => setView((v) => v + 1);
    map.on('move resize', bump);
    map.on('zoomstart', () => setMoving(true));
    // מי שגורר את המפה רוצה לראות אותה: פס "מה קורה בעיר?" מתקפל (נפתח שוב מהכפתור שלמטה)
    map.on('dragstart', () => setEventsDock(false));
    map.on('zoomend', () => { setMoving(false); bump(); });
    bump();
    return () => { map.remove(); mapRef.current = null; styleRef.current = null; };
  }, [cfg, geo, ill]);
  useEffect(() => { if (styleRef.current) { styleRef.current(mapStyle); setView((v) => v + 1); } }, [mapStyle]);

  // "עכשיו" מתעדכן כל דקה, כך שאירוע שהסתיים יורד מהרשימה בלי רענון
  useEffect(() => { const t = setInterval(() => setNowTick(Date.now()), 60000); return () => clearInterval(t); }, []);
  const now = new Date(nowTick);
  const today = T.localDate(now);

  const businesses = (dir && dir.items) || [];
  const layersByKey = useMemo(() => (cfg ? Object.fromEntries(cfg.layers.map((l) => [l.key, l])) : {}), [cfg]);
  const allEvents = useMemo(() => (cfg ? [...demoEventItems(cfg, today), ...apiEventItems(apiEvents)] : []), [cfg, apiEvents, today]);
  const buckets = useMemo(() => {
    const b = T.bucket(allEvents, now);
    for (const k of Object.keys(b)) b[k] = b[k].filter((e) => matchesInterests(e, interests));
    return b;
  }, [allEvents, nowTick, interests]);
  const activeEvents = useMemo(() => [...buckets.now, ...buckets.coming, ...buckets.soon], [buckets]);

  // הנקודות של השכבה הפעילה בלבד
  const points = useMemo(() => {
    if (!cfg || !activeLayer) return [];
    if (activeLayer === 'business') {
      return cfg.featuredBusinesses
        .filter((f) => businesses.some((b) => b.id === f.businessId) && matchesInterests(f, interests))
        .map((f) => ({ id: f.businessId, label: f.label, lat: f.lat, lng: f.lng, approx: isApprox(f), kind: 'business', ref: f }));
    }
    if (activeLayer === 'now') {
      return buckets[tab].filter((e) => e.pos).map((e) => {
        const p = cfg.points.find((x) => x.entityId === e.pointId);
        return { id: e.id, label: e.title, lat: e.pos.lat, lng: e.pos.lng, approx: !p || isApprox(p), kind: 'event', ref: e };
      });
    }
    return cfg.points.filter((p) => p.layer === activeLayer && matchesInterests(p, interests))
      .map((p) => ({ id: p.entityId, label: p.label, lat: p.lat, lng: p.lng, approx: isApprox(p), kind: 'point', ref: p }));
  }, [cfg, activeLayer, businesses, buckets, tab, interests]);
  const pointsKey = points.map((p) => p.id).join('|');

  // בחירת שכבה (או טווח זמן בשכבת "מה קורה"): המפה לא זזה כשכל הנקודות כבר נראות בחלק הפנוי של המסך.
  // רק אם חלק מהן מחוץ לתצוגה, היא קופצת אליהן מיד, בלי אנימציה (בעל הפרויקט, 29.10.2026: "המפה זזה שמאלה וימינה")
  useEffect(() => {
    const map = mapRef.current;
    if (!map || !activeLayer) return undefined;
    const focus = focusRef.current;
    focusRef.current = null;
    if (!focus && !points.length) { setFitted(activeLayer); return undefined; }
    let done = false;
    const finish = () => { if (!done) { done = true; setFitted(activeLayer); } };
    setFitted('');
    map.once('moveend', finish);
    const t = setTimeout(finish, 1500);
    const still = rgReducedMotion();
    if (focus) {
      const at = placeRef.current(focus[0], focus[1]);
      if (still) map.setView(at, Math.max(map.getZoom(), 15), { animate: false });
      else map.flyTo(at, Math.max(map.getZoom(), 15), { duration: 0.6 });
    } else {
      const wide = stageRef.current && stageRef.current.getBoundingClientRect().width > 760;
      const bounds = L.latLngBounds(points.map((p) => placeRef.current(p.lat, p.lng)));
      const base = wide ? RG_FIT_WITH_TOOLS : RG_FIT;
      // הנקודות לא מתחבאות מתחת לעמודת הפקדים מימין (מסך רחב) או מתחת לשורות שלמטה (טלפון)
      const side = document.querySelector('.rg-side');
      const r = side ? side.getBoundingClientRect() : null;
      const opts = !r ? base : wide
        ? { ...base, paddingTopLeft: [Math.round(r.width) + 36, base.paddingTopLeft[1] - 70] }
        : { ...base, paddingBottomRight: [base.paddingBottomRight[0], Math.max(base.paddingBottomRight[1], Math.round(window.innerHeight - r.top) + 16)] };
      // החלק הפנוי של המפה: בלי עמודת הפקדים מימין (מסך רחב) או בלי השורות שלמטה (טלפון)
      const size = map.getSize();
      const box = { left: 16, top: 16, right: size.x - (r && wide ? Math.round(r.width) + 28 : 16), bottom: r && !wide ? Math.round(r.top) - 12 : size.y - 16 };
      const inView = points.every((p) => {
        const px = map.latLngToContainerPoint(placeRef.current(p.lat, p.lng));
        return px.x >= box.left && px.x <= box.right && px.y >= box.top && px.y <= box.bottom;
      });
      if (inView) { clearTimeout(t); map.off('moveend', finish); finish(); return undefined; }
      map.fitBounds(bounds, { ...opts, animate: false });
    }
    return () => { clearTimeout(t); map.off('moveend', finish); };
  }, [activeLayer, pointsKey, !!mapRef.current, mapStyle, eventsDock]);

  // המיקום של כל נקודה בפיקסלים בתוך המפה; נקודה שמחוץ לתצוגה לא מוצגת
  const placed = useMemo(() => {
    const map = mapRef.current;
    if (!map) return [];
    const size = map.getSize();
    return points.map((p) => ({ ...p, px: map.latLngToContainerPoint(placeRef.current(p.lat, p.lng)) }))
      .filter((p) => p.px.x >= 0 && p.px.y >= 0 && p.px.x <= size.x && p.px.y <= size.y);
  }, [points, view, mapStyle]);

  const layoutKey = placed.map((p) => p.id + '@' + Math.round(p.px.x) + ',' + Math.round(p.px.y)).join('|');
  useLabelLayout(stageRef, [layoutKey, !!cfg, moving]);
  // אחרי שהתוויות של הנקודות סודרו: שמות השכונות מפנים להן מקום
  useLayoutEffect(() => { if (declutterRef.current && !moving) declutterRef.current(); }, [layoutKey, moving, mapStyle]);

  // גודל החלונות הקיימים נגזר מ--map-w (כמו במפת ארמון הנציב) - כאן לפי המפה של רמת גן
  useEffect(() => {
    const stage = stageRef.current;
    if (!stage) return undefined;
    const apply = () => {
      const r = stage.getBoundingClientRect();
      if (!r.width) return;
      document.documentElement.style.setProperty('--map-w', Math.round(r.width) + 'px');
      // המפה של רמת גן רחבה ונמוכה; החלונות נמדדים לפי גובה המסך כדי שלא יהיו נמוכים מדי בטלפון
      document.documentElement.style.setProperty('--map-h', Math.round(Math.max(r.height, window.innerHeight * 0.9)) + 'px');
      document.documentElement.dataset.mapSize = r.width <= 420 ? 's' : 'l';
    };
    apply();
    const ro = typeof ResizeObserver === 'function' ? new ResizeObserver(apply) : null;
    if (ro) ro.observe(stage);
    return () => { if (ro) ro.disconnect(); };
  }, [!!cfg]);

  // קישור ישיר: מה שפתוח בכרטיס נכתב בכתובת (#place/<id>, #business/<id>, #event/<id>), כך שאפשר לשתף אותו.
  // כתובת כזו שנפתחת מבחוץ מדליקה את השכבה, מטיסה את המפה לנקודה ופותחת את הכרטיס
  const linkRef = useRef(window.OsimShare ? window.OsimShare.hashOf(RG_LINK_KINDS) : null);
  useEffect(() => {
    const link = linkRef.current;
    if (!link || !cfg || !mapRef.current) return;
    const done = () => { linkRef.current = null; };
    if (link.kind === 'place') {
      const p = cfg.points.find((x) => x.entityId === link.id);
      if (p) { focusRef.current = [p.lat, p.lng]; setActiveLayer(p.layer); setSelected({ kind: 'point', ref: p }); }
      return done();
    }
    if (link.kind === 'business') {
      if (!dir) return;
      const f = cfg.featuredBusinesses.find((x) => x.businessId === link.id);
      if (f) { focusRef.current = [f.lat, f.lng]; setActiveLayer('business'); setFocusId(f.businessId); setSelected({ kind: 'business', ref: f }); }
      else if (businesses.some((b) => b.id === link.id)) setDirectory({ initialBusinessId: link.id });
      return done();
    }
    if (link.kind === 'event') {
      const e = allEvents.find((x) => x.id === link.id);
      if (!e && !apiEvents) return; // האירועים מהשרת עוד נטענים
      if (e) {
        const k = ['now', 'coming', 'soon'].find((t) => buckets[t].some((x) => x.id === e.id));
        if (k) { setTab(k); setActiveLayer('now'); setEventsDock(true); }
        setSelected({ kind: 'event', ref: e });
      }
      return done();
    }
    done();
  }, [cfg, dir, apiEvents, !!mapRef.current, view > 0]);
  useEffect(() => {
    if (linkRef.current || !window.OsimShare) return; // עוד לא נפתח הקישור שהגיע מבחוץ
    const hash = !selected ? ''
      : selected.kind === 'point' ? 'place/' + selected.ref.entityId
        : selected.kind === 'business' ? 'business/' + selected.ref.businessId
          : 'event/' + selected.ref.id;
    const cur = window.OsimShare.hashOf(RG_LINK_KINDS);
    if (hash ? location.hash === '#' + hash : !cur) return;
    window.history.replaceState(null, '', location.pathname + location.search + (hash ? '#' + hash : ''));
  }, [selected]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== 'Escape') return;
      if (selected) setSelected(null); else if (shareOpen) setShareOpen(false); else if (communityOpen) setCommunityOpen(false); else if (directory) setDirectory(null);
      else if (eventsOpen) setEventsOpen(false); else if (filterOpen) setFilterOpen(false); else if (eventsDock) setEventsDock(false); else setActiveLayer(null);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [selected, shareOpen, communityOpen, directory, eventsOpen, filterOpen, eventsDock]);

  if (!cfg) return h('div', { className: 'rg-loading' }, 'טוען...');

  // מעבירה לשכבה ומטיסה את המפה לנקודה אחת; אם השכבה כבר פעילה - טסה מיד
  const focusOn = (layer, lat, lng) => {
    const map = mapRef.current;
    if (layer === activeLayer && map) {
      const at = placeRef.current(lat, lng);
      if (rgReducedMotion()) map.setView(at, Math.max(map.getZoom(), 15), { animate: false });
      else map.flyTo(at, Math.max(map.getZoom(), 15), { duration: 0.6 });
    }
    else { focusRef.current = [lat, lng]; setActiveLayer(layer); }
  };

  const results = searchAll(query, { cfg, layersByKey, businesses, events: activeEvents });
  const places = cfg.points.map((p) => ({ entityId: p.entityId, title: p.label }));
  const openPoint = (pt) => setSelected({ kind: pt.kind, ref: pt.ref });
  const openEvent = (e) => setSelected({ kind: 'event', ref: e });
  const pickResult = (r) => {
    setQuery('');
    if (r.kind === 'business') return setDirectory({ initialBusinessId: r.ref.id });
    if (r.kind === 'event') return openEvent(r.ref);
    focusOn(r.layer, r.ref.lat, r.ref.lng);
    setSelected({ kind: 'point', ref: r.ref });
  };
  const filterSummary = interests.map((k) => (cfg.interests.find((i) => i.key === k) || {}).short).filter(Boolean).join(' · ');

  let sheet = null;
  if (selected && selected.kind === 'point') {
    sheet = h(RgSheet, { label: selected.ref.label, onClose: () => setSelected(null) },
      h(PlaceCard, { cfg, point: selected.ref, layer: layersByKey[selected.ref.layer], events: activeEvents, today,
        onShare: () => { setSelected(null); setShareOpen(true); }, onOpenEvent: openEvent,
        onOpenCommunity: () => { setSelected(null); setCommunityOpen(true); } }));
  } else if (selected && selected.kind === 'business') {
    const f = selected.ref;
    sheet = h(RgSheet, { label: f.label, onClose: () => setSelected(null) },
      h(BusinessSummary, { cfg, featured: f, business: businesses.find((b) => b.id === f.businessId), layer: layersByKey.business,
        onOpenFull: () => { setSelected(null); setDirectory({ initialBusinessId: f.businessId }); },
        onOpenAll: () => { setSelected(null); setDirectory({}); } }));
  } else if (selected && selected.kind === 'event') {
    sheet = h(RgSheet, { label: selected.ref.title, onClose: () => setSelected(null) },
      h(NowItemDetail, { item: selected.ref, today, onBack: () => setSelected(null) }),
      h('div', { className: 'rg-card-actions rg-event-actions' },
        h(RgShare, { title: selected.ref.title + (selected.ref.date ? ' · ' + rgDateLabel(selected.ref, today) : ''), hash: 'event/' + selected.ref.id }),
        h(RgCalendarButton, { item: selected.ref })));
  }

  // חיפוש וסינון: שני כפתורים עגולים ליד הכותרת (בקשת בעל הפרויקט, 28.10.2026: שלא יסתירו את המפה).
  // החיפוש נפתח לשדה מתחתיהם, ונסגר כשבוחרים תוצאה או כשהשדה ריק ויוצאים ממנו
  const searchShown = searchOpen || query !== '';
  const tools = h('div', { className: 'rg-tools' },
    h('button', { type: 'button', className: 'rg-tool-btn rg-search-btn' + (searchShown ? ' is-on' : ''), 'aria-label': 'חיפוש', title: 'חיפוש מקום או פעילות',
      'aria-expanded': searchShown, 'aria-controls': 'rg-search', onMouseDown: (e) => e.preventDefault(), onClick: () => { if (searchShown) { setQuery(''); setSearchOpen(false); } else setSearchOpen(true); } },
      h(RgIcon, { name: 'search' })),
    h('button', { type: 'button', className: 'rg-tool-btn rg-filter-btn' + (interests.length ? ' is-on' : ''), onClick: () => setFilterOpen(true), 'aria-haspopup': 'dialog',
      'aria-label': 'סינון והתאמה אישית', title: 'סינון והתאמה אישית' },
      h(RgIcon, { name: 'sliders' }),
      interests.length ? h('span', { className: 'rg-filter-count' }, interests.length) : null),
    searchShown ? h('div', { className: 'rg-search' },
      h(RgIcon, { name: 'search', className: 'rg-search-icon' }),
      h('input', { type: 'search', id: 'rg-search', className: 'rg-search-input', placeholder: 'חיפוש מקום או פעילות...', value: query, autoFocus: true,
        onChange: (e) => setQuery(e.target.value), onBlur: (e) => { if (!e.target.value) setSearchOpen(false); },
        onKeyDown: (e) => { if (e.key === 'Escape') { setQuery(''); setSearchOpen(false); } }, 'aria-label': 'חיפוש מקום או פעילות' }),
      query.trim().length >= 2
        ? h('div', { className: 'rg-results', role: 'listbox', 'aria-label': 'תוצאות חיפוש' },
            results.length
              ? results.map((r, i) => h('button', { key: r.kind + i, type: 'button', role: 'option', className: 'rg-result', 'data-kind': r.kind, onMouseDown: (e) => e.preventDefault(), onClick: () => { setSearchOpen(false); pickResult(r); } },
                  h('span', { className: 'rg-result-dot', style: { background: r.color }, 'aria-hidden': 'true' }),
                  h('span', { className: 'rg-result-title' }, r.title),
                  h('span', { className: 'rg-result-layer' }, r.layerLabel)))
              : h('div', { className: 'rg-result-empty' }, 'לא נמצאו תוצאות'))
        : null) : null,
    interests.length ? h('div', { className: 'rg-filter-summary', role: 'status' }, 'מוצג: ' + filterSummary,
      h('button', { type: 'button', className: 'rg-link-btn', onClick: () => setInterests([]) }, 'ניקוי')) : null);

  // המפה ממלאת את כל המסך (בקשת בעל הפרויקט, 20.10.2026): הכותרת, החיפוש, המקרא ופס הפעולות צפים מעליה.
  // המקרא הוא פס צר של אייקונים בצד שמאל שנפתח לפירוט; "מה קורה בעיר?" נפתח מלמטה לפי בקשה
  const shareOn = shareAvailable || inbox;
  return h('main', { className: 'rg-app' },
    h('figure', { className: 'rg-figure' },
      h('div', { className: 'rg-stage' + (moving ? ' is-moving' : '') + (activeLayer ? ' has-layer' : ''), ref: stageRef, 'data-layer': activeLayer || '', 'data-fit': fitted },
        h('div', { className: 'rg-leaflet', ref: mapElRef, dir: 'ltr', role: 'region', 'aria-label': 'מפת רמת גן עם השכונות' }),
        h('div', { className: 'rg-overlay' },
          activeLayer
            ? placed.map((pt) => h(RgPoint, { key: pt.id, pt, layer: layersByKey[activeLayer], active: (selected && selected.ref === pt.ref) || focusId === pt.id, onOpen: openPoint }))
            : null),
        !geo || !ill ? h('div', { className: 'rg-hint' }, 'טוען את המפה...')
          : !activeLayer ? h('div', { className: 'rg-hint' }, 'בחרו שכבה כדי לראות מה יש במפה')
            : !points.length ? h('div', { className: 'rg-hint' }, 'אין נקודות שמתאימות לבחירה') : null)),

    // כל הפקדים בעמודה אחת בצד ימין (בעל הפרויקט, 28.10.2026: "הכל מרוכז בימין והרב פנוי למפה"):
    // כותרת, חיפוש וסינון, השכבות ככפתורים עם שם, ומתחתיהן "מה קורה בעיר?" ו"יש לי משהו להציע".
    // בטלפון: הכותרת והחיפוש למעלה, השכבות והפעולות בשתי שורות למטה
    h('div', { className: 'rg-side' },
    h('div', { className: 'rg-top' },
      h('header', { className: 'rg-head' },
        h('h1', { className: 'rg-title' }, cfg.city),
        h('div', { className: 'rg-tagline' }, cfg.tagline),
        h('div', { className: 'rg-proto', title: 'אב-טיפוס בפיתוח · כל התוכן לדוגמה ולא אומת' },
          h('span', { className: 'rg-proto-long' }, 'אב-טיפוס בפיתוח · כל התוכן לדוגמה ולא אומת'),
          h('span', { className: 'rg-proto-short' }, 'תוכן לדוגמה, לא אומת'))),
      tools,
      h('div', { className: 'rg-style-toggle', role: 'group', 'aria-label': 'סגנון המפה' },
        [['memory', 'מאוירת'], ['detail', 'מפורטת']].map(([k, t]) => h('button', {
          key: k, type: 'button', 'data-style': k, 'aria-pressed': mapStyle === k, className: mapStyle === k ? 'is-on' : '', onClick: () => setMapStyle(k),
        }, t))),
      // שיתוף והורדה (install-app.js נכנס לכאן), קטנים בגודל הכיתוב של המפה (29.10.2026)
      h('div', { className: 'rg-ia-slot' })),

    h('aside', { className: 'rg-panel' + (legendOpen ? ' is-open' : ''), 'aria-label': 'שכבות במפה' },
      h('div', { className: 'rg-layers', id: 'rg-layers', role: 'group', 'aria-label': 'שכבות במפה' },
        // שתי קבוצות: קהילה (מה קורה כאן) וגילוי (מה אפשר למצוא כאן), כל אחת עם שם קצר מעליה
        (cfg.groups || [{ key: 'all', layers: cfg.layers.map((l) => l.key) }]).map((g) => h('div', { key: g.key, className: 'rg-group', 'data-group': g.key, role: 'group', 'aria-label': g.label ? g.label + ': ' + g.question : undefined },
          g.label ? h('div', { className: 'rg-group-head' }, h('span', { className: 'rg-group-label' }, g.label), ' ', h('span', { className: 'rg-group-q' }, g.question)) : null,
        g.layers.map((k) => layersByKey[k]).filter(Boolean).map((l) => h('button', {
          key: l.key, type: 'button', className: 'rg-layer', 'aria-pressed': activeLayer === l.key, 'data-layer': l.key, title: l.label,
          style: { '--c': l.color }, onClick: () => {
            setSelected(null); setFocusId(null);
            // "מה קורה בעיר?" דולקת והפס שלה נסגר: לחיצה נוספת פותחת את הפס שוב (אין כפתור נפרד באותו שם)
            if (l.key === 'now' && activeLayer === 'now' && !eventsDock) return setEventsDock(true);
            const on = activeLayer !== l.key;
            setActiveLayer(on ? l.key : null);
            // שכבת "מה קורה בעיר?" פותחת גם את הפס עם טווחי הזמן; שכבה אחרת מקפלת אותו, כדי שהנקודות שלה יהיו פנויות על המפה
            if (on) setEventsDock(l.key === 'now');
          },
        },
          h('span', { className: 'rg-layer-dot', 'aria-hidden': 'true' }, h(RgIcon, { name: l.key })),
          h('span', { className: 'rg-layer-text' }, h('span', { className: 'rg-layer-label' }, l.label), l.short ? h('span', { className: 'rg-layer-short', 'aria-hidden': 'true' }, l.short) : null, h('span', { className: 'rg-layer-sub' }, l.sub))))))),
      // "על המפה": הערת המפה, העיקרון המנחה והקישור לשירותי העירייה, מקופלים כברירת מחדל
      h('button', { type: 'button', className: 'rg-legend-toggle', 'aria-expanded': legendOpen, 'aria-controls': 'rg-about', 'aria-label': 'על המפה', onClick: () => setLegendOpen((o) => !o) },
        h('span', { className: 'rg-legend-title' }, 'על המפה'), h('span', { className: 'rg-legend-i', 'aria-hidden': 'true' }, 'i'), h('span', { className: 'rg-legend-chev', 'aria-hidden': 'true' }, legendOpen ? '⌃' : '⌄')),
      h('div', { className: 'rg-about' + (legendOpen ? ' is-open' : ''), id: 'rg-about', hidden: !legendOpen },
        h('p', { className: 'rg-maplabel' }, cfg.mapNote),
        cfg.principle ? h('p', { className: 'rg-principle' }, cfg.principle) : null,
        cfg.cityServices ? h('a', { className: 'rg-city-link', href: cfg.cityServices.url, target: '_blank', rel: 'noopener noreferrer' }, cfg.cityServices.label, ' ↗') : null)),

    h('div', { className: 'rg-dock' + (eventsDock ? ' has-events' : '') },
      eventsDock
        ? h(EventsStrip, { buckets, tab, onTab: setTab, today, onOpen: openEvent, onShowAll: () => setEventsOpen(true), filtered: interests.length > 0, onCollapse: () => setEventsDock(false) })
        : null,
      h('div', { className: 'rg-dock-row' },
        activeLayer === 'business'
          ? h('button', { type: 'button', className: 'rg-chip rg-dir-link', onClick: () => setDirectory({}) }, 'לאינדקס העסקים המלא')
          : null,
        activeLayer === 'community'
          ? h('button', { type: 'button', className: 'rg-chip rg-dir-link', 'data-action': 'community', onClick: () => setCommunityOpen(true) }, 'יוזמות ורעיונות שאפשר להצטרף אליהם')
          : null,
        // הפעולה המרכזית נשארת בולטת תמיד, בתחתית העמודה; כשהשיתוף לא זמין (אין מפעיל, או תצוגה מקדימה) היא מסבירה למה
        h('button', { type: 'button', className: 'rg-share' + (shareOn ? '' : ' is-unavailable'), onClick: () => setShareOpen(true), 'aria-haspopup': 'dialog' },
          h('span', { className: 'rg-share-plus', 'aria-hidden': 'true' }, h(RgIcon, { name: 'plus' })),
          h('span', { className: 'rg-share-text' }, h('span', { className: 'rg-share-title' }, 'יש לי משהו להציע'),
            h('span', { className: 'rg-share-sub' }, shareOn ? 'רעיון, יוזמה, אירוע או מקום' : preview ? 'לא פעיל בתצוגה המקדימה' : 'ייפתח כשיהיה מפעיל קהילה')))))),

    eventsOpen ? h(EventsPanel, { buckets, initialTab: tab, today, onClose: () => setEventsOpen(false), onOpen: (e) => { setEventsOpen(false); openEvent(e); } }) : null,
    filterOpen ? h(FilterSheet, { cfg, interests, onChange: setInterests, onClose: () => setFilterOpen(false) }) : null,
    directory ? h(BusinessDirectoryPanel, { allowJoin: false,
      onClose: () => setDirectory(null), title: 'אינדקס העסקים', subtitle: 'עסקים ושירותים למשפחות ברמת גן (לדוגמה)',
      searchPlaceholder: 'חיפוש... למשל בית קפה, צעצועים, שחייה', sourceCredit: cfg.demoNote, initialBusinessId: directory.initialBusinessId,
      // עסק שמסומן במפה: "הצג במפה" מדליק את שכבת העסקים ומסמן את הנקודה שלו
      profileAction: (b) => (cfg.featuredBusinesses.some((f) => f.businessId === b.id)
        ? h('button', { type: 'button', className: 'am-btn link rg-showonmap', 'data-action': 'show-on-map', onClick: () => {
            setDirectory(null); setSelected(null); setFocusId(b.id);
            const f = cfg.featuredBusinesses.find((x) => x.businessId === b.id);
            focusOn('business', f.lat, f.lng);
            if (stageRef.current && stageRef.current.scrollIntoView) stageRef.current.scrollIntoView({ block: 'center', behavior: 'smooth' });
          } }, 'הצג במפה')
        : h('div', { className: 'am-directory-empty' }, 'העסק הזה עדיין לא מסומן במפה')),
    }) : null,
    communityOpen ? h(CommunityPanel, { onClose: () => setCommunityOpen(false), onShare: () => { setCommunityOpen(false); setShareOpen(true); } }) : null,
    shareOpen && inbox ? h(inbox.Panel, { cfg, onClose: () => setShareOpen(false) }) : shareOpen ? (shareAvailable
      ? h(SharePanel, { onClose: () => setShareOpen(false), places, options: rgShareOptions() })
      : h(ShareUnavailable, { preview, onClose: () => setShareOpen(false) })) : null,
    sheet
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(RamatGanApp));

          `<li>לחצו על כפתור השיתוף <span class="ia__ico">${SVG(SHARE)}</span> בתחתית המסך או בשורת הכתובת.</li>` +
          `<li>גללו ובחרו ״הוספה למסך הבית״.</li>` +
          `<li>לחצו ״הוסף״. האייקון יופיע במסך הטלפון.</li></ol>`
        : `<p>כך מתקינים באנדרואיד:</p><ol>` +
          `<li>לחצו על תפריט הדפדפן <span class="ia__ico">${SVG(MENU)}</span> (או ☰ בתחתית המסך בדפדפן של סמסונג).</li>` +
          `<li>בחרו ״התקנת אפליקציה״ או ״הוספה למסך הבית״.</li>` +
          `<li>אשרו. האייקון יופיע במסך הטלפון.</li></ol>`) +
        `<button type="button" class="ia__close">הבנתי</button></div>` +
      `<div class="ia__help ia__ask" role="dialog" aria-label="הוספת אייקון" hidden>` +
        `<p>${ios || android ? 'להוסיף את המפה כאייקון במסך הבית?' : 'להוסיף את המפה כאייקון במחשב?'}</p>` +
        `<p class="ia__note">כך תוכלו לפתוח אותה בלחיצה אחת, כמו אפליקציה.</p>` +
        `<div class="ia__row"><button type="button" class="ia__yes">כן, להוסיף</button><button type="button" class="ia__close ia__no">לא עכשיו</button></div></div>` +
      `<div class="ia__help ia__nudge" role="dialog" aria-label="הורדת המפה" hidden>` +
        `<p>${ios || android ? 'רוצים את המפה בטלפון?' : 'רוצים את המפה במחשב?'}</p>` +
        `<p class="ia__note">מורידים פעם אחת, ואז פותחים אותה בלחיצה מהאייקון, כמו אפליקציה.</p>` +
        `<div class="ia__row"><button type="button" class="ia__yes ia__go">${installLabel || 'התקנה'}</button><button type="button" class="ia__close ia__later">לא עכשיו</button></div></div>`;
    const btn = box.querySelector('.ia__btn');
    const help = box.querySelector('.ia__how');
    const nudge = box.querySelector('.ia__nudge');
    const ask = box.querySelector('.ia__ask');
    const shareBtn = box.querySelector('.ia__share');
    const toast = box.querySelector('.ia__toast');
    let toastTimer = 0;
    const say = (t) => { toast.textContent = t; toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; }, 2600); };
    // הכותרת והקישור בטקסט אחד: וואטסאפ ואפליקציות אחרות מוחקות לפעמים את הטקסט כשהקישור נשלח בשדה נפרד
    const text = shareTitle + '\n' + shareUrl;
    const menu = box.querySelector('.ia__menu');
    menu.querySelectorAll('a[data-net]').forEach((a) => { const n = NETS.find((x) => x.id === a.dataset.net); a.href = n.href(text, shareUrl, shareTitle); });
    // מתחת לכפתור; במסך רחב גם צמוד אליו לרוחב (בטלפון: באמצע המסך)
    const placeUnder = (panel, anchor) => {
      const r = anchor.getBoundingClientRect();
      panel.style.top = Math.round(r.bottom + 8) + 'px';
      if (innerWidth >= 600) {
        const w = panel.offsetWidth, cx = (r.left + r.right) / 2;
        panel.style.left = Math.round(Math.min(Math.max(12, cx - w / 2), innerWidth - w - 12)) + 'px';
        panel.style.right = 'auto'; panel.style.marginInline = '0';
      } else { panel.style.left = panel.style.right = panel.style.marginInline = ''; }
    };
    const openMenu = (open) => {
      menu.hidden = !open; shareBtn.setAttribute('aria-expanded', String(open));
      if (open) placeUnder(menu, shareBtn);
      if (open) { const f = menu.querySelector('.ia__net'); if (f) f.focus(); }
    };
    shareBtn.setAttribute('aria-haspopup', 'menu'); shareBtn.setAttribute('aria-controls', 'ia-share'); shareBtn.setAttribute('aria-expanded', 'false');
    shareBtn.addEventListener('click', (e) => { e.stopPropagation(); toggle(help, false); toggle(ask, false); toggle(nudge, false); openMenu(menu.hidden); });
    menu.addEventListener('click', async (e) => {
      const it = e.target.closest('[data-net]');
      if (!it) return;
      if (it.tagName === 'A') { openMenu(false); return; }
      openMenu(false);
      if (it.dataset.net === 'more') { try { await navigator.share({ title: shareTitle, text }); } catch (_) { /* החלון נסגר */ } return; }
      try { await navigator.clipboard.writeText(text); say('הכותרת והקישור הועתקו. אפשר להדביק בכל מקום.'); }
      catch (_) { window.prompt('העתיקו ושלחו:', text); }
    });
    document.addEventListener('click', (e) => { if (!menu.hidden && !menu.contains(e.target)) openMenu(false); });
    btn.setAttribute('aria-label', installLabel ? installLabel + ' - התקנה כאפליקציה' : 'התקנה כאפליקציה');
    if (ios || android || always) { btn.setAttribute('aria-controls', 'ia-help'); btn.setAttribute('aria-expanded', 'false'); }
    const toggle = (panel, open) => {
      panel.hidden = !open; btn.setAttribute('aria-expanded', String(open));
      if (open) placeUnder(panel, btn);
    };
    const closeAll = () => { toggle(help, false); toggle(ask, false); toggle(nudge, false); btn.focus(); };
    // הכפתור וההצעה עושים אותו דבר: חלון ההתקנה של הדפדפן אם הוא מציע, ואחרת ההסבר לדפדפן הזה
    const install = () => {
      if (!menu.hidden) openMenu(false);
      nudge.hidden = true;
      if (deferred) { toggle(help, false); toggle(ask, ask.hidden); if (!ask.hidden) box.querySelector('.ia__yes').focus(); return; }
      if (ios || android || always) toggle(help, help.hidden);
    };
    btn.addEventListener('click', install);
    nudge.querySelector('.ia__go').addEventListener('click', install);
    nudge.querySelector('.ia__later').addEventListener('click', () => toggle(nudge, false));
    ask.querySelector('.ia__yes').addEventListener('click', async () => {
      toggle(ask, false);
      if (!deferred) return;
      const p = deferred; deferred = null;
      p.prompt();
      try { const r = await p.userChoice; if (r && r.outcome === 'accepted') btn.hidden = true; } catch (_) { /* החלון נסגר */ }
    });
    box.querySelectorAll('.ia__close:not(.ia__later)').forEach((b) => b.addEventListener('click', closeAll));
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!menu.hidden) { openMenu(false); shareBtn.focus(); }
      else if (!help.hidden || !ask.hidden || !nudge.hidden) closeAll();
    });
    btn.hidden = standalone || !(deferred || ios || android || always);
    mount();
    // הצעה עדינה אחת להוריד (בעל הפרויקט, 29.10.2026: "לתת הזדמנות להורדה ולדחוף להורדה"): פעם אחת בכל דפדפן,
    // רק כשאין חלון אחר פתוח. זוכרים שכבר הוצעה בדפדפן עצמו בלבד
    if (nudgeSec && !standalone) setTimeout(() => {
      const key = 'ia-nudge:' + location.pathname;
      try { if (localStorage.getItem(key)) return; } catch (_) { /* אין גישה לאחסון: מציעים, פעם אחת בביקור */ }
      if (btn.hidden || !box.isConnected || !menu.hidden || !help.hidden || !ask.hidden) return;
      try { localStorage.setItem(key, String(Date.now())); } catch (_) { /* בלי אחסון */ }
      toggle(nudge, true);
    }, nudgeSec * 1000);
  }

  // הכותרת בחלק מהעמודים נבנית (ונבנית מחדש) אחרי הטעינה, ולכן מחזירים את הכפתור אליה בכל פעם
  function mount() {
    if (!slotSel) { document.body.append(box); return; }
    const place = () => { if (box.isConnected) return; const slot = document.querySelector(slotSel); if (slot) slot.prepend(box); };
    place();
    new MutationObserver(place).observe(document.body, { childList: true, subtree: true });
  }

  const installBtn = () => box && box.querySelector('.ia__btn');
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; if (box && !standalone) installBtn().hidden = false; });
  window.addEventListener('appinstalled', () => { deferred = null; if (box) installBtn().hidden = true; });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build); else build();
})();
</script><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script></body></html>
