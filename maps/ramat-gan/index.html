  background: radial-gradient(130% 120% at 100% 0%, rgba(26, 76, 149, 0.1), transparent 60%), #fffaf0;
  box-shadow: inset 0 0 0 1px rgba(185, 160, 108, 0.45); transition: box-shadow 0.15s, transform 0.15s;
}
.am-guide-card:hover, .am-guide-card:focus-visible { box-shadow: inset 0 0 0 1.5px #1a4c95, 0 3px 10px rgba(43, 38, 32, 0.08); outline: none; transform: translateY(-1px); }
.am-guide-emoji {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 15px;
  background: radial-gradient(circle at 35% 30%, rgba(26, 76, 149, 0.16), rgba(31, 122, 114, 0.1) 65%, transparent); box-shadow: inset 0 0 0 1px rgba(26, 76, 149, 0.2);
}
.am-guide-card-text { display: flex; flex-direction: column; min-width: 0; }
.am-guide-card-title { font-size: var(--fs-item); font-weight: 600; color: #1a4c95; line-height: 1.25; }
.am-guide-card-label { font-size: var(--fs-meta); color: var(--ink-soft); line-height: 1.3; }
.am-guide-detail { display: flex; flex-direction: column; gap: 5px; }
.am-guide-detail-head { display: flex; align-items: center; gap: 8px; margin: 0 34px 2px 0; }
.am-guide-detail-title { font-size: var(--fs-h2); font-weight: 600; color: #1a4c95; }
.am-guide-p { margin: 0; font-size: var(--fs-item); line-height: 1.55; color: var(--ink); }
.am-guide-links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: var(--fs-meta); }
.am-guide-links a { color: #1a4c95; }
.am-guide-note { font-size: var(--fs-meta); color: var(--ink-soft); }
.am-guide-full {
  align-self: center; margin-top: 2px; padding: 4px 14px; border-radius: 999px; text-decoration: none;
  font-size: var(--fs-chip); color: #1a4c95; box-shadow: inset 0 0 0 1.2px rgba(26, 76, 149, 0.45); background: #fffdf6;
}
.am-guide-full:hover { background: rgba(26, 76, 149, 0.06); }
@media (max-width: 640px) {
  .am-guide-card { padding: 9px 10px; min-height: 52px; }
  .am-guide-full { padding: 6px 16px; min-height: 30px; box-sizing: border-box; display: inline-flex; align-items: center; }
}

/* המקרא נשאר מעל שכבת הקהילה - אפשר לעבור שכבה גם כשהיא פתוחה */
.am-community-layer ~ .am-map-legend { z-index: 6; }

/* ===== "יש לי משהו לשתף" - כפתור קטן ומהבהב (כתום) בתוך המפה, מימין למעלה מתחת לכותרת
   "ארמון הנציב" (שכבת HTML; האיור לא משתנה). הגודל נגזר מרוחב המפה (--map-w), בפרופורציה
   לכותרת, כך שהוא קטן ביחד עם המפה. הפאנל עצמו משתמש בשפה של am-creators-panel / am-flow הקיימים. ===== */
.am-share-fab {
  /* גוון הטרקוטה של כפתורי הפעולה באתר, כהה מעט (#a65a39 - גוון ה-hover הקיים)
     כדי שהטקסט הבהיר יעמוד בניגודיות 4.5:1 */
  /* מיושר לקצה הימני של הכותרת, מתחת ל"מפת השכונה" - אזור פנוי מחוץ לקו המתאר (בבקשת בעל הפרויקט) */
  position: absolute; right: 3.3%; top: 20%; z-index: 6; margin: 0;
  display: flex; align-items: center; gap: 0.4em; width: max-content; box-sizing: border-box;
  padding: 0.38em 0.95em 0.38em 0.6em; border-radius: 999px; border: 1px solid rgba(255, 253, 246, 0.6); background: #a65a39; color: #fffdf6;
  font-family: inherit; font-size: clamp(10px, calc(var(--map-w, 800px) * 0.0125), 13px); font-weight: 600; line-height: 1.25; cursor: pointer;
  box-shadow: 0 2px 0 #7d4129, 0 4px 10px rgba(43, 38, 32, 0.24); animation: am-pulse-orange 2.4s ease-out infinite;
  transition: background 0.12s ease, transform 0.12s ease;
}
/* פלוס קטן בעיגול בהיר - סימן "להוסיף", באותה שפה עגולה של הכפתור */
.am-share-fab::before {
  content: "+"; flex: none; width: 1.2em; height: 1.2em; border-radius: 50%; background: #fffdf6; color: #a65a39;
  display: inline-flex; align-items: center; justify-content: center; font-size: 1em; font-weight: 700; line-height: 1;
}
/* מפה קטנה (טלפון): מחוץ למפה, צמוד לפינה הימנית-התחתונה - בלי לכסות את האיור */
:root[data-share-dock="below"] .am-share-fab { top: calc(100% + 10px); bottom: auto; right: 0; }
:root[data-share-dock="beside"] .am-share-fab { right: auto; left: calc(100% + 10px); top: auto; bottom: 0; }
:root[data-share-dock="below"] .am-share-fab, :root[data-share-dock="beside"] .am-share-fab { font-size: 13px; min-height: 36px; }
.am-share-fab:hover { background: #8f4c2f; }
.am-share-fab:active { transform: translateY(1px); }
.am-share-fab:focus-visible { outline: 3px solid rgba(166, 90, 57, 0.4); outline-offset: 2px; }
.am-share-panel .am-creators-main-title { margin-bottom: 2px; }
.am-share-form .am-creators-back { align-self: flex-start; padding-bottom: 2px; }
.am-share-form-title { text-align: right; font-size: var(--fs-h1); margin: 0; }
.am-share-note { margin: 0 0 2px; font-size: var(--fs-meta); color: var(--olive-deep); line-height: 1.5; }
.am-share-identity { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border-radius: 12px; background: #fbf5e8; box-shadow: inset 0 0 0 1px rgba(185, 160, 108, 0.3); }
.am-share-key-note { margin: 0; font-size: var(--fs-meta); color: var(--ink-soft); line-height: 1.5; }
.am-share-key-note strong { font-weight: 600; color: var(--ink); }
.am-share-who { margin: 0; font-size: var(--fs-meta); color: var(--ink-soft); }
.am-share-error { margin: 0; font-size: var(--fs-meta); color: #9b3b22; background: #fbeae2; border-radius: 10px; padding: 6px 10px; line-height: 1.5; }
.am-share-input[type="datetime-local"], select.am-share-input { min-height: 36px; height: auto; resize: none; }
.am-share-done { display: flex; flex-direction: column; gap: 8px; text-align: center; padding-top: 18px; }
.am-share-text { margin: 0; font-size: var(--fs-item); color: var(--ink); line-height: 1.55; }
.am-share-actions { display: flex; flex-direction: column; align-items: center; gap: 6px; }
@media (pointer: coarse) { .am-share-fab { min-height: 28px; } } /* מגע: יעד נוח בלי להגדיל את הכפתור */
@media (max-width: 640px) {
  .am-share-input[type="datetime-local"], select.am-share-input { font-size: 16px; height: 44px; }
}
/* "השיתופים שלי" - קריאה בלבד, באותה שפה של הפאנל */
.am-share-mine-link { display: block; margin: -4px auto 10px; background: none; border: 0; padding: 2px 6px; font-family: inherit; font-size: var(--fs-meta); color: var(--terracotta); cursor: pointer; }
.am-share-mine { display: flex; flex-direction: column; gap: 6px; }
.am-share-mine .am-creators-back { align-self: flex-start; padding-bottom: 2px; }
.am-share-mine-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.am-share-mine-item { border: 1px solid rgba(185, 160, 108, 0.55); border-radius: 10px; background: #fffaf0; padding: 7px 10px; }
.am-share-mine-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: var(--fs-meta); color: var(--ink-soft); }
.am-share-mine-state { font-weight: 600; padding: 1px 8px; border-radius: 999px; background: #f2e6cc; color: var(--ink); white-space: nowrap; }
.am-share-mine-state[data-state="published"], .am-share-mine-state[data-state="converted"], .am-share-mine-state[data-state="handled"] { background: #e8ecdc; color: var(--olive-deep); }
.am-share-mine-state[data-state="rejected"] { background: #fbeae2; color: #9b3b22; }
.am-share-mine-title { font-size: var(--fs-item); font-weight: 600; color: var(--ink); margin-top: 3px; overflow-wrap: anywhere; }
.am-share-mine-meta { font-size: var(--fs-meta); color: var(--ink-soft); }
.am-share-mine-reason { margin-top: 4px; font-size: var(--fs-meta); color: #9b3b22; line-height: 1.5; overflow-wrap: anywhere; }
@media (max-width: 640px), (pointer: coarse) { .am-share-mine-link { min-height: 36px; } }

/* ===== תלת-מימד לכפתורי האייקון העגולים (11 העוגנים, נקודות צמודות, ונקודות
   "סיפור מקום" עם אייקון). CSS בלבד: מילוי בגרדיאנט רדיאלי עם ברק עליון-ימני,
   שיפוע פנימי (הארה למעלה, הצללה למטה), וצל מדורג רך מתחת - כפתור "מורם".
   לחוץ/פעיל = שקוע: הצל החיצוני כמעט נעלם וההצללה הפנימית מתהפכת.
   גודל, מיקום ואזור-הלחיצה לא משתנים; קובץ האייקון לא משתנה. ===== */
:root {
  --am-btn3d-fill: radial-gradient(circle at 35% 28%, #fffdf7 0%, #fbf3e3 42%, #ecdcbf 100%);
  --am-btn3d-fill-hover: radial-gradient(circle at 35% 28%, #ffffff 0%, #fdf6e8 45%, #f0e0c4 100%);
  --am-btn3d-fill-pressed: radial-gradient(circle at 50% 60%, #f9e6d8 0%, #f1d5c2 60%, #e6c2aa 100%);
  --am-btn3d-raised:
    inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
    inset 0 -2px 3px rgba(120, 84, 48, 0.22),
    0 1px 1px rgba(27, 42, 74, 0.22),
    0 3px 5px -1px rgba(27, 42, 74, 0.22),
    0 7px 12px -4px rgba(27, 42, 74, 0.2);
  --am-btn3d-pressed:
    inset 0 2px 4px rgba(90, 52, 30, 0.32),
    inset 0 -1px 0 rgba(255, 255, 255, 0.6),
    0 0 1px rgba(27, 42, 74, 0.25);
}
.am-hotspot--icon .am-hotspot-icon,
.am-secondary.has-icon[data-layer="place_story"] .am-secondary-icon {
  background: var(--am-btn3d-fill); border-color: rgba(27, 42, 74, 0.32);
  box-shadow: var(--am-btn3d-raised);
  transition: border-color 0.15s ease, box-shadow 0.12s ease, background 0.15s ease, translate 0.12s ease;
}
.am-hotspot--icon:hover .am-hotspot-icon,
.am-secondary.has-icon[data-layer="place_story"]:hover .am-secondary-icon,
.am-secondary.has-icon[data-layer="place_story"]:focus-visible .am-secondary-icon {
  background: var(--am-btn3d-fill-hover); border-color: var(--terracotta);
  box-shadow: var(--am-btn3d-raised), 0 0 0 3px rgba(189, 108, 71, 0.16);
}
.am-hotspot--icon:focus-visible .am-hotspot-icon { background: var(--am-btn3d-fill-hover); box-shadow: var(--am-btn3d-raised); }
.am-hotspot--icon:active .am-hotspot-icon, .am-hotspot--icon.is-active .am-hotspot-icon,
.am-secondary.has-icon[data-layer="place_story"]:active .am-secondary-icon,
.am-secondary.has-icon[data-layer="place_story"].is-active .am-secondary-icon {
  background: var(--am-btn3d-fill-pressed); border-color: var(--terracotta);
  box-shadow: var(--am-btn3d-pressed); translate: 0 1px;
}
@media (max-width: 640px) {
  /* בטלפון לנקודות הסיפור יש מרווח-מגע שקוף (background-clip: content-box), לכן
     הצל החיצוני לא מוצג כאן - רק המילוי התלת-מימדי והטבעת */
  .am-secondary.has-icon[data-layer="place_story"] .am-secondary-icon,
  .am-secondary.has-icon[data-layer="place_story"]:hover .am-secondary-icon,
  .am-secondary.has-icon[data-layer="place_story"].is-active .am-secondary-icon { box-shadow: none; background-clip: content-box; }
}
@media (prefers-reduced-motion: reduce) {
  .am-hotspot--icon .am-hotspot-icon, .am-secondary.has-icon[data-layer="place_story"] .am-secondary-icon { transition: none; }
}

/* 19.10.2026: הכללים של שכבות הקישוט (קו-רקיע, רחוב, ציורי העוגנים) הוסרו - הכל מצויר באיור עצמו. */
/* "עושים קהילה" (בלי הפסים שמסביב - brand-osim-kehila-v3-title.png): גדול יותר, בפינה הימנית-התחתונה
   הפנויה מחוץ לקו המתאר; הכפתור הכחול "הצטרפו" ממורכז מתחתיו, וקו-הרקיע מתחת לשניהם. */
.am-brand { left: auto; right: 2.5%; top: 81.3%; width: 26%; }
.am-legend-dot { left: 84.5%; top: 90.5%; }
/* מפה צרה (טלפון): כרטיס השמנת נמשך מתחת למפה (פס של 104px), ובו "עושים קהילה" עם "הצטרפו" משמאל
   ו"יש לי משהו לשתף" מימין - בלי לכסות את המפה. קו-הרקיע נשאר בתחתית המפה עצמה. */
@container (max-width: 420px) {
  .am-brand { right: auto; left: 4%; top: calc(100% + 10px); width: 44%; z-index: 1; }
  .am-legend-dot { left: 26%; top: calc(100% + 80px); }
  .am-share-fab { z-index: 6; }
}
@media (max-width: 640px) {
  .am-map-stage::before {
    content: ''; position: absolute; inset: 0 0 -70px 0; z-index: -1; border-radius: 12px; background: #faf5ea;
    box-shadow: 0 1px 2px rgba(60,45,25,0.18), 0 6px 14px rgba(60,45,25,0.16), 0 18px 36px rgba(60,45,25,0.14);
  }
  :root[data-share-dock="below"] .am-share-fab { right: 3%; top: calc(100% + 16px); }
}
/* רקע העמוד: אבן ירושלמית עדינה (נכס נפרד /decor/armon-stone-bg.svg); המפה מורמת ממנו בצל רך */
body { background: #e6dcc8 url('/decor/armon-stone-bg.svg') repeat; }
.am-map-stage img.base-photo {
  box-shadow: 0 1px 2px rgba(60,45,25,0.18), 0 6px 14px rgba(60,45,25,0.16), 0 18px 36px rgba(60,45,25,0.14);
}
/* טלפון: המפה ורצועת השמנת שמתחתיה הם כרטיס אחד - בלי צל/פינות בתחתית האיור (אחרי כלל הצל, כדי לגבור עליו) */
@media (max-width: 640px) {
  .am-map-stage img.base-photo { box-shadow: none; border-radius: 12px 12px 0 0; }
}


/* 19.10.2026: כאן היו שלוש קבוצות כללים ישנות ל"עושים קהילה" (חלקן עם !important) שסתרו זו את זו.
   כולן נדרסו ע"י הכלל שלמטה, ולכן הוסרו - זה עכשיו המקום היחיד שקובע את מיקום הכפתור. */
/* Match the blue "עושים קהילה" CTA to the exact compact sizing and placement of "יש לי הצעה". */
.am-map-stage .am-legend-dot.am-brand-button {
  position: absolute !important;
  left: auto !important;
  right: 3.3% !important;
  top: 78.5% !important;
  transform: none !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  flex-direction: row !important;
  gap: 0.4em !important;
  width: max-content !important;
  min-width: 0 !important;
  min-height: 0 !important;
  margin: 0 !important;
  padding: 0.38em 0.95em 0.38em 0.6em !important;
  border: 1px solid rgba(255, 253, 246, 0.6) !important;
  border-radius: 999px !important;
  background: #1f4e8c !important;
  color: #fffdf6 !important;
  font-family: inherit !important;
  font-size: clamp(10px, calc(var(--map-w, 800px) * 0.0125), 13px) !important;
  font-weight: 700 !important;
  line-height: 1.25 !important;
  box-shadow: 0 2px 0 #163a69, 0 4px 10px rgba(31, 78, 140, 0.3) !important;
  animation: am-pulse-blue 2.4s ease-out infinite !important;
  white-space: nowrap !important;
}
.am-map-stage .am-legend-dot.am-brand-button .am-brand-plus {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.25em;
  height: 1.25em;
  border-radius: 50%;
  background: #fffdf6;
  color: #1f4e8c;
  font-size: 0.95em;
  font-weight: 800;
  line-height: 1;
}
.am-map-stage .am-legend-dot.am-brand-button:hover,
.am-map-stage .am-legend-dot.am-brand-button:focus-visible {
  background: #183f73 !important;
  box-shadow: 0 2px 0 #163a69, 0 4px 10px rgba(31, 78, 140, 0.3) !important;
}
.am-map-stage .am-legend-dot.am-brand-button:active { transform: translateY(1px) !important; }
/* מפה צרה (טלפון): שני הכפתורים ברצועת השמנת שמתחת למפה, זה לצד זה - "יש לי הצעה" מימין
   ו"עושים קהילה" משמאל (קודם שניהם ישבו באותה נקודה, והכתום הסתיר את הכחול). */
@container (max-width: 420px) {
  .am-map-stage .am-legend-dot.am-brand-button {
    left: 3.3% !important;
    right: auto !important;
    top: calc(100% + 16px) !important;
    font-size: 13px !important;
    min-height: 36px !important;
  }
}

/* ===================== "הצעות תושבים" (19.10.2026) =====================
   שכבה ירוקה נפרדת (מתג במקרא), סמנים קטנים ושטוחים - לא כפתורים תלת-ממדיים כמו העוגנים.
   הירוק לקוח מהצמחייה של עמק הזיתים. */
.am-scrim[hidden] { display: none; }
/* המקרא גדל לפי התוכן (חמש שורות + הערה), במקום גובה קבוע שנמדד לפי מקרא מצויר שכבר לא באיור */
.am-map-legend { height: auto; justify-content: flex-start; gap: 0.55em; padding-top: 0.9cqw; padding-bottom: 0.9cqw; }
.am-map-legend-toggle { margin-top: 0.35em; padding-top: 0.6em; border-top: 1px dashed rgba(185, 160, 108, 0.7); }
.am-map-legend-toggle .am-map-legend-swatch { background: transparent; box-shadow: inset 0 0 0 1.8px var(--legend-color); }
.am-map-legend-toggle[aria-pressed="true"] .am-map-legend-swatch { background: var(--legend-color); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.55); }
.am-map-legend-toggle[aria-pressed="true"] .am-map-legend-label { color: #2f5f22; }
.am-map-legend-note { display: block; font-size: 0.82em; font-style: normal; color: #4a5a3c; line-height: 1.25; padding: 0 0.2em; }
.am-map-legend-more { background: none; border: 0; cursor: pointer; font-family: inherit; text-align: right; text-decoration: underline; text-underline-offset: 0.18em; }
@container (max-width: 420px) {
  .am-map-legend { gap: 0.35em; padding-top: 3px; padding-bottom: 3px; }
  .am-map-legend-toggle { margin-top: 0.2em; padding-top: 0.35em; }
}

.am-suggestion {
  position: absolute; transform: translate(-50%, -50%); z-index: 3;
  width: 26px; height: 26px; padding: 0; border: 0; background: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  animation: am-secondary-in 0.22s ease-out;
}
.am-suggestion-dot {
  display: block; width: 16px; height: 16px; border-radius: 50%;
  background: var(--suggest-color); border: 2px solid #fffdf6; box-shadow: 0 0 0 1px rgba(47, 95, 34, 0.55);
  transition: transform 0.15s ease;
}
/* כותרת קצרה קבועה מתחת לנקודה (בבקשת בעל הפרויקט, 19.10: נקודה מלאה ולא ריקה/מקווקוות, ושם ליד הנקודה כמו בבאר שבע).
   במעבר עכבר/פוקוס היא מתחלפת בשם המלא שמעל הנקודה. */
.am-suggestion-short {
  position: absolute; left: 50%; top: calc(50% + 11px); transform: translateX(-50%);
  pointer-events: none; white-space: nowrap; padding: 0 6px; border-radius: 999px;
  background: rgba(255, 253, 246, 0.92); color: #2f5f22; box-shadow: 0 0 0 1px rgba(78, 138, 58, 0.35);
  font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.45; transition: opacity 0.15s ease;
}
.am-suggestion:focus-visible .am-suggestion-short, .am-suggestion.is-active .am-suggestion-short { opacity: 0; }
@media (hover: hover) { .am-suggestion:hover .am-suggestion-short { opacity: 0; } }
@media (max-width: 600px) { .am-suggestion-dot { width: 13px; height: 13px; } .am-suggestion-short { top: calc(50% + 8px); padding: 0 4px; font-size: 9px; } }
.am-suggestion:hover .am-suggestion-dot, .am-suggestion:focus-visible .am-suggestion-dot, .am-suggestion.is-active .am-suggestion-dot { transform: scale(1.35); }
.am-suggestion:focus { outline: none; }
.am-suggestion:focus-visible .am-suggestion-dot { outline: 2px solid #2f5f22; outline-offset: 2px; }
.am-suggestion-name {
  position: absolute; left: 50%; bottom: calc(50% + 12px); transform: translate(-50%, 4px);
  opacity: 0; pointer-events: none; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis;
  padding: 2px 9px; border-radius: 999px; background: #fffdf6; color: #2f5f22; border: 1px solid rgba(78, 138, 58, 0.45);
  font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.3; transition: opacity 0.15s ease, transform 0.15s ease;
}
.am-suggestion:focus-visible .am-suggestion-name { opacity: 1; transform: translate(-50%, 0); }
@media (hover: hover) { .am-suggestion:hover { z-index: 7; } .am-suggestion:hover .am-suggestion-name { opacity: 1; transform: translate(-50%, 0); } }
@media (pointer: coarse) { .am-suggestion { width: 36px; height: 36px; } }

/* כרטיס הצעה: קומפקטי, באותה שפה של am-card */
.am-suggestion-card { max-width: 420px; }
.am-suggestion-badge { display: inline-block; margin-bottom: 6px; padding: 2px 10px; border-radius: 999px; background: #e7f0df; color: #2f5f22; font-size: var(--fs-meta); font-weight: 600; }
.am-suggestion-text { margin: 6px 0 10px; font-size: var(--fs-item); line-height: 1.6; color: var(--ink); white-space: pre-line; }
.am-suggestion-meta { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin: 0 0 10px; font-size: var(--fs-meta); }
.am-suggestion-meta dt { color: var(--ink-soft); }
.am-suggestion-meta dd { margin: 0; color: var(--ink); }
.am-suggestion-meta dd[data-status="submitted"], .am-suggestion-meta dd[data-status="rejected"] { color: #8a5a10; }
.am-suggestion-note { margin: 0; font-size: var(--fs-meta); color: var(--ink-soft); line-height: 1.5; }

/* טופס "יש לי הצעה" */
.am-suggest-hint { font-size: var(--fs-meta); color: var(--ink-soft); }
.am-suggest-field-error { font-size: var(--fs-meta); color: #9b3b22; }
.am-suggest-form [aria-invalid="true"] { border-color: #c0573a; box-shadow: 0 0 0 2px rgba(192, 87, 58, 0.18); }
.am-suggest-pick {
  align-self: flex-start; padding: 6px 14px; border-radius: 999px; border: 1.5px dashed #4e8a3a; background: #f3f8ee; color: #2f5f22;
  font-family: inherit; font-size: var(--fs-btn, 13px); font-weight: 600; cursor: pointer;
}
.am-suggest-pick:hover { background: #e7f0df; }
.am-suggest-place-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.am-suggest-place-set { color: #2f5f22; font-weight: 600; font-size: var(--fs-meta); }
.am-suggest-more { margin-top: 2px; }

/* מצב "לסמן מקום במפה": שכבה שקופה מעל כל המפה + הוראה קצרה למעלה */
.am-place-picker { position: absolute; inset: 0; z-index: 20; cursor: crosshair; background: rgba(78, 138, 58, 0.06); border-radius: 12px; box-shadow: inset 0 0 0 3px rgba(78, 138, 58, 0.55); }
.am-place-picker-hint {
  position: absolute; left: 50%; top: 2%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
  padding: 7px 8px 7px 14px; border-radius: 999px; background: #2f5f22; color: #fffdf6; font-size: 14px; font-weight: 600; cursor: default;
  box-shadow: 0 4px 14px rgba(43, 38, 32, 0.25); white-space: nowrap;
}
.am-place-picker-hint button { border: 0; border-radius: 999px; padding: 4px 12px; background: #fffdf6; color: #2f5f22; font-family: inherit; font-weight: 600; cursor: pointer; }
.am-suggestion-pick-mark {
  position: absolute; transform: translate(-50%, -100%); z-index: 4; pointer-events: none;
  width: 16px; height: 16px; border-radius: 50% 50% 50% 0; rotate: -45deg; background: #4e8a3a; border: 2px solid #fffdf6;
  box-shadow: 0 2px 6px rgba(43, 38, 32, 0.3);
}

/* ===================== האיור של בעלת הפרויקט כשכבת המפה (19.10.2026) =====================
   map-background-ref.webp הוא האיור עצמו, בלי העיגולים, המקרא והכפתורים שהיו מצוירים בו.
   כאן כל אלה חוזרים כשכבת HTML חיה, בדיוק במקומות שבהם הם היו מצוירים (מידות באחוזים מהאיור 1273x991). */
.am-hotspot--icon { --am-icon-d: clamp(30px, 6.3cqw, 76px); width: max(44px, calc(var(--am-icon-d) + 6px)); }
.am-hotspot--icon .am-hotspot-icon { padding: 7%; }
@media (hover: hover) { .am-hotspot--icon:hover .am-hotspot-icon { transform: scale(1.12); } }
.am-hotspot--icon:focus-visible .am-hotspot-icon { transform: scale(1.12); }
.am-map-legend { left: 1%; top: 1.5%; width: 13.8%; }
.am-share-fab { right: 2%; top: 17.6%; font-size: clamp(11px, calc(var(--map-w, 800px) * 0.0145), 17px); }
.am-map-stage .am-legend-dot.am-brand-button { right: 1.6% !important; top: 82.4% !important; font-size: clamp(11px, calc(var(--map-w, 800px) * 0.0165), 19px) !important; }
@container (max-width: 420px) {
  .am-hotspot--icon { --am-icon-d: 30px; }
  .am-map-stage .am-legend-dot.am-brand-button { right: auto !important; top: calc(100% + 16px) !important; font-size: 13px !important; }
}

/* ===================== זום וגרירה (19.10.2026, כמו במפת באר שבע) =====================
   .am-viewport חותך; .am-world (האיור וכל הנקודות) מקבל translate+scale מ-usePanZoom ב-anchor-map.js.
   הנקודות מקבלות scale הפוך (--am-inv), כדי שיישארו באותו גודל על המסך בכל זום. */
.am-viewport {
  position: relative; overflow: hidden; border-radius: 12px; background: #f9f3e4;
  touch-action: none; cursor: grab;
  box-shadow: 0 1px 2px rgba(60,45,25,0.18), 0 6px 14px rgba(60,45,25,0.16), 0 18px 36px rgba(60,45,25,0.14);
}
.am-viewport.is-drag { cursor: grabbing; }
.am-viewport.is-drag .am-world * { cursor: grabbing; }
.am-world { position: relative; transform-origin: 0 0; will-change: transform; }
.am-map-stage .am-world img.base-photo { box-shadow: none; border-radius: 0; -webkit-user-drag: none; user-select: none; }
.am-world > .am-hotspot, .am-world > .am-secondary, .am-world > .am-suggestion, .am-world > .am-now-marker {
  transform: translate(-50%, -50%) scale(var(--am-inv, 1));
}
.am-viewport .am-place-picker { border-radius: 0; }
@media (max-width: 640px) {

.rg-tool-btn { position: relative; width: 48px; height: 48px; padding: 0; border-radius: 50%; border: 1px solid var(--rg-line); background: rgba(255,253,248,0.96); color: var(--rg-ink);

/* נקודה: אזור לחיצה 44x44 שמרכזו במיקום; עיגול בצבע השכבה; תווית קצרה לצד */
.rg-pt { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; z-index: 2; }
.rg-pt-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--c); border: 3px solid #fff; box-shadow: 0 2px 7px rgba(16,41,74,0.4); transition: transform 0.12s ease; }

.rg-pt-label { position: absolute; top: 50%; right: calc(100% - 8px); transform: translateY(-50%); white-space: nowrap; font-size: 13px; font-weight: 600; line-height: 1.2; color: var(--rg-ink); background: rgba(255,253,248,0.97); border-radius: 999px; padding: 3px 10px; pointer-events: none; box-shadow: 0 2px 6px rgba(16,41,74,0.18); border: 1.5px solid var(--c); }
.rg-pt.is-flip .rg-pt-label { right: auto; left: calc(100% - 8px); }

.rg-pt.is-up .rg-pt-label { top: auto; bottom: calc(100% - 10px); }
.rg-pt.is-down .rg-pt-label { top: calc(100% - 10px); }
.rg-pt.is-label-hidden .rg-pt-label { visibility: hidden; }
/* אין מקום לתווית המלאה: מקוצרת (השם המלא במעבר עכבר ובקורא מסך) */
.rg-pt.is-short .rg-pt-label { max-width: 76px; overflow: hidden; text-overflow: ellipsis; }
.rg-pt.is-short:hover .rg-pt-label, .rg-pt.is-short:focus-visible .rg-pt-label { max-width: none; z-index: 3; }
/* מיקום לדוגמה (לא כתובת מאומתת): עיגול עם קו מקווקו */
.rg-pt.is-approx .rg-pt-dot { border-style: dashed; }
@media (prefers-reduced-motion: reduce) { .rg-layer, .rg-pt-dot, .rg-overlay { transition: none; } }

function useFetch(url, deps) {
  const [data, setData] = useState(null);
  useEffect(() => {
    if (!url) return;
    let cancelled = false;
    fetch(url).then((r) => r.json()).then((d) => { if (!cancelled) setData(d); });
    return () => { cancelled = true; };
  }, deps);
  return data;
}

/** זום וגרירה במפה (מחליף את useMapZoom מ-PR #55, שנבנה על המבנה הקודם של הבמה) - אותה התנהגות כמו במפת באר שבע (neighborhood-map.js): כפתורי +/−/מרכוז, גלגלת,
 *  צביטה בשתי אצבעות, וגרירה בכל רמת זום - גם כשהגרירה מתחילה על כפתור (לחיצה בלי תזוזה עדיין פותחת אותו).
 *  הכל קורה בשכבה אחת (.am-world) שעליה האיור וכל הנקודות; המקרא, הכפתורים והחלונות לא זזים.
 *  הנקודות נשארות באותו גודל על המסך בכל זום (--am-inv ב-CSS). מצב הזום לא נשמר - כל טעינה מתחילה מהמפה המלאה. */
const ZOOM_MIN = 1, ZOOM_MAX = 2.8;
function usePanZoom() {
  const viewportRef = React.useRef(null), worldRef = React.useRef(null);
  const st = React.useRef({ z: 1, x: 0, y: 0, min: 1, fit: true });
  const [zoomLevel, setZoomLevel] = useState(1);
  const apply = useCallback(() => {
    const vp = viewportRef.current, w = worldRef.current;
    if (!vp || !w) return;
    const W = vp.clientWidth, H = vp.clientHeight, s = st.current;
    // המפה ממלאת את כל המסך (20.10.2026). במסך שוכב האיור כולו נכנס (לפי הגובה), והשוליים בצבע הנייר של האיור;
    // במסך עומד (טלפון) הזום המינימלי ממלא יותר מהגובה - עד פי 1.7 מהאיור ברוחב המסך, כמו קודם - והשאר נחשף בגרירה
    const ww = w.offsetWidth || W, wh = w.offsetHeight || H;
    const contain = Math.min(W / ww, H / wh), cover = Math.max(W / ww, H / wh);
    s.min = W >= H ? contain : Math.min(cover, contain * 1.7);
    if (s.fit) { s.z = s.min; s.x = (W - ww * s.z) / 2; s.y = (H - wh * s.z) / 2; } // מתחילים ממרכז השכונה
    else s.z = Math.min(s.min * ZOOM_MAX, Math.max(s.min, s.z));
    // גבולות הגרירה: עד קצה האיור, ועוד רבע מהשטח כדי שהגרירה תורגש גם במפה המלאה (כמו בבאר שבע)
    const sx = W * 0.25, sy = H * 0.25;
    s.x = Math.min(sx, Math.max(W - ww * s.z - sx, s.x));
    s.y = Math.min(sy, Math.max(H - wh * s.z - sy, s.y));
    w.style.transform = `translate(${s.x}px, ${s.y}px) scale(${s.z})`;
    vp.style.setProperty('--am-inv', String(1 / s.z));
  }, []);
  const zoomBy = useCallback((k, cx, cy) => {
    const vp = viewportRef.current;
    if (!vp) return;
    const s = st.current, r = vp.getBoundingClientRect();
    const z1 = Math.min(s.min * ZOOM_MAX, Math.max(s.min, s.z * k));
    if (z1 === s.z) return;
    s.fit = false;
    const px = (cx == null ? r.left + r.width / 2 : cx) - r.left, py = (cy == null ? r.top + r.height / 2 : cy) - r.top;
    s.x = px - (px - s.x) * (z1 / s.z);
    s.y = py - (py - s.y) * (z1 / s.z);
    s.z = z1;
    apply();
    setZoomLevel(z1 / s.min);
  }, [apply]);
  const recenter = useCallback(() => { st.current.fit = true; apply(); setZoomLevel(1); }, [apply]);
  useEffect(() => {
    const vp = viewportRef.current;
    if (!vp) return undefined;
    const pts = new Map();
    let last = null, pinch = null, dragged = false, start = null;
    const down = (e) => {
      if (e.button) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      last = { x: e.clientX, y: e.clientY };
      if (pts.size === 1) { start = last; dragged = false; }
      if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: st.current.z }; dragged = true; }
    };
    const move = (e) => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 2 && pinch) {
        const [a, b] = [...pts.values()];
        zoomBy((pinch.z * (Math.hypot(a.x - b.x, a.y - b.y) / pinch.d)) / st.current.z, (a.x + b.x) / 2, (a.y + b.y) / 2);
        return;
      }
      if (pts.size === 1 && last) {
        if (!dragged) {
          if (Math.abs(e.clientX - start.x) + Math.abs(e.clientY - start.y) < 6) return; // רעד קטן בלחיצה אינו גרירה
          dragged = true; vp.classList.add('is-drag');
          if (!vp.hasPointerCapture(e.pointerId)) vp.setPointerCapture(e.pointerId);
        }
        st.current.fit = false;
        st.current.x += e.clientX - last.x; st.current.y += e.clientY - last.y;
        last = { x: e.clientX, y: e.clientY };
        apply();
      }
    };
    // אחרי גרירה - הלחיצה שבסופה לא פותחת כפתור ולא קובעת מקום להצעה
    const click = (e) => { if (dragged) { e.preventDefault(); e.stopPropagation(); } dragged = false; };
    const end = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) { last = null; vp.classList.remove('is-drag'); } };
    const wheel = (e) => {
      if (e.deltaY > 0 && st.current.z <= st.current.min) return; // במפה המלאה גלילה למטה נשארת גלילה של העמוד
      e.preventDefault();
      zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY);
    };
    vp.addEventListener('pointerdown', down);
    vp.addEventListener('pointermove', move);
    vp.addEventListener('click', click, true);
    vp.addEventListener('pointerup', end);
    vp.addEventListener('pointercancel', end);
    vp.addEventListener('wheel', wheel, { passive: false });
    const ro = typeof ResizeObserver === 'function' ? new ResizeObserver(apply) : null;
    if (ro) { ro.observe(vp); if (worldRef.current) ro.observe(worldRef.current); } // האיור נטען אחרי החלון
    return () => {
      vp.removeEventListener('pointerdown', down); vp.removeEventListener('pointermove', move); vp.removeEventListener('click', click, true);
      vp.removeEventListener('pointerup', end); vp.removeEventListener('pointercancel', end); vp.removeEventListener('wheel', wheel);
      if (ro) ro.disconnect();
    };
  }, [apply, zoomBy]);
  return { viewportRef, worldRef, zoomBy, recenter, zoomLevel };
}

function isWhatsappLink(url) {
  return /wa\.me|chat\.whatsapp\.com/i.test(url);
}

/** פייסבוק חוסם iframe embedding באופן גורף (X-Frame-Options ברמת הפלטפורמה,
 *  לא ספציפי לעמוד) - לכן כמו וואטסאפ, קישור לפייסבוק נפתח בטאב חדש ולא
 *  מנסה הטמעה בפאנל שממילא תיכשל. */
function isFacebookLink(url) {
  return /(^|\.)facebook\.com\//i.test(url);
}

/** תיקון תצוגה בלבד - חלק מתוכן ה-description במקור (Genially) מגיע HTML-encoded,
 *  לפעמים encoded פעמיים (למשל "&amp;amp;" עבור "&") - בדיוק אותה תופעה שכבר
 *  טופלה כאן ידנית ל-YouTube URLs (normalizeYoutubeEmbedUrl למעלה). לא משנה
 *  שום תוכן במקור/DB - רק מפענח entities לפני תצוגה, כדי שהתושב לא יראה
 *  "&amp;" גולמי על המסך. שימוש ב-textarea.innerHTML הוא דרך בטוחה לפענוח
 *  entities בדפדפן (לא מריץ HTML/JS - רק טקסט). לולאה חוזרת (עד 3 פעמים,
 *  עוצרת כשאין יותר שינוי) כדי לכסות גם double-encoding בלי להניח מראש כמה
 *  פעמים קודד. */
function decodeHtmlEntities(str) {
  if (!str) return str;
  let prev = str;
  for (let i = 0; i < 3; i++) {
    const el = document.createElement('textarea');
    el.innerHTML = prev;
    const next = el.value;
    if (next === prev) break;
    prev = next;
  }
  return prev;
}

function normalizeYoutubeEmbedUrl(rawUrl) {
  let url = rawUrl.replace(/&amp;/g, '&');
  // עטיפת embedly (cdn.embedly.com/widgets/media.html?src=<YouTube מקודד>) -
  // ה-URL המקורי של YouTube נמצא בפרמטר src; משתמשים בו ישירות.
  const embedlySrc = /embedly\.com\//.test(url) && url.match(/[?&]src=([^&]+)/);
  if (embedlySrc) {
    const innerId = decodeURIComponent(embedlySrc[1]).match(/(?:youtube\.com\/embed\/|youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/);
    if (innerId) return 'https://www.youtube.com/embed/' + innerId[1];
  }
  const watchMatch = url.match(/[?&]v=([^&]+)/);
  const shortMatch = url.match(/youtu\.be\/([^?&]+)/);
  const embedMatch = url.match(/\/embed\/([^?&]+)/);
  const videoId = (embedMatch && embedMatch[1]) || (watchMatch && watchMatch[1]) || (shortMatch && shortMatch[1]) || null;
  if (!videoId) return url; // כולל URLs מסוג embedly - עוברים כמו שהם, זה פורמט-iframe תקין בפני עצמו
  // הנגן תמיד על סרטון בודד: פרמטרי רשימת-השמעה (list/index) לא מועברים
  const params = (url.includes('?') ? url.slice(url.indexOf('?') + 1) : '')
    .split('&').filter((kv) => kv && !/^(list|index)=/.test(kv)).join('&');
  return 'https://www.youtube.com/embed/' + videoId + (params ? '?' + params : '');
}

/** מזהה YouTube מתוך כל צורת URL שנשמרה (embed / watch / youtu.be / embedly). */
function youtubeIdOf(rawUrl) {
  const m = normalizeYoutubeEmbedUrl(rawUrl).match(/youtube\.com\/embed\/([\w-]{11})/);
  return m ? m[1] : null;
}

/* ===================== גלריית סרטונים =====================
   נקודה/אדם יכולים להחזיק כמה סרטונים. סרטון אחד - נגן אחד כמו קודם. כמה -
   נגן אחד + שורת תמונות-ממוזערות לבחירה (תמונות YouTube עצמן, בלי אירוח
   מחדש), כך שהחלון לא גדל עם מספר הסרטונים. */
function VideoGallery({ videos, className }) {
  const [active, setActive] = useState(0);
  if (!videos || !videos.length) return null;
  const idx = Math.min(active, videos.length - 1);
  const player = h('div', { className: 'am-video-wrap' + (className ? ' ' + className : '') },
    h('iframe', {
      key: videos[idx].url, className: 'am-video-frame', src: normalizeYoutubeEmbedUrl(videos[idx].url), frameBorder: 0,
      title: videos[idx].title || ('סרטון ' + (idx + 1)),
      allow: 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture', allowFullScreen: true,
    }));
  if (videos.length === 1) return player;
  return h('div', { className: 'am-video-gallery' },
    player,
    h('div', { className: 'am-video-list', role: 'tablist', 'aria-label': 'סרטונים' },
      videos.map((v, i) => {
        const id = youtubeIdOf(v.url);
        return h('button', {
          key: v.url, className: 'am-video-choice' + (i === idx ? ' is-active' : ''), role: 'tab', 'aria-selected': i === idx,
          onClick: () => setActive(i),
        },
          id ? h('img', { src: 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg', alt: '', loading: 'lazy', onError: (e) => { e.currentTarget.style.display = 'none'; } }) : null,
          h('span', null, v.title || ('סרטון ' + (i + 1))));
      })));
}

/* ===================== כרטיס כללי - לא מותאם ידנית לאף נקודה ===================== */
/* מציג רק שדות שקיימים בפועל. שדה ריק = לא מוצג, לא ממולא בתחליף. */

function EntityCard({ entityId, onClose, fetchUrl }) {
  // fetchUrl: נקודת-משנה של שכבה (/api/secondary-points/:id) - אותו מבנה ישות,
  // עם כותרת מתוקנת, טקסט בלי פרטי קשר פרטיים, וקישורי-מקור נוספים (extraLinks).
  const entity = useFetch(entityId ? (fetchUrl || '/api/entities/' + entityId) : null, [entityId, fetchUrl]);
  // תצוגת אתר מוטמע בתוך אותו פאנל (לא טאב חדש) - state מקומי לכרטיס, מתאפס
  // כשעוברים לישות אחרת כדי שלא "יידלק" מוטמע ישן על ישות חדשה.
  const [websiteEmbedOpen, setWebsiteEmbedOpen] = useState(false);
  useEffect(() => { setWebsiteEmbedOpen(false); }, [entityId]);
  if (!entityId) return null;

  if (!entity) {
    return h('div', { className: 'am-scrim', onClick: onClose },
      h('div', { className: 'am-card', onClick: (e) => e.stopPropagation() }, h('div', { className: 'am-card-body no-hero' }, 'טוען...'))
    );
  }

  const allMedia = (entity.media || []).filter((m) => m.url);
  const videos = allMedia.filter((m) => m.type === 'YOUTUBE' || m.type === 'VIDEO');
  const images = allMedia.filter((m) => m.type === 'IMAGE');
  const otherLinks = allMedia.filter((m) => m.type !== 'YOUTUBE' && m.type !== 'VIDEO' && m.type !== 'IMAGE'); // למשל EMBED - קישור לפרויקט Genially אחר, לא ניתן להטמעה
  // וידאו הוא תוכן ראשי כשקיים - הוא תופס את שטח ה-hero, לא תמונה.
  // תמונה הופכת ל-hero רק כשאין וידאו כלל. שאר התמונות -> גלריה משנית.
  const heroImage = videos.length === 0 ? images[0] : null;
  const galleryImages = videos.length === 0 ? images.slice(1) : images;
  const hasDescription = !entity.isPlaceholder && entity.description;
  const link = LINK_OVERRIDE_BY_TITLE[entity.title] || entity.link || null;
  const linkIsWhatsapp = link && isWhatsappLink(link);
  const hasHero = videos.length > 0 || !!heroImage;
  // "איך מגיעים" - מ-entity.directions הקיים (Phase 4), רק אם יש שם קישור שמיש בפועל
  const directionsLink = (entity.directions || []).map((d) => d.link).find((l) => !!l) || null;
  const extraLinks = entity.extraLinks || [];
  const hasActions = !!link || otherLinks.length > 0 || !!directionsLink || extraLinks.length > 0;
  /** אייקון landmark נעול (אם יש לישות הזו אחד) - אותו מיפוי כמו על המפה עצמה,
   *  מוצג כאן רק כזיהוי חזותי נוסף בכרטיס - לא נוגע/משנה את קובץ האייקון. */
  const lockedIcon = LOCKED_ICON_ASSET_BY_TITLE[entity.title];
  // קישור ראשי (לא וואטסאפ) נפתח בתוך אותו פאנל (iframe), לא בטאב חדש - זהה
  // לכל ישות עם קישור, לא רק ל"מרכז הספורט" (הכרטיס נשאר גנרי, כפי שהיה).

  return h('div', { className: 'am-scrim', onClick: onClose },
    h('div', { className: 'am-card' + (entity.secondaryPointId ? ' am-card--secondary' : ''), onClick: (e) => e.stopPropagation() },
      h('button', { className: 'close-btn', onClick: onClose, 'aria-label': 'סגור' }, '✕'),
      websiteEmbedOpen && link
        ? h('div', { className: 'am-embed-wrap' },
            h('div', { className: 'am-embed-bar' },
              h('button', { className: 'am-embed-back', onClick: () => setWebsiteEmbedOpen(false) }, '‹ חזרה'),
              h('span', { className: 'am-embed-title' }, entity.title || '')
            ),
            h('iframe', {
              className: 'am-embed-frame', src: link, title: entity.title || 'אתר חיצוני',
              sandbox: 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox',
            }),
            h('div', { className: 'am-embed-note' }, 'אם התוכן לא נטען כאן, ייתכן שהאתר החיצוני חוסם הצגה בתוך חלון מוטמע.')
          )
        : h(React.Fragment, null,
            videos.length
              ? h(VideoGallery, { key: entityId, videos })
              : heroImage ? h('img', { className: 'am-card-hero', src: heroImage.url, alt: '' }) : null,
            h('div', { className: 'am-card-body' + (hasHero ? '' : ' no-hero') },
              lockedIcon ? h('img', { className: 'am-card-locked-icon', src: lockedIcon, alt: '' }) : null,
              h('h2', { className: 'am-card-title' }, entity.title || '(ללא כותרת)'),
              entity.category ? h('div', { className: 'am-card-category' }, CATEGORY_LABELS[entity.category] || entity.category) : null,
              hasDescription ? h('p', { className: 'am-card-desc' }, decodeHtmlEntities(entity.description)) : null,
              galleryImages.length
                ? h('div', { className: 'am-gallery' }, galleryImages.map((m, i) => h('img', { key: i, src: m.url, alt: '' })))
                : null,
              hasActions
                ? h('div', { className: 'am-actions' },
                    link
                      ? (linkIsWhatsapp
                          ? h('a', { key: 'main', className: 'am-btn whatsapp', href: link, target: '_blank', rel: 'noreferrer' }, 'פתח בוואטסאפ ↗')
                          : isFacebookLink(link)
                          ? h('a', { key: 'main', className: 'am-btn link', href: link, target: '_blank', rel: 'noreferrer' }, 'פתח בפייסבוק ↗')
                          : h('button', { key: 'main', className: 'am-btn link', onClick: () => setWebsiteEmbedOpen(true) }, 'פתח את אתר ' + (entity.title || '') + ' ↗'))
                      : null,
                    extraLinks.map((l, i) => h('a', { key: 'x' + i, className: 'am-btn ' + (l.kind === 'whatsapp' ? 'whatsapp' : 'link'), href: l.url, target: '_blank', rel: 'noreferrer' }, l.label + ' ↗')),
                    otherLinks.map((m, i) => h('a', { key: 'o' + i, className: 'am-btn link', href: m.url, target: '_blank', rel: 'noreferrer' }, 'מקור נוסף ↗')),
                    directionsLink ? h('a', { key: 'directions', className: 'am-btn link', href: directionsLink, target: '_blank', rel: 'noreferrer' }, 'איך מגיעים ↗') : null
                  )
                : null,
              entity.sourceType === 'synthetic_demo'
                ? h('div', { className: 'am-card-credit' }, 'תוכן לדוגמה - לא מידע מאומת')
                : h('div', { className: 'am-card-credit' }, 'Genially source: ' + (entity.source.slideId || '-').slice(0, 8) + ' / ' + (entity.source.elementId || '-').slice(0, 8))
            )
          )
    )
  );
}

/** סרט-המסלול: פס דק בגווני צבעי-מים מעל האפשרויות (סמן מתודולוגי, לא כפתורים).
 *  highlight - השלבים שהמסך הנוכחי ממחיש. "השתתפות" ממשיכה לפתוח את פאנל
 *  האירועים הקיים. */
function CreatorsJourney({ onOpenEvents, highlight }) {
  const on = highlight || [];
  return h('div', { className: 'am-journey am-ribbon' + (on.length ? ' has-focus' : ''), role: 'list', 'aria-label': 'המסלול: ' + JOURNEY_STAGES.map((s) => s.label).join(', ') },
    JOURNEY_STAGES.map((s, i) => {
      const cls = 'am-journey-stage am-ribbon-stage am-ribbon-' + s.key + (on.includes(s.key) ? ' is-on' : '');
      const label = h('span', { className: 'am-journey-stage-label' }, s.label);
      return h(React.Fragment, { key: s.key },
        i ? h('span', { className: 'am-journey-arrow', 'aria-hidden': 'true' }, '←') : null,
        s.key === 'participation' && onOpenEvents
          ? h('button', { className: cls + ' am-journey-stage--live', role: 'listitem', onClick: onOpenEvents, title: 'מה קורה בשכונה' }, label)
          : h('span', { className: cls, role: 'listitem', 'data-stage': s.key }, label));
    })
  );
}

/** כרטיס-ההזמנה: התשובות כפי שנכתבו, כטקסט שאפשר להעתיק/לשתף. */
function flowShareText(flow, values) {
  const lines = [flow.resultTitle];
  if (flow.kicker) lines[0] += ' (' + flow.kicker + ')';
  flow.fields.forEach((f) => { if (values[f.key] && values[f.key].trim()) lines.push('', f.label, values[f.key].trim()); });
  lines.push('', 'עושים קהילה - ' + location.origin + location.pathname);
  return lines.join('\n');
}

/** מסלול MVP ("הזמנה לשיחה קהילתית" / "מובילים יוזמה קהילתית") באותה חלונית:
 *  הסבר קצר ← 3 שאלות ← כרטיס הזמנה להעתקה/שיתוף. כלום לא נשמר ולא נשלח. */
function CreatorsFlow({ kind, onBack, onSwitch, onOpenEvents }) {
  const flow = CREATORS_FLOWS[kind];
  const [values, setValues] = useState({});
  const [done, setDone] = useState(false);
  const [copied, setCopied] = useState(false);
  const first = flow.fields[0].key;
  const ready = !!(values[first] && values[first].trim());
  const text = flowShareText(flow, values);
  const canShare = typeof navigator.share === 'function';
  const copy = () => {
    const ok = () => { setCopied(true); setTimeout(() => setCopied(false), 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, () => {});
  };

  return h('div', { className: 'am-flow', 'data-flow': kind },
    h('button', { className: 'am-creators-back', onClick: done ? () => setDone(false) : onBack }, done ? '‹ עריכה' : '‹ חזרה'),
    h(CreatorsJourney, { onOpenEvents, highlight: flow.stages }),
    h('div', { className: 'am-flow-head' },
      h('span', { className: 'am-flow-emoji', 'aria-hidden': 'true' }, flow.emoji),
      h('div', null,
        h('div', { className: 'am-creators-title am-flow-title' }, flow.title),
        h('div', { className: 'am-flow-kicker' }, flow.kicker))),
    done
      ? h('div', { className: 'am-flow-result' },
          h('div', { className: 'am-invite-card', 'aria-label': flow.resultTitle },
            h('div', { className: 'am-invite-card-title' }, flow.resultTitle),
            flow.fields.filter((f) => values[f.key] && values[f.key].trim()).map((f) =>
              h('div', { key: f.key, className: 'am-invite-card-row' },
                h('div', { className: 'am-invite-card-q' }, f.label),
                h('div', { className: 'am-invite-card-a' }, values[f.key].trim())))),
          h('div', { className: 'am-flow-actions' },
            h('button', { className: 'am-btn link am-flow-copy', onClick: copy }, copied ? 'הועתק ✓' : 'העתקת ההזמנה'),
            canShare
              ? h('button', { className: 'am-btn secondary am-flow-share', onClick: () => navigator.share({ title: flow.resultTitle, text }).catch(() => {}) }, 'שיתוף')
              : h('a', { className: 'am-btn secondary am-flow-share', href: 'https://wa.me/?text=' + encodeURIComponent(text), target: '_blank', rel: 'noopener noreferrer' }, 'שיתוף בוואטסאפ ↗')),
          h('div', { className: 'am-flow-note' }, 'ההזמנה לא נשמרת ולא נשלחת מהאתר - אתם בוחרים עם מי לשתף.'),
          h('button', { className: 'am-flow-next', onClick: () => onSwitch(flow.next.to) }, flow.next.label))
      : h('form', { className: 'am-flow-form', onSubmit: (e) => { e.preventDefault(); if (ready) setDone(true); } },
          h('p', { className: 'am-flow-intro' }, flow.intro),
          flow.steps ? h('ol', { className: 'am-flow-steps' }, flow.steps.map((st) => h('li', { key: st }, st))) : null,
          flow.fields.map((f) => h('label', { key: f.key, className: 'am-flow-field' },
            h('span', { className: 'am-flow-label' }, f.label),
            h('textarea', {
              className: 'am-flow-input', name: f.key, rows: 2, maxLength: 400, placeholder: f.placeholder,
              value: values[f.key] || '', onChange: (e) => setValues(Object.assign({}, values, { [f.key]: e.target.value })),
            }))),
          h('button', { type: 'submit', className: 'am-btn link am-flow-submit', disabled: !ready }, flow.submit),
          flow.sources ? h('div', { className: 'am-flow-sources' },
            h('span', null, 'מה זה קפה עולם?'),
            flow.sources.map((src) => h('a', { key: src.url, href: src.url, target: '_blank', rel: 'noopener noreferrer' }, src.label))) : null)
  );
}

/* ===================== מסלולי הטיול של ארמון הנציב =====================
   שלוש טבעות הטיול של גורי (lib/walkingRoutes.ts, /api/walking-routes) כחוויה
   פנימית - לא שכבת מפה ולא קישור ל-Genially. מסך הפתיחה: שלוש טבעות חופפות
   (איור סכמטי - לא מפה ולא מסלול גאוגרפי), כל טבעת היא כפתור. מסך מסלול:
   מקום שמור למפה + משך / קושי / תושבים מארחים - "בהכנה" כל עוד אין במקור. */
const ROUTE_FIELDS = [
  { key: 'duration', label: 'משך המסלול' },
  { key: 'difficulty', label: 'דרגת קושי' },
  { key: 'residentHosts', label: 'תושבים מארחים' },
];
// מיקומי הטבעות בסכמה (כמו בשקף המקור: אחת למעלה, שתיים למטה, חופפות)
const ROUTE_RINGS = [{ cx: 50, cy: 34 }, { cx: 33, cy: 64 }, { cx: 67, cy: 64 }];
const ROUTE_RING_R = 22;

/** טבעת "מצוירת ביד": עיגול עם רעד קל ופתח קטן - קו דק, בלי מילוי */
function sketchRing(cx, cy, r, seed) {
  const pts = [];
  for (let i = 0; i <= 90; i++) {
    const a = (i / 90) * Math.PI * 2 * 0.985 + seed;
    const rr = r * (1 + 0.022 * Math.sin(i * 0.33 + seed * 3) + 0.008 * Math.sin(i * 1.1));
    pts.push((cx + rr * Math.cos(a)).toFixed(2) + ' ' + (cy + rr * Math.sin(a)).toFixed(2));
  }
  return 'M' + pts.join(' L');
}

function WalkingRoutes({ routeId, onRoute, onBack }) {
  const data = useFetch('/api/walking-routes', []);
  if (!data || data.error) {
    return h('div', { className: 'am-routes' },
      h('button', { className: 'am-creators-back', onClick: onBack }, '‹ חזרה'),
      h('div', { className: 'am-directory-empty' }, data ? 'המידע אינו זמין כרגע' : 'טוען...'));
  }
  const route = routeId ? data.routes.find((r) => r.id === routeId) : null;
  const credit = h('div', { className: 'am-routes-credit' }, data.attribution);
  if (route) {
    const i = data.routes.indexOf(route);
    return h('div', { className: 'am-routes am-route', 'data-route': route.id },
      h('button', { className: 'am-creators-back', onClick: () => onRoute(null) }, '‹ כל המסלולים'),
      h('div', { className: 'am-route-head' },
        h('svg', { className: 'am-route-mark am-ring-' + i, viewBox: '0 0 40 40', 'aria-hidden': 'true' },
          h('path', { d: sketchRing(20, 20, 15, i) })),
        h('div', { className: 'am-creators-title am-route-title' }, route.title)),
      route.mapAsset
        ? h('img', { className: 'am-route-map', src: route.mapAsset.src, alt: route.mapAsset.alt })
        : h('div', { className: 'am-route-map am-route-map--pending', role: 'img', 'aria-label': 'המפה בהכנה' }, 'המפה בהכנה'),
      h('dl', { className: 'am-route-fields' },
        ROUTE_FIELDS.map((f) => h('div', { key: f.key, className: 'am-route-field', 'data-field': f.key },
          h('dt', null, f.label),
          h('dd', { className: route[f.key] ? '' : 'is-pending' }, route[f.key] || 'בהכנה')))),
      h('div', { className: 'am-routes-note' }, 'המסלול עדיין בפיתוח'),
      credit);
  }
  return h('div', { className: 'am-routes' },
    h('button', { className: 'am-creators-back', onClick: onBack }, '‹ חזרה'),
    h('div', { className: 'am-creators-title am-routes-title' }, data.title),
    h('div', { className: 'am-routes-rings', role: 'group', 'aria-label': 'שלוש טבעות הטיול' },
      h('svg', { className: 'am-routes-svg', viewBox: '0 0 100 100', 'aria-hidden': 'true' },
        data.routes.slice(0, 3).map((r, k) => h('path', { key: r.id, className: 'am-ring-' + k, 'data-ring': r.id, d: sketchRing(ROUTE_RINGS[k].cx, ROUTE_RINGS[k].cy, ROUTE_RING_R, k * 1.3) }))),
      data.routes.slice(0, 3).map((r, k) => h('button', {
        key: r.id, type: 'button', className: 'am-routes-ring am-ring-' + k, 'data-route': r.id,
        style: { left: ROUTE_RINGS[k].cx + '%', top: ROUTE_RINGS[k].cy + '%' },
        onClick: () => onRoute(r.id),
      }, r.title))),
    h('div', { className: 'am-routes-note' }, 'המסלולים עדיין בפיתוח'),
    credit);
}

/** סמל המצפן במרכז: עיגול "מצויר", מחט, וסימוני כיוון קצרים - אוריינטציה, לא רכזת */
function CompassMark() {
  const ticks = [];
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 - Math.PI / 2, r1 = i % 2 ? 23.5 : 22.5, r2 = i % 2 ? 27 : 30;
    ticks.push(h('line', { key: i, x1: 40 + r1 * Math.cos(a), y1: 40 + r1 * Math.sin(a), x2: 40 + r2 * Math.cos(a), y2: 40 + r2 * Math.sin(a) }));
  }
  return h('svg', { className: 'am-compass-mark', viewBox: '0 0 80 80', 'aria-hidden': 'true' },
    h('path', { className: 'am-compass-ring', d: sketchRing(40, 40, 18, 0.4) }),
    ticks,
    h('path', { className: 'am-compass-needle-dark', d: 'M47 31 L41.5 41.5 L38.5 38.5 Z' }),
    h('path', { className: 'am-compass-needle-light', d: 'M33 49 L38.5 38.5 L41.5 41.5 Z' }),
    h('circle', { className: 'am-compass-pin', cx: 40, cy: 40, r: 1.6 }));
}

/** משבצת איור: האיור המקורי הנעול כשיסופק; עד אז מסגרת ריקה ושקטה (בלי תחליף) */
function CompassIllustration({ dir, large }) {
  return dir.illustration
    ? h('span', { className: 'am-compass-illus has-img' + (dir.illustration.fit === 'contain' ? ' is-contain' : '') + (dir.illustration.tall && !large ? ' is-tall' : '') + (large ? ' is-large' : '') },
        h('img', { src: dir.illustration.src, alt: dir.illustration.alt, style: dir.illustration.scale ? { '--illus-scale': dir.illustration.scale } : undefined }))
    : h('span', { className: 'am-compass-illus is-empty' + (large ? ' is-large' : ''), 'aria-hidden': 'true' });
}

/** מסך הכניסה של המצפן: שמונה כיוונים מפוזרים סביב סמל מצפן */
function CommunityCompass({ onDirection, onShowList }) {
  const byId = new Map(COMPASS_DIRECTIONS.map((d) => [d.id, d]));
  return h('div', { className: 'am-compass' },
    h('div', { className: 'am-creators-title am-creators-main-title' }, 'עושים קהילה'),
    h('div', { className: 'am-compass-sub' }, 'יש הרבה דרכים להיות חלק מקהילה'),
    h('div', { className: 'am-compass-field', role: 'group', 'aria-label': 'המצפן הקהילתי' },
      h('svg', { className: 'am-compass-links', viewBox: '0 0 100 100', preserveAspectRatio: 'none', 'aria-hidden': 'true' },
        COMPASS_LINKS.map(([a, b]) => {
          const p = byId.get(a).pos, q = byId.get(b).pos;
          const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2, k = 0.18;
          // הקשת נמתחת החוצה מהמרכז, כך שהיא לא עוברת דרכו
          const cx = mx + (mx - 50) * k * 2, cy = my + (my - 50) * k * 2;
          return h('path', { key: a + b, d: `M${p.x} ${p.y} Q${cx} ${cy} ${q.x} ${q.y}` });
        })),
      h('div', { className: 'am-compass-center' }, h(CompassMark)),
      COMPASS_DIRECTIONS.map((d) => h('button', {
        key: d.id, type: 'button', className: 'am-compass-dir', 'data-direction': d.id,
        style: { left: d.pos.x + '%', top: d.pos.y + '%' },
        onClick: () => onDirection(d.id),
      },
        h(CompassIllustration, { dir: d }),
        h('span', { className: 'am-compass-title' }, d.title),
        d.relatedActivities.some((id) => ACTIVITY_BY_ID.get(id).action) ? null : h('span', { className: 'am-compass-soon' }, 'בקרוב')))),
    h('button', { className: 'am-compass-all', onClick: onShowList }, 'כל הפעולות ›'));
}

/** מסך כיוון: האיור, השם, והפעולות הקשורות - פעילות פותחות את המסלולים הקיימים */
function CompassDirectionView({ dirId, onBack, onAction }) {
  const d = COMPASS_DIRECTIONS.find((x) => x.id === dirId);
  return h('div', { className: 'am-compass-direction', 'data-direction': d.id },
    h('button', { className: 'am-creators-back', onClick: onBack }, '‹ המצפן'),
    h(CompassIllustration, { dir: d, large: true }),
    h('div', { className: 'am-compass-title is-large' }, d.title),
    h('div', { className: 'am-compass-activities' },
      d.relatedActivities.map((id) => {
        const a = ACTIVITY_BY_ID.get(id);
        return a.action
          ? h('button', { key: id, className: 'am-compass-activity is-live', 'data-activity': id, onClick: () => onAction(a.action) },
              h('span', null, a.label), h('span', { className: 'am-creators-go', 'aria-hidden': 'true' }, '›'))
          : h('div', { key: id, className: 'am-compass-activity', 'data-activity': id, 'aria-disabled': 'true' },
              h('span', null, a.label), h('span', { className: 'am-creators-future-tag' }, 'בקרוב'));
      })));
}

function CreatorsGatePanel({ onClose, onOpenEvents }) {
  const [activeAction, setActiveAction] = useState(null);
  const [routeId, setRouteId] = useState(null); // טבעת פתוחה בתוך "מסלולי טיול שכונתיים"
  const [compassDir, setCompassDir] = useState(null); // כיוון פתוח במצפן
  const [showList, setShowList] = useState(false); // "כל הפעולות" מתוך המצפן
  // Escape: צעד אחד אחורה (טבעת ← טבעות ← כיוון/רשימה ← מצפן) - רק אחר-כך סוגר
  useEffect(() => {
    if (!activeAction && !compassDir && !showList) return undefined;
    const onKey = (e) => {
      if (e.key !== 'Escape') return;
      e.stopImmediatePropagation();
      if (routeId) setRouteId(null);
      else if (activeAction) setActiveAction(null);
      else { setCompassDir(null); setShowList(false); }
    };
    window.addEventListener('keydown', onKey, true);
    return () => window.removeEventListener('keydown', onKey, true);
  }, [activeAction, routeId, compassDir, showList]);
  let body;
  if (activeAction === 'add_story') body = h(AddStoryAction, { onBack: () => setActiveAction(null) });
  else if (activeAction === 'walking_routes') {
    body = h(WalkingRoutes, { routeId, onRoute: setRouteId, onBack: () => { setRouteId(null); setActiveAction(null); } });
  }
  else if (CREATORS_FLOWS[activeAction]) {
    body = h(CreatorsFlow, { key: activeAction, kind: activeAction, onBack: () => setActiveAction(null), onSwitch: setActiveAction, onOpenEvents });
  } else if (COMPASS_ENABLED && compassDir) {
    body = h(CompassDirectionView, { dirId: compassDir, onBack: () => setCompassDir(null), onAction: setActiveAction });
  } else if (COMPASS_ENABLED && !showList) {
    body = h(CommunityCompass, { onDirection: setCompassDir, onShowList: () => setShowList(true) });
  } else {
    body = h(React.Fragment, null,
      COMPASS_ENABLED ? h('button', { className: 'am-creators-back', onClick: () => setShowList(false) }, '‹ המצפן') : null,
      h('div', { className: 'am-creators-title am-creators-main-title' }, 'עושים קהילה'),
      COMPASS_ENABLED ? null : h(CreatorsJourney, { onOpenEvents }),
      h('div', { className: 'am-creators-caption' }, 'מה אפשר לעשות?'),
      h('div', { className: 'am-creators-list' },
        CREATORS_OPTIONS.map((opt, i) =>
          opt.action
            ? h('button', {
                key: i,
                className: 'am-creators-option am-creators-option-live',
                'data-action': opt.action,
                onClick: () => setActiveAction(opt.action),
              },
                h('span', { className: 'am-creators-emoji' }, opt.emoji),
                h('span', { className: 'am-creators-option-text' },
                  h('span', null, opt.label),
                  opt.sub ? h('span', { className: 'am-creators-option-sub' }, opt.sub) : null),
                h('span', { className: 'am-creators-go', 'aria-hidden': 'true' }, '›')
              )
            : h('div', {
                key: i,
                className: 'am-creators-option am-creators-option-future',
                'aria-disabled': 'true',
              },
                h('span', { className: 'am-creators-emoji' }, opt.emoji),
                h('span', null, opt.label),
                h('span', { className: 'am-creators-future-tag' }, 'בקרוב')
              )
        )
      ));
  }
  return h('div', { className: 'am-scrim am-creators-scrim', onClick: onClose },
    h('div', { className: 'am-creators-panel' + (COMPASS_ENABLED && !activeAction && !compassDir && !showList ? ' is-compass' : ''), role: 'dialog', 'aria-label': 'עושים קהילה', onClick: (e) => e.stopPropagation() },
      h('button', { className: 'close-btn', onClick: onClose, 'aria-label': 'סגור' }, '✕'),
      body
    )
  );
}

/* ===================== מדריך קהילה (Community Directory) =====================
   רשימה לא-גיאוגרפית של 19 קבוצות הקהילה האמיתיות (מ-WhatsApp / Community
   Communication Audit) - MAP != DATABASE: הן לא הופכות לנקודות/סמנים על
   המפה, ולא נוגעות ב-/api/layer-points או במיקומים. חיפוש לפי שם בלבד,
   בצד-לקוח, על 19 הפריטים שכבר הגיעו מה-API - אין תשתית חיפוש חדשה. */

/* ===================== "קהילה" - הקהילה שלנו (constellation) =====================
   במקום רשימת 19 קבוצות: שכבה שקופה מעל המפה עם "איים" נושאיים (COMMUNITY_CLUSTERS
   ב-lib/db.ts - אוצרות לפי הכותרות הקיימות בלבד). לחיצה על נושא - הקבוצות שבו,
   וההצטרפות היא הפעולה האחרונה. חיפוש - קטן ומשני. הכל מ-/api/community-directory;
   שום קבוצה / תיאור / קישור לא נוצר כאן. */

const ACTION_ARIA = { whatsapp_group: 'הצטרפות לקבוצת הוואטסאפ', whatsapp_chat: 'פנייה בוואטסאפ', community_link: 'כניסה לקהילה', external_reference: 'מידע ביטחון' };

/** שורת קבוצה: כותרת (+ תיאור אם קיים במקור) ופעולות קטנות שלא מכסות אותה.
 *  onOpenGuide - כשיש מדריך ביטחון קצר, "מידע ביטחון" פותח אותו בתוך הכרטיס
 *  (מהיר) במקום לשלוח ישר ל-Genially; ה-Genially נשאר "מידע מלא ↗" בתוך המדריך. */
function CommunityGroupRow({ it, onOpenGuide }) {
  return h('div', { className: 'am-directory-item am-community-row', 'data-group-id': it.id },
    h('div', { className: 'am-directory-item-main' },
      h('div', { className: 'am-directory-item-name' }, it.title),
      it.description ? h('div', { className: 'am-directory-item-desc' }, it.description) : null
    ),
    /* פעולות מה-API בלבד (lib/db.ts listCommunityDirectory): הקישור השמור כמות שהוא,
       "וואטסאפ" (ירוק) רק כשהמקור מאשר. לשונית חדשה, לא iframe. בלי קישור - בלי כפתור. */
    it.actions && it.actions.length
      ? h('div', { className: 'am-directory-actions' },
          it.actions.map((a) => (a.kind === 'external_reference' && onOpenGuide
            ? h('button', {
                key: a.kind + a.url, type: 'button',
                className: 'am-btn am-directory-join secondary am-security-open',
                'data-action-kind': a.kind,
                onClick: onOpenGuide,
                'aria-label': 'מידע ביטחון: ' + it.title,
              }, 'מידע ביטחון')
            : h('a', {
                key: a.kind + a.url,
                className: 'am-btn am-directory-join ' + (a.kind === 'whatsapp_group' || a.kind === 'whatsapp_chat' ? 'whatsapp' : 'secondary'),
                href: a.url, target: '_blank', rel: 'noopener noreferrer',
                'data-action-kind': a.kind,
                'aria-label': (ACTION_ARIA[a.kind] || a.label) + ': ' + it.title + ' (נפתח בחלון חדש)',
              }, a.label))))
      : null
  );
}

/* "קהילה" כמפה חיה: שכבת קרם שקופה מעל המפה הנעולה (המפה נראית מבעד), ועליה
   8 צמתי-נושא עצמאיים, שווי-מעמד, מפוזרים ברווחים שבין העוגנים המצוירים. לחיצה על צומת: הקבוצות שלו בכרטיס צד (דסקטופ) או
   בגיליון תחתון (מובייל, המפה נשארת גלויה מעליו). הכל מרשומות קיימות בלבד. */
function useIsNarrow() {
  const mq = typeof window.matchMedia === 'function' ? window.matchMedia('(max-width: 640px)') : null;
  const [narrow, setNarrow] = useState(!!(mq && mq.matches));
  useEffect(() => {
    if (!mq) return undefined;
    const on = () => setNarrow(mq.matches);
    mq.addEventListener('change', on);
    return () => mq.removeEventListener('change', on);
  }, []);
  return narrow;
}

function CommunityLayer({ onClose }) {
  const data = useFetch('/api/community-directory', []);
  const items = (data && data.items) || [];
  const clusters = (data && data.clusters) || [];
  const byId = new Map(items.map((i) => [i.id, i]));
  const [query, setQuery] = useState('');
  const [clusterId, setClusterId] = useState(null);
  const narrow = useIsNarrow();
  const q = query.trim().toLowerCase();
  const results = q ? items.filter((it) => it.title.toLowerCase().includes(q)) : null;
  const hitClusters = results ? new Set(results.map((it) => it.clusterId)) : null;
  const cluster = clusterId ? clusters.find((c) => c.id === clusterId) : null;
  const securityGuide = data && data.securityGuide;
  // מדריך הביטחון: null = סגור, { section: null } = רשת הכותרות, { section: id } = מסך נושא
  const [guide, setGuide] = useState(null);
  const openGuide = securityGuide ? () => setGuide({ section: null }) : null;

  // Escape: קודם מסך המדריך, אחר-כך הכרטיס/החיפוש, רק אחר-כך השכבה (ה-handler של App)
  useEffect(() => {
    if (!cluster && !q && !guide) return undefined;
    const onKey = (e) => {
      if (e.key !== 'Escape') return;
      e.stopImmediatePropagation();
      if (guide) setGuide(guide.section ? { section: null } : null);
      else { setClusterId(null); setQuery(''); }
    };
    window.addEventListener('keydown', onKey, true);
    return () => window.removeEventListener('keydown', onKey, true);
  }, [cluster, q, guide]);

  const search = h('input', {
    className: 'am-directory-search am-community-search', type: 'search', placeholder: 'חיפוש קבוצה...',
    value: query, onChange: (e) => { setQuery(e.target.value); setClusterId(null); setGuide(null); }, 'aria-label': 'חיפוש קבוצת קהילה',
  });
  const rows = (list) => h('div', { className: 'am-directory-list am-community-list' }, list.map((it) => h(CommunityGroupRow, { key: it.id, it, onOpenGuide: it.id === (securityGuide && securityGuide.entityId) ? openGuide : null })));

  let cardBody = null;
  if (guide && securityGuide) {
    cardBody = h(SecurityGuideView, {
      guide: securityGuide, sectionId: guide.section,
      onSection: (id) => setGuide({ section: id }),
      onBack: () => setGuide(guide.section ? { section: null } : null),
    });
  } else if (results) {
    cardBody = h('div', { className: 'am-community-detail am-community-results' },
      h('div', { className: 'am-community-detail-head' }, h('span', { className: 'am-community-detail-title' }, 'תוצאות חיפוש')),
      results.length ? rows(results) : h('div', { className: 'am-directory-empty' }, 'לא נמצאו קבוצות תואמות'));
  } else if (cluster) {
    cardBody = h('div', { className: 'am-community-detail', 'data-cluster': cluster.id },
      h('div', { className: 'am-community-detail-head am-tone-' + cluster.tone },
        h('span', { className: 'am-cluster-icon', 'aria-hidden': 'true' }, cluster.icon),
        h('span', { className: 'am-community-detail-title' }, cluster.title)),
      rows(cluster.itemIds.map((id) => byId.get(id)).filter(Boolean)));
  }
  const closeCard = () => { setClusterId(null); setQuery(''); setGuide(null); };
  const card = (cardBody || narrow) ? h('div', {
    className: 'am-community-card' + (narrow ? ' is-sheet' : ' is-float') + (cardBody ? '' : ' is-hint') + (guide ? ' is-guide' : ''),
    role: 'dialog', 'aria-label': cluster ? cluster.title : 'קהילה',
  },
    cardBody ? h('button', { className: 'am-community-card-close', onClick: closeCard, 'aria-label': 'סגור נושא' }, '✕') : null,
    narrow && !guide ? search : null,
    cardBody || h('div', { className: 'am-community-hint' }, clusters.length ? clusters.length + ' נושאים · ' + items.length + ' קבוצות - בחרו נושא על המפה' : 'טוען...')
  ) : null;

  return h(React.Fragment, null,
    h('div', { className: 'am-community-layer' + (cluster || results ? ' has-focus' : ''), role: 'region', 'aria-label': 'קהילה' },
      h('div', { className: 'am-community-veil', onClick: () => (cluster || q ? closeCard() : onClose()) }),
      clusters.map((c, i) => {
        const groups = c.itemIds.map((id) => byId.get(id)).filter(Boolean);
        const dim = (cluster && cluster.id !== c.id) || (hitClusters && !hitClusters.has(c.id));
        return h('button', {
          key: c.id, type: 'button', 'data-cluster': c.id,
          className: 'am-cnode am-tone-' + c.tone + (clusterId === c.id ? ' is-active' : '') + (dim ? ' is-dim' : ''),
          style: { left: c.node.x + '%', top: c.node.y + '%', '--i': i },
          onClick: () => { setQuery(''); setGuide(null); setClusterId(clusterId === c.id ? null : c.id); },
          'aria-label': c.title + ' - ' + groups.length + ' קבוצות',
          'aria-pressed': clusterId === c.id,
        },
          h('span', { className: 'am-cnode-bubble', 'aria-hidden': 'true' }, c.icon),
          h('span', { className: 'am-cnode-label' },
            h('span', { className: 'am-cnode-title' }, c.title),
            h('span', { className: 'am-cnode-short' }, c.short)),
          h('span', { className: 'am-cnode-count' }, groups.length === 1 ? 'קבוצה אחת' : groups.length + ' קבוצות'),
          // הצצה (דסקטופ, ריחוף/פוקוס): עד 3 קבוצות אמיתיות + "עוד"
          h('span', { className: 'am-cnode-peek', 'aria-hidden': 'true' },
            groups.slice(0, 3).map((g) => h('span', { key: g.id, className: 'am-cnode-peek-item' }, g.title)),
            groups.length > 3 ? h('span', { className: 'am-cluster-more' }, '+' + (groups.length - 3) + ' נוספות') : null)
        );
      }),
      h('div', { className: 'am-community-bar' },
        h('span', { className: 'am-community-bar-title' }, 'קהילה'),
        h('span', { className: 'am-community-tagline' }, 'מי כאן, מה עושים ואיפה מצטרפים'),
        narrow ? null : search,
        h('button', { className: 'am-community-close', onClick: onClose, 'aria-label': 'סגור קהילה' }, '✕')),
      narrow ? null : card
    ),
    narrow && card ? ReactDOM.createPortal(card, document.body) : null
  );
}

/* ===================== עסקים / משאבים (Business Directory) =====================
   שימוש ב-/api/business-directory (lib/businesses.ts, טבלת businesses) -
   24 עסקים: 1 מאומת מהאיור הראשי (פאב בארמון) + 23 מאינדקס-עסקים Genially
   נפרד שיובא (ראו src/importBusinessIndex.js). חיפוש+סינון-קטגוריה
   בצד-לקוח על הרשימה שכבר הגיעה מה-API - אותה גישה כמו
   חיפוש הקהילה, אין תשתית-חיפוש חדשה בשרת. */

const BUSINESS_DATA_STATUS_LABEL = {
  profile_detail_extracted: null, // פרופיל מלא - אין צורך בתגית, זה ברירת המחדל
  index_listing_only: 'רשום באינדקס - פרופיל מלא טרם חולץ',
  unresolved_profile: 'שם העסק טרם אומת',
};

/** פורמט טלפון ל-tel: - לא משנה את הערך המוצג, רק מנקה תווים לא-מספריים ל-href */
function telHref(phone) {
  return 'tel:' + phone.replace(/[^\d+]/g, '');
}

/* ===== תבנית חזותית משותפת לכרטיסים ייצוגיים (גיבורים, עסקים) =====
   תמונה גדולה במסגרת אחידה; בלי תמונה - רקע בגוון המפה עם ראשי תיבות (לא ממציאים
   תמונה). קרדיט קצר על התמונה כשיש רישיון. כל סוג כרטיס בוחר את יחס התמונה
   ואת התוכן שמתחתיה (aspect: 'portrait' 4:5 לגיבור, 'wide' 16:10 לעסק). */
function ShowcaseFigure({ image, alt, credit, fallbackText, tone = 0, aspect = 'portrait', showCredit = false, className = '' }) {
  const [failed, setFailed] = useState(false);
  useEffect(() => { setFailed(false); }, [image]);
  const show = !!(image && !failed);
  // תמונה מוקטנת של YouTube (4:3 עם פסים שחורים) - מגדילים כדי שהפסים ייחתכו
  const videoFrame = show && /i\.ytimg\.com\//.test(image);
  return h('figure', {
    className: 'am-showcase-figure am-showcase-figure--' + aspect + ' am-showcase-tone--' + (tone % 3) + (videoFrame ? ' is-video-frame' : '') + (className ? ' ' + className : ''),
  },
    show
      ? h('img', { src: image, alt: alt || '', loading: 'lazy', onError: () => setFailed(true) })
      : h('span', { className: 'am-showcase-initials am-hero-initials', 'aria-hidden': 'true' }, fallbackText),
    show && showCredit && credit && credit.license
      ? h('figcaption', { className: 'am-showcase-figcredit' }, credit.label + ' · ' + credit.license.label)
      : null
  );
}

/** פרופיל עסק - תת-מסך בתוך אותה חלונית (כמו AddStoryAction/EventRegisterAction),
 *  משתמש רק בשדות שקיימים בפועל ב-DB - לא ממציא שדה חסר, לא ממציא CTA שלא קיים. */

    h('div', { className: 'am-card-credit', style: { marginTop: '16px' } },
