/** suggest: מפת ארמון הנציב - נפתח בטופס "יש לי הצעה" (הצעות תושבים); בלעדיו (למשל /ramat-gan) - רשימת סוגי השיתוף כמו קודם */
function SharePanel({ onClose, places, options = SHARE_OPTIONS, suggest = false, listTitle, hidden, pickedPoint, onPickPlace, onSuggested }) {
  const [optionId, setOptionId] = useState(null);
  const [values, setValues] = useState({});
  const [displayName, setDisplayName] = useState('');
  const [key, setKey] = useState(loadShareKey);
  const [me, setMe] = useState(null);
  const [sending, setSending] = useState(false);
  const [error, setError] = useState(null);
  const [done, setDone] = useState(null);
  const [showMine, setShowMine] = useState(false);
  const [keyNotStored, setKeyNotStored] = useState(false);
  // "יש לי הצעה" נפתח ישר בטופס הפשוט; שאר שמונה סוגי השיתוף - בקישור "עוד דרכים לשתף"
  const [showList, setShowList] = useState(!suggest);
  const [draft, setDraft] = useState({ title: '', body: '', point: null, displayName: '' });
  const [fieldErrors, setFieldErrors] = useState({});
  const opt = options.find((o) => o.id === optionId) || null;
  // נקודה שסומנה במפה (ה-App מעביר אותה אחרי מצב "בחירת מקום")
  useEffect(() => { if (pickedPoint) setDraft((d) => ({ ...d, point: pickedPoint })); }, [pickedPoint]);

  // מפתח שמור: בודקים מול השרת שהוא עדיין תקף (ומציגים בשם מי משתפים)
  useEffect(() => {
    if (!key || me) return;
    let alive = true;
    shareRequest('GET', '/api/me', null, key).then((r) => {
      if (!alive) return;
      if (r.status === 200) setMe(r.data);
      else if (r.status === 401) { saveShareKey(null); setKey(null); }
    });
    return () => { alive = false; };
  }, [key, me]);

  // Escape: מהטופס חוזרים לרשימה; מהרשימה - סוגרים (ה-App מטפל בזה)
  useEffect(() => {
    if ((!opt || done) && !showMine) return undefined;
    const onKey = (e) => { if (e.key === 'Escape') { e.stopImmediatePropagation(); setOptionId(null); setShowMine(false); setError(null); } };
    window.addEventListener('keydown', onKey, true);
    return () => window.removeEventListener('keydown', onKey, true);
  }, [opt, done, showMine]);

  const needsName = !key;
  // רק לנוסח ההודעה: הפרסום המיידי עצמו נקבע בשרת לפי התפקיד (lib/ideas.ts, lib/eventsApi.ts)
  const isOperator = !!(me && me.roles && (me.roles.includes('moderator') || me.roles.includes('admin')));
  const ready = opt && opt.fields.every((f) => !f.required || (values[f.key] || '').trim()) && (!needsName || displayName.trim());

  async function submit(e) {
    e.preventDefault();
    if (!ready || sending) return;
    setSending(true);
    setError(null);
    let useKey = key;
    if (!useKey) {
      const created = await shareRequest('POST', '/api/users', { displayName: displayName.trim() });
      if (created.status !== 201) { setSending(false); setError(shareErrorText(created.status, created.data && created.data.error)); return; }
      useKey = created.data.token;
      const stored = saveShareKey(useKey);
      setKey(useKey);
      setMe(created.data.user);
      setKeyNotStored(!stored);
    }
    const r = await shareRequest('POST', opt.path, shareBody(opt, values), useKey);
    setSending(false);
    // מפעיל או מנהל מפרסמים מיד (השרת קובע); לכל השאר - ממתין לאישור
    if (r.status === 201) { setDone({ ...opt, moderated: opt.moderated && SHARE_WAITING.includes(r.data && r.data.status) }); setValues({}); return; }
    if (r.status === 401) {
      saveShareKey(null); setKey(null); setMe(null);
      setError('הזיהוי בדפדפן הזה כבר לא תקף. כתבו שם תצוגה ושלחו שוב.');
      return;
    }
    setError(shareErrorText(r.status, r.data && r.data.error));
  }

  async function submitSuggestion(e) {
    e.preventDefault();
    if (sending) return; // מונע שליחה כפולה (לחיצה כפולה / Enter חוזר)
    const errs = validateSuggestion(draft, !key);
    setFieldErrors(errs);
    if (Object.keys(errs).length) { setError('יש לתקן את השדות המסומנים.'); return; }
    setSending(true);
    setError(null);
    let useKey = key;
    if (!useKey) {
      const created = await shareRequest('POST', '/api/users', { displayName: draft.displayName.trim() });
      if (created.status !== 201) { setSending(false); setError(shareErrorText(created.status, created.data && created.data.error)); return; }
      useKey = created.data.token;
      const stored = saveShareKey(useKey);
      setKey(useKey);
      setMe(created.data.user);
      setKeyNotStored(!stored);
    }
    const payload = { kind: 'proposal', title: draft.title.trim(), body: draft.body.trim() };
    if (draft.point) { payload.mapX = draft.point.x; payload.mapY = draft.point.y; }
    const r = await shareRequest('POST', SUGGESTIONS_PATH, payload, useKey);
    setSending(false);
    if (r.status === 201) {
      setDone({ suggestion: true, moderated: r.data && r.data.status === 'submitted' });
      setDraft({ title: '', body: '', point: null, displayName: '' });
      setFieldErrors({});
      if (onSuggested) onSuggested(r.data);
      return;
    }
    if (r.status === 401) {
      saveShareKey(null); setKey(null); setMe(null);
      setError('הזיהוי בדפדפן הזה כבר לא תקף. כתבו שם תצוגה ושלחו שוב.');
      return;
    }
    setError(shareErrorText(r.status, r.data && r.data.error));
  }

  let body;
  if (done && done.suggestion) {
    body = h('div', { className: 'am-share-done', role: 'status' },
      h('div', { className: 'am-creators-title' }, 'תודה! ההצעה התקבלה'),
      h('p', { className: 'am-share-text' }, 'רכזת הקהילה תעבור עליה. רק אחרי אישור היא תופיע לכולם בשכבה הירוקה "הצעות תושבים". עד אז רק אתם רואים אותה, בדפדפן הזה.'),
      keyNotStored ? h('p', { className: 'am-share-key-note' }, 'הדפדפן לא מאפשר לשמור את המפתח, ולכן הזיהוי יישמר רק עד שתסגרו את הדף.') : null,
      h('div', { className: 'am-flow-actions am-share-actions' },
        h('button', { className: 'am-btn link am-flow-submit', onClick: onClose }, 'חזרה למפה'),
        h('button', { className: 'am-flow-next', 'data-action': 'more', onClick: () => setDone(null) }, 'להציע עוד משהו')));
  } else if (showMine && key) {
    body = h(MySubmissions, { shareKey: key, onBack: () => setShowMine(false), onKeyInvalid: () => { saveShareKey(null); setKey(null); setMe(null); } });
  } else if (done) {
    body = h('div', { className: 'am-share-done', role: 'status' },
      h('div', { className: 'am-creators-title' }, done.kind ? 'תודה! הפנייה התקבלה' : 'תודה! קיבלנו'),
      h('p', { className: 'am-share-text' }, done.kind
        ? 'הפנייה פרטית: רק אתם ומפעיל הקהילה רואים אותה.'
        : done.moderated ? 'מפעיל הקהילה יעבור על זה. רק אחרי אישור זה יופיע לכולם באתר.' : 'פורסם באתר.'),
      keyNotStored ? h('p', { className: 'am-share-key-note' }, 'הדפדפן לא מאפשר לשמור את המפתח, ולכן הזיהוי יישמר רק עד שתסגרו את הדף.') : null,
      h('div', { className: 'am-flow-actions am-share-actions' },
        h('button', { className: 'am-btn link am-flow-submit', onClick: onClose }, 'חזרה למפה'),
        h('button', { className: 'am-flow-next', 'data-action': 'more', onClick: () => { setDone(null); setOptionId(null); } }, 'לשתף עוד משהו'),
        key ? h('button', { className: 'am-flow-next', 'data-action': 'mine', onClick: () => { setDone(null); setOptionId(null); setShowMine(true); } }, 'לראות את השיתופים שלי') : null));
  } else if (opt) {
    body = h('form', { className: 'am-flow-form am-share-form', 'data-share': opt.id, onSubmit: submit, noValidate: true },
      h('button', { type: 'button', className: 'am-creators-back', onClick: () => { setOptionId(null); setError(null); } }, '‹ חזרה'),
      h('div', { className: 'am-creators-title am-share-form-title' }, opt.label),
      h('p', { className: 'am-share-note' }, opt.note ? opt.note : opt.moderated
        ? (isOperator ? 'אתם מחוברים כמפעילי קהילה: זה יתפרסם באתר מיד.' : 'מפעיל הקהילה יעבור על זה לפני שזה יופיע לכולם.')
        : 'הפנייה פרטית: רק אתם ומפעיל הקהילה תראו אותה.'),
      opt.fields.map((f) => h(ShareField, { key: f.key, field: f, value: values[f.key], places, onChange: (v) => setValues((cur) => ({ ...cur, [f.key]: v })) })),
      needsName
        ? h('div', { className: 'am-share-identity' },
            h(ShareField, { field: { key: 'displayName', label: opt.moderated ? 'השם שיוצג ליד מה שתשתפו' : 'השם שלכם (רק המפעיל יראה אותו)', required: true, max: 40 }, value: displayName, onChange: setDisplayName, places }),
            h('p', { className: 'am-share-key-note' },
              'אין צורך בטלפון, מייל או רשת חברתית. כדי לזהות אתכם בפעם הבאה, נשמר בדפדפן הזה מפתח אישי. ',
              h('strong', null, 'אם נתוני הדפדפן יימחקו, או במכשיר אחר, כרגע אין דרך לשחזר את הזהות.')))
        : me ? h('p', { className: 'am-share-who' }, 'משתפים בשם: ' + me.displayName) : null,
      error ? h('p', { className: 'am-share-error', role: 'alert' }, error) : null,
      h('button', { type: 'submit', className: 'am-btn link am-flow-submit', disabled: !ready || sending }, sending ? 'שולחים...' : 'שליחה'));
  } else if (!showList) {
    const needsName = !key;
    const set = (k) => (v) => { setDraft((d) => ({ ...d, [k]: v })); if (fieldErrors[k]) setFieldErrors((fe) => ({ ...fe, [k]: undefined })); setError(null); };
    body = h('form', { className: 'am-flow-form am-share-form am-suggest-form', 'data-share': 'suggestion', onSubmit: submitSuggestion, noValidate: true },
      h('div', { className: 'am-creators-title am-creators-main-title' }, 'יש לי הצעה'),
      h('p', { className: 'am-share-note' }, 'הצעה לשכונה, קטנה או גדולה. רכזת הקהילה בודקת כל הצעה לפני שהיא מופיעה במפה.'),
      h(SuggestionField, { name: 'title', label: 'כותרת', value: draft.title, onChange: set('title'), error: fieldErrors.title, max: 80, placeholder: 'למשל: ספסל צל ליד הגינה' }),
      h(SuggestionField, { name: 'body', label: 'במה מדובר?', value: draft.body, onChange: set('body'), error: fieldErrors.body, area: true, max: 400, hint: 'עד 400 תווים. בלי טלפון ובלי מייל.' }),
      h('div', { className: 'am-flow-field am-suggest-place' },
        h('span', { className: 'am-flow-label' }, 'מקום במפה (לא חובה)'),
        draft.point
          ? h('div', { className: 'am-suggest-place-row' },
              h('span', { className: 'am-suggest-place-set', 'data-place': 'set' }, '✓ סומן מקום במפה'),
              h('button', { type: 'button', className: 'am-flow-next', 'data-action': 'repick', onClick: onPickPlace }, 'לשנות'),
              h('button', { type: 'button', className: 'am-flow-next', 'data-action': 'clear-place', onClick: () => setDraft((d) => ({ ...d, point: null })) }, 'בלי מקום'))
          : h('button', { type: 'button', className: 'am-suggest-pick', 'data-action': 'pick', onClick: onPickPlace }, 'לסמן מקום במפה')),
      needsName
        ? h('div', { className: 'am-share-identity' },
            h(SuggestionField, { name: 'displayName', label: 'השם שיוצג ליד ההצעה', value: draft.displayName, onChange: set('displayName'), error: fieldErrors.displayName, max: 40 }),
            h('p', { className: 'am-share-key-note' },
              'ההצעה לא אנונימית: אחרי אישור השם הזה מוצג לידה. אין צורך בטלפון או מייל. כדי לזהות אתכם בפעם הבאה, נשמר בדפדפן הזה מפתח אישי.'))
        : me ? h('p', { className: 'am-share-who' }, 'מציעים בשם: ' + me.displayName + ' (השם מוצג ליד ההצעה אחרי אישור)') : null,
      error ? h('p', { className: 'am-share-error', role: 'alert' }, error) : null,
      h('button', { type: 'submit', className: 'am-btn link am-flow-submit', disabled: sending }, sending ? 'שולחים...' : 'שליחת ההצעה'),
      h('button', { type: 'button', className: 'am-share-mine-link am-suggest-more', 'data-action': 'more-ways', onClick: () => { setShowList(true); setError(null); } }, 'עוד דרכים לשתף (אירוע, מידע, פנייה למפעיל) ›'));
  } else {
    body = h(React.Fragment, null,
      suggest ? h('button', { type: 'button', className: 'am-creators-back', 'data-action': 'back-to-suggestion', onClick: () => { setShowList(false); setError(null); } }, '‹ חזרה ל"יש לי הצעה"') : null,
      h('div', { className: 'am-creators-title am-creators-main-title' }, listTitle || (suggest ? 'עוד דרכים לשתף' : 'יש לי הצעה')),
      h('div', { className: 'am-creators-sub' }, 'מה תרצו לשתף?'),
      // רק כשיש בדפדפן זהות תושב - אחרת אין "שיתופים שלי" להציג
      key ? h('button', { className: 'am-share-mine-link', 'data-action': 'mine', onClick: () => { setShowMine(true); setError(null); } }, 'השיתופים שלי ›') : null,
      h('div', { className: 'am-creators-list am-share-list' },
        options.map((o) => h('button', {
          key: o.id, className: 'am-creators-option am-creators-option-live', 'data-share': o.id,
          onClick: () => { setOptionId(o.id); setError(null); },
        },
          h('span', { className: 'am-creators-option-text' },
            h('span', null, o.label),
            h('span', { className: 'am-creators-option-sub' }, o.sub)),
          h('span', { className: 'am-creators-go', 'aria-hidden': 'true' }, '›')))),
      error ? h('p', { className: 'am-share-error', role: 'alert' }, error) : null);
  }
  return h('div', { className: 'am-scrim am-creators-scrim', onClick: onClose, hidden: !!hidden },
    h('div', { className: 'am-creators-panel am-share-panel', role: 'dialog', 'aria-label': 'יש לי הצעה', onClick: (e) => e.stopPropagation() },
      h('button', { className: 'close-btn', onClick: onClose, 'aria-label': 'סגור' }, '✕'),
      body));
}

/* ===================== App ===================== */

function App() {
  const data = useFetch('/api/anchors', []);
  const richPlaces = useFetch('/api/rich-places', []); // ישויות שמקבלות Rich Place Panel
  const richIds = (richPlaces && richPlaces.ids) || [];
  const [selected, setSelected] = useState(null);
  const [creatorsOpen, setCreatorsOpen] = useState(false);
  const [communityDirectoryOpen, setCommunityDirectoryOpen] = useState(false);
  const [businessDirectoryOpen, setBusinessDirectoryOpen] = useState(false);
  const [shareOpen, setShareOpen] = useState(false);
  // "הצעות תושבים": שכבה נפרדת, נדלקת ונכבית בלי קשר לשכבת המקרא הפעילה
  const [suggestionsOn, setSuggestionsOn] = useState(false);
  const [suggestions, setSuggestions] = useState(null); // null = עוד לא נטען / השרת לא זמין
  const [suggestionsTick, setSuggestionsTick] = useState(0);
  const [selectedSuggestion, setSelectedSuggestion] = useState(null);
  const [suggestionsListOpen, setSuggestionsListOpen] = useState(false);
  const [placing, setPlacing] = useState(false); // מצב "לסמן מקום במפה" מתוך טופס ההצעה
  const pz = usePanZoom();
  const [pickedPoint, setPickedPoint] = useState(null);
  // הכפתור מוצג רק כשהשרת אומר שהשיתוף פתוח - כלומר יש מפעיל פעיל שיאשר (lib/moderation.ts)
  const shareStatus = useFetch('/api/share/status', []);
  const shareAvailable = !!(shareStatus && shareStatus.open);
  // "מה קורה עכשיו": null = סגור; אחרת { tab, itemId } (פתיחה מהמקרא / מסמן / מסע היוצרים)
  const [nowOpen, setNowOpen] = useState(null);
  // חלון השיתוף שנפתח מ"מה קורה עכשיו" (רשימת דרכי השיתוף, לא טופס ההצעה)
  const [nowShareOpen, setNowShareOpen] = useState(false);
  // שכבת-המקרא הפעילה: מציגה את נקודות-המשנה של השכבה בלבד (שכבה אחת בכל רגע).
  const [activeLayer, setActiveLayer] = useState(null);
  const [selectedSecondary, setSelectedSecondary] = useState(null);
  const secondaryData = useFetch('/api/secondary-points', []);
  const secondaryPoints = ((secondaryData && secondaryData.points) || []).filter((p) => p.layer === activeLayer);
  // "גיבורים וגיבורות השכונה": נקודת מפה אחת לכל האוסף - רק אם השרת מחזיר לה
  // מיקום מקור מאומת. #giborim פותח את החלון ישירות (תצוגה מקדימה/קישור).
  const heroes = useFetch('/api/neighborhood-heroes', []);
  const heroesPoint = heroes && heroes.mapPoint && heroes.mapPoint.layer === activeLayer ? heroes.mapPoint : null;
  const [heroesOpen, setHeroesOpen] = useState(() => { try { return window.location.hash === '#giborim'; } catch (e) { return false; } });
  const closeHeroes = useCallback(() => setHeroesOpen(false), []);
  const anchorPoints = (data && data.points) || []; // תמיד בדיוק 11 העוגנים
  // "מה קורה עכשיו": פיד ה-workspace. פתיחת החלון לא משנה את המפה; רק פריט
  // שנבחר בחלון (ויש לו מיקום) מסומן בנקודה אחת. סוגרים את החלון - המפה הרגילה חוזרת.
  const nowData = useFetch('/api/now', []);
  const [nowFocus, setNowFocus] = useState(null);
  const bg = data && data.background;

  const close = useCallback(() => setSelected(null), []);
  const closeSecondary = useCallback(() => setSelectedSecondary(null), []);
  const closeCreators = useCallback(() => setCreatorsOpen(false), []);
  const closeCommunityDirectory = useCallback(() => {
    setCommunityDirectoryOpen(false);
    setActiveLayer((cur) => (cur === 'community' ? null : cur));
  }, []);
  const closeBusinessDirectory = useCallback(() => setBusinessDirectoryOpen(false), []);
  const closeShare = useCallback(() => { setShareOpen(false); setPlacing(false); setPickedPoint(null); }, []);
  // ההצעות נטענות רק כשהשכבה דולקת (ושוב אחרי שליחה). עם מפתח התושב - כדי שההצעות הממתינות שלי יופיעו לי.
  useEffect(() => {
    if (!suggestionsOn) return undefined;
    let alive = true;
    shareRequest('GET', SUGGESTIONS_PATH, null, loadShareKey()).then((r) => {
      if (!alive) return;
      setSuggestions(r.status === 200 && r.data && Array.isArray(r.data.items) ? r.data.items : []);
    });
    return () => { alive = false; };
  }, [suggestionsOn, suggestionsTick]);
  const onSuggested = useCallback(() => { setSuggestionsOn(true); setSuggestionsTick((t) => t + 1); }, []);
  // רכזת הקהילה (מפעיל): קישור במקרא לדף האישור, עם מספר ההצעות שממתינות. לתושבים זה לא מוצג -
  // השרת מחזיר 403 למי שאינו מפעיל. (מייל אין: האתר לא מחובר לשירות מיילים.)
  const [modWaiting, setModWaiting] = useState(null);
  useEffect(() => {
    const key = loadShareKey();
    if (!key) return undefined;
    let alive = true;
    shareRequest('GET', '/api/neighborhoods/armon-hanatziv/moderation', null, key).then((r) => {
      if (alive && r.status === 200 && r.data) setModWaiting((r.data.waiting || []).length);
    });
    return () => { alive = false; };
  }, [suggestionsTick]);
  const startPlacing = useCallback(() => setPlacing(true), []);
  // לחיצה על המפה במצב בחירת מקום: אחוז-במה → אחוז-מסגרת (כמו כל הנקודות), וחזרה לטופס
  const pickOnMap = useCallback((e) => {
    const r = (pz.worldRef.current || e.currentTarget).getBoundingClientRect(); // אחרי זום/גרירה - יחסית לאיור עצמו
    const sx = ((e.clientX - r.left) / r.width) * 100, sy = ((e.clientY - r.top) / r.height) * 100;
    if (sx < 0 || sx > 100 || sy < 0 || sy > 100) return;
    setPickedPoint({ x: Math.round(frameX(sx) * 10) / 10, y: Math.round(frameY(sy) * 10) / 10 });
    setPlacing(false);
  }, [pz.worldRef]);
  const placedSuggestions = (suggestions || []).filter((x) => x.mapX != null && x.mapY != null);
  const unplacedSuggestions = (suggestions || []).filter((x) => x.mapX == null || x.mapY == null);
  const suggestionById = (id) => (suggestions || []).find((x) => x.id === id) || null;
  // מתוך חלון-מקום עשיר: סוגר את החלון ופותח את מדריך העסקים הקיים (לא מדריך שני)
  const openBusinessDirectoryFromPlace = useCallback(() => { setSelected(null); setBusinessDirectoryOpen(true); }, []);
  const closeNow = useCallback(() => {
    setNowOpen(null);
    setNowFocus(null);
    setActiveLayer((cur) => (cur === 'now_initiatives' ? null : cur));
  }, []);
  // מסע היצירה בתוך "יוצרים שכונה" - שלבי "פעילות/אירוע" ו"השתתפות" מובילים
  // לפאנל האירועים האמיתי (לא שכבת-מפה, לא marker) - סוגר את שער היוצרים ופותח אירועים.
  const navigateFromCreatorsToEvents = useCallback(() => { setCreatorsOpen(false); setNowOpen({ tab: 'upcoming' }); }, []);
  // מקרא המפה: בוחר את השכבה (נקודות-המשנה שלה מופיעות, של השכבה הקודמת
  // נעלמות) ופותח את היעד הקיים כמו קודם. 11 העוגנים תמיד נשארים - אין סינון.
  const openMapLegendItem = useCallback((key) => {
    // "סיפור מקום" לא פותח חלון - קליק נוסף עליו מחזיר למפה הניטרלית
    setActiveLayer((cur) => (key === 'place_story' && cur === 'place_story' ? null : key));
    setCommunityDirectoryOpen(key === 'community'); // שכבת הקהילה נסגרת כשבוחרים שכבה אחרת
    if (key === 'business_resource') setBusinessDirectoryOpen(true);
    else if (key === 'now_initiatives') setNowOpen({ tab: 'today' });
  }, []);

  // גודל החלונות והטקסט שבהם נגזר מגודל המפה, לא מגודל החלון: --map-w/--map-h,
  // ו-data-map-size='s' כשהמפה צרה (<=420px - אותו סף שבו המקרא יורד ל-9.5px).
  useEffect(() => {
    const stage = document.querySelector('.am-map-stage');
    if (!stage) return undefined;
    const root = document.documentElement;
    const apply = () => {
      const r = stage.getBoundingClientRect();
      if (!r.width) return;
      root.style.setProperty('--map-w', Math.round(r.width) + 'px');
      root.style.setProperty('--map-h', Math.round(r.height) + 'px');
      root.dataset.mapSize = r.width <= 420 ? 's' : 'l';
      // "יש לי משהו לשתף": בתוך המפה, מימין למעלה מתחת לכותרת "ארמון הנציב" - כשהוא נכנס
      // לאזור הפנוי שם (עד ~5.6% מגובה המפה ו-21% מרוחבה). אחרת (בעיקר בטלפון, שבו יעד המגע
      // גדול יחסית למפה) הוא היה מכסה את האיור - ולכן יוצא אל מחוץ למפה, צמוד לפינה
      // הימנית-התחתונה שלה: מתחתיה כשיש מקום, אחרת לצידה.
      const fab = document.querySelector('.am-share-fab');
      if (fab) {
        root.dataset.shareDock = 'inside';
        const fits = fab.offsetHeight <= r.height * 0.075 && fab.offsetWidth <= r.width * 0.2; // המקום של הכפתור באיור: ~19% מהרוחב, ~7% מהגובה
        // המפה ממלאת את המסך (20.10.2026), ולכן אין "מחוץ למפה": במקום זה הכפתור יורד לפס שעל המפה למטה, ליד "עושים קהילה"
        if (!fits) root.dataset.shareDock = 'bar';
      }
    };
    apply();
    const ro = typeof ResizeObserver === 'function' ? new ResizeObserver(apply) : null;
    if (ro) ro.observe(stage);
    window.addEventListener('resize', apply);
    return () => { if (ro) ro.disconnect(); window.removeEventListener('resize', apply); };
  }, [shareAvailable]); // הכפתור מופיע רק אחרי בדיקת /api/share/status - למדוד שוב

  // Escape סוגר את מה שפתוח (קודם הכרטיס, אחר-כך שער היוצרים/מדריכים)
  useEffect(() => {
    function onKey(e) {
      if (e.key !== 'Escape') return;
      if (placing) setPlacing(false); // ביטול בחירת המקום - חזרה לטופס
      else if (selectedSuggestion) setSelectedSuggestion(null);
      else if (suggestionsListOpen) setSuggestionsListOpen(false);
      else if (shareOpen) closeShare();
      else if (nowShareOpen) setNowShareOpen(false);
      else if (selected) close();
      else if (selectedSecondary) closeSecondary();
      else if (heroesOpen) closeHeroes();
      else if (creatorsOpen) closeCreators();
      else if (communityDirectoryOpen) closeCommunityDirectory();
      else if (businessDirectoryOpen) closeBusinessDirectory();
      else if (nowOpen) closeNow();
      else setActiveLayer(null); // שום חלון לא פתוח - חזרה למפה הניטרלית
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [placing, selectedSuggestion, suggestionsListOpen, shareOpen, closeShare, nowShareOpen, selected, selectedSecondary, closeSecondary, heroesOpen, closeHeroes, creatorsOpen, communityDirectoryOpen, businessDirectoryOpen, nowOpen, close, closeCreators, closeCommunityDirectory, closeBusinessDirectory, closeNow]);

  return h('div', { className: 'am-app' },
    h('div', { className: 'am-map-stage' + (placing ? ' is-placing' : '') },
      /* חלון המפה: חותך את האיור בזום. בתוכו .am-world - האיור וכל הנקודות, שזזים ומתקרבים יחד */
      h('div', { className: 'am-viewport', ref: pz.viewportRef },
      h('div', { className: 'am-world', ref: pz.worldRef },
      bg ? h('img', { className: 'base-photo', src: bg.imageUrl, alt: 'מפת השכונה' }) : null,
      /* 19.10.2026: שכבות הקישוט (קו-רקיע, רחוב עולי הגרדום, ציורי העוגנים) הוסרו - הכל כבר מצויר באיור. */

      /* 11 העוגנים: אזורי-קליק שקופים בלבד מעל האייקונים המצוירים ב-Master
         Visual הנעול - בלי אייקון/פאץ'/נקודה מעל האיור. */
      /* רקע v4 (בלי אייקונים מצוירים): עוגן עם אייקון נעול מאושר
         (LOCKED_ICON_ASSET_BY_TITLE) מוצג ככפתור עגול מורם ובתוכו האייקון.
         עוגנים בלי אייקון מאושר נשארים אזור-קליק שקוף כמו קודם. */
      anchorPoints.map((p) => {
        const icon = LOCKED_ICON_ASSET_BY_TITLE[p.title];
        const contentId = ANCHOR_CONTENT_BY_TITLE[p.title] || p.entityId;
        return h('button', {
          key: p.id,
          className: 'am-hotspot am-hotspot--artwork' + (icon ? ' am-hotspot--icon' : '') + (contentId === selected ? ' is-active' : ''),
          style: anchorStyle(p.title, p.display.mapX, p.display.mapY),
          onClick: () => setSelected(contentId),
          'aria-label': p.title,
        }, icon ? h('img', { className: 'am-hotspot-icon', src: icon, alt: '', draggable: false }) : null,
          icon ? h('span', { className: 'am-hotspot-name', 'aria-hidden': 'true' }, p.title) : null);
      }),
      /* נקודות צמודות לעוגן (פארק הדרקונים ליד המרכז המסחרי) - מוצגות רק כשהעוגן קיים */
      ANCHOR_COMPANIONS.filter((c) => anchorPoints.some((p) => p.title === c.anchorTitle)).map((c) => h('button', {
        key: c.id,
        className: 'am-hotspot am-hotspot--artwork am-hotspot--icon am-hotspot--companion' + (c.entityId === selected ? ' is-active' : ''),
        style: anchorStyle(c.title, c.mapX, c.mapY),
        onClick: () => setSelected(c.entityId),
        'aria-label': c.title,
        'data-companion': c.id,
      }, h('img', { className: 'am-hotspot-icon', src: LOCKED_ICON_ASSET_BY_TITLE[c.title], alt: '', draggable: false }),
        h('span', { className: 'am-hotspot-name', 'aria-hidden': 'true' }, c.title))),

      /* נקודות-המשנה של השכבה הפעילה: נקודה אדומה קטנה במיקום המקור המדויק,
         ומעליה אייקון המקור הנעול (אם סופק) - קטן מ-11 העוגנים. */
      secondaryPoints.map((p) => h(SecondaryMarker, {
        key: p.id, point: p, active: selectedSecondary === p.id, onOpen: () => setSelectedSecondary(p.id),
      })),

      heroesPoint
        ? h(SecondaryMarker, { key: heroesPoint.id, point: heroesPoint, collection: 'neighborhood_heroes', onOpen: () => setHeroesOpen(true) })
        : null,

      nowOpen && nowFocus ? h(NowMarker, { key: nowFocus.id, item: nowFocus }) : null,

      /* שכבת "הצעות תושבים" (ירוקה): כל ההצעות. מי שנשלחה בלי מקום - במקום פנוי בתוך השכונה */
      suggestionsOn ? placedSuggestions.concat(spreadUnplaced(unplacedSuggestions)).map((it) => h(SuggestionMarker, {
        key: it.id, item: it, active: selectedSuggestion === it.id, onOpen: () => setSelectedSuggestion(it.id),
      })) : null,
      pickedPoint && shareOpen ? h('span', { className: 'am-suggestion-pick-mark', style: { left: stageX(pickedPoint.x) + '%', top: stageY(pickedPoint.y) + '%' }, 'aria-hidden': 'true' }) : null,
      ), /* סוף .am-world */
      /* מצב בחירת מקום: שכבה שקופה מעל כל המפה - לחיצה אחת קובעת את המקום */
      placing ? h('div', { className: 'am-place-picker', onClick: pickOnMap, role: 'button', 'aria-label': 'לחצו על המקום במפה' },
        h('div', { className: 'am-place-picker-hint', onClick: (e) => e.stopPropagation() },
          h('span', null, 'לחצו על המקום במפה'),
          h('button', { type: 'button', onClick: () => setPlacing(false) }, 'ביטול'))) : null,
    ), /* סוף .am-viewport */
      /* "יש לי משהו לשתף" - כפתור HTML בפינה הימנית-התחתונה של המפה, מעל קו-הרקיע
         המשורבט (בבקשת בעל הפרויקט). שכבה מעל האיור כמו הסמנים - האיור הנעול לא משתנה.
         הגודל יחסי לרוחב המפה, בערך כגודל הכותרת "עושים קהילה". */
      shareAvailable ? h('button', { className: 'am-share-fab', onClick: () => setShareOpen(true), 'aria-haspopup': 'dialog' }, 'יש לי הצעה') : null,

      communityDirectoryOpen ? h(CommunityLayer, { onClose: closeCommunityDirectory }) : null,

      /* מקרא המפה - פאנל HTML קריא מעל המקרא הקטן המצויר ב-Master Visual */
      h('nav', { className: 'am-map-legend', 'aria-label': 'מקרא המפה' },
        MAP_LEGEND_ITEMS.map((item) =>
          h('button', {
            key: item.key,
            className: 'am-map-legend-item',
            'aria-pressed': activeLayer === item.key,
            style: { '--legend-color': item.color },
            onClick: () => openMapLegendItem(item.key),
          },
            h('span', { className: 'am-map-legend-label' }, item.label),
            h('span', { className: 'am-map-legend-swatch', 'aria-hidden': 'true' })
          )
        ),
        /* שכבה נפרדת: מתג עצמאי (לא מחליף את השכבה שנבחרה למעלה) */
        h('button', {
          className: 'am-map-legend-item am-map-legend-toggle',
          'aria-pressed': suggestionsOn,
          'data-layer': 'resident_suggestions',
          style: { '--legend-color': SUGGESTION_GREEN },
          title: 'הצעות שתושבים שלחו ב"יש לי הצעה" ושהרכזת אישרה',
          onClick: () => setSuggestionsOn((on) => !on),
        },
          h('span', { className: 'am-map-legend-label' }, 'הצעות תושבים'),
          h('span', { className: 'am-map-legend-swatch', 'aria-hidden': 'true' })
        ),
        suggestionsOn && suggestions && !suggestions.length
          ? h('span', { className: 'am-map-legend-note', role: 'status' }, 'עדיין אין הצעות שאושרו')
          : null,

        modWaiting != null
          ? h('a', { className: 'am-map-legend-note am-map-legend-mod', href: '/moderation?tab=suggestions', 'data-mod-waiting': String(modWaiting) },
              modWaiting ? modWaiting + ' ממתינות לאישור ›' : 'לדף האישור ›')
          : null
      ),

      /* כפתור המותג "עושים קהילה" - פעולה אחת ברורה, ללא שורת המשנה מהלוגו הישן. */
      h('button', {
        className: 'am-legend-dot am-brand-button',
        onClick: () => setCreatorsOpen(true),
        title: 'עושים קהילה',
        'aria-label': 'עושים קהילה',
      },
        h('span', { 'aria-hidden': 'true', className: 'am-brand-plus' }, '+'),
        h('span', null, 'עושים קהילה')
      ),
      /* זום: הגדלה, הקטנה וחזרה למפה המלאה (כמו בבאר שבע) */
      h('div', { className: 'am-zoom', role: 'group', 'aria-label': 'זום במפה' },
        h('button', { type: 'button', className: 'am-zbtn', 'aria-label': 'הגדלת המפה', onClick: () => pz.zoomBy(1.3), disabled: pz.zoomLevel >= ZOOM_MAX }, '+'),
        h('button', { type: 'button', className: 'am-zbtn', 'aria-label': 'הקטנת המפה', onClick: () => pz.zoomBy(1 / 1.3), disabled: pz.zoomLevel <= ZOOM_MIN }, '−'),
        h('button', { type: 'button', className: 'am-zbtn am-zbtn--home', 'aria-label': 'חזרה למפה המלאה', onClick: pz.recenter },
          h('svg', { viewBox: '0 0 24 24', width: 16, height: 16, 'aria-hidden': 'true' },
            /* אותו סמל "מרכוז" כמו בבאר שבע */
            h('g', { fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round' },
              h('circle', { cx: 12, cy: 12, r: 3.2 }), h('path', { d: 'M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4' })))))
    ),
    selected && richIds.includes(selected)
      ? h(RichPlacePanel, { key: selected, entityId: selected, onClose: close, onOpenBusinessDirectory: openBusinessDirectoryFromPlace })
      : h(EntityCard, { entityId: selected, onClose: close }),
    selectedSecondary
      ? h(EntityCard, { key: 's-' + selectedSecondary, entityId: selectedSecondary, fetchUrl: '/api/secondary-points/' + selectedSecondary, onClose: closeSecondary })
      : null,
    heroesOpen ? h(NeighborhoodHeroesPanel, { data: heroes, onClose: closeHeroes }) : null,
    creatorsOpen ? h(CreatorsGatePanel, { onClose: closeCreators, onOpenEvents: navigateFromCreatorsToEvents }) : null,
    businessDirectoryOpen ? h(BusinessDirectoryPanel, { onClose: closeBusinessDirectory }) : null,
    nowOpen ? h(NowPanel, { data: nowData, initialTab: nowOpen.tab, initialItemId: nowOpen.itemId, onClose: closeNow, onFocusItem: setNowFocus,
      onShare: shareAvailable ? () => { closeNow(); setNowShareOpen(true); } : null }) : null,
    nowShareOpen ? h(SharePanel, { onClose: () => setNowShareOpen(false), places: anchorPoints, options: NOW_SHARE_OPTIONS, listTitle: 'יש לי משהו לשתף' }) : null,
    shareOpen ? h(SharePanel, { onClose: closeShare, places: anchorPoints, suggest: true, hidden: placing, pickedPoint, onPickPlace: startPlacing, onSuggested }) : null,
    suggestionsListOpen ? h(SuggestionsList, { items: unplacedSuggestions, onClose: () => setSuggestionsListOpen(false), onOpen: (id) => { setSuggestionsListOpen(false); setSelectedSuggestion(id); } }) : null,
    selectedSuggestion && suggestionById(selectedSuggestion)
      ? h(SuggestionCard, { item: suggestionById(selectedSuggestion), onClose: () => setSelectedSuggestion(null),
          onChanged: (u) => setSuggestions((list) => (list || []).map((x) => (x.id === u.id ? u : x))) })
      : null
  );
}

// עמוד שמשתמש ברכיבים האלה (למשל אב-הטיפוס /givatayim) מגדיר OSIM_EMBED לפני הטעינה
// ומרנדר את עצמו; בלי הדגל (מפת ארמון הנציב) - בדיוק כמו קודם.
if (!window.OSIM_EMBED) ReactDOM.createRoot(document.getElementById('root')).render(h(App));

</script>
<script>/* @preserve

<script>/* ramat-gan/timeHorizons.js - חלוקת אירועים לשלושה טווחי זמן במפת רמת גן (/ramat-gan).
   עכשיו / ימים קרובים / בקרוב, תמיד לפי שעון ירושלים (Asia/Jerusalem) - לא לפי שעון הדפדפן.

   הכללים:
   - אירוע שהסתיים (סוף <= עכשיו) לא מוצג בשום טווח.
   - בלי שעת סיום: מניחים משך של DEFAULT_DURATION_MIN דקות (הנחה של האב-טיפוס).
   - "עכשיו": אירוע שכבר התחיל ועוד לא הסתיים, או שמתחיל מאוחר יותר היום (לפי התאריך בירושלים).
   - "ימים קרובים": מתחיל ממחר ועד 7 ימים קדימה, כולל היום השביעי כולו (לפי תאריך, לא לפי 168 שעות).
   - "בקרוב": מתחיל אחרי היום השביעי.
   החלוקה לפי תאריך לוח בירושלים, כך שאירוע ב-23:59 הוא "היום" ואירוע ב-00:00 של מחר הוא "ימים קרובים",
   גם בימי מעבר שעון קיץ/חורף.

   קובץ אחד לדפדפן (window.RgTime) ולבדיקות ב-Node (module.exports). */
(function (root) {
  'use strict';

  const TIME_ZONE = 'Asia/Jerusalem';
  const COMING_DAYS = 7;
  const DEFAULT_DURATION_MIN = 120;
  const HORIZONS = [
    { key: 'now', label: 'עכשיו' },
    { key: 'coming', label: 'ימים קרובים' },
    { key: 'soon', label: 'בקרוב' },
  ];

  const dateFmt = new Intl.DateTimeFormat('en-CA', { timeZone: TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit' });
  const timeFmt = new Intl.DateTimeFormat('en-GB', { timeZone: TIME_ZONE, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const partsFmt = new Intl.DateTimeFormat('en-US', {
    timeZone: TIME_ZONE, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit',
  });

  /** YYYY-MM-DD של רגע נתון, בירושלים */
  function localDate(d) { return dateFmt.format(d); }
  /** HH:MM של רגע נתון, בירושלים */
  function localTime(d) { return timeFmt.format(d); }

  /** YYYY-MM-DD + n ימים (חשבון לוח, בלי תלות בשעון קיץ) */
  function addDays(ymd, n) {
    const d = new Date(ymd + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);

  /** ההפרש (במילישניות) בין שעון ירושלים ל-UTC ברגע נתון */
  function offsetMs(d) {
    const p = {};
    for (const x of partsFmt.formatToParts(d)) p[x.type] = x.value;

  }

  /** תאריך + שעה בירושלים -> רגע מוחלט (Date). למשל ('2026-03-10', '16:30') */
  function zonedToDate(ymd, hhmm) {
    const [y, m, day] = ymd.split('-').map(Number);
    const [hh, mm] = (hhmm || '00:00').split(':').map(Number);
    const guess = Date.UTC(y, m - 1, day, hh, mm);
    // שני סבבים מספיקים גם סביב מעבר שעון
    let t = guess - offsetMs(new Date(guess));
    t = guess - offsetMs(new Date(t));
    return new Date(t);

  function parse(v) {
    if (!v) return null;
    const d = v instanceof Date ? v : new Date(v);
    return isNaN(d.getTime()) ? null : d;

  /** סוף האירוע: endAt, או התחלה + משך ברירת המחדל */
  function endOf(item) {
    const start = parse(item.startAt);
    if (!start) return null;
    const end = parse(item.endAt);
    return end && end > start ? end : new Date(start.getTime() + DEFAULT_DURATION_MIN * 60000);
  }

  /** לאיזה טווח שייך פריט; null = לא מוצג (הסתיים, או בלי תאריך תקין) */
  function horizonOf(item, now) {
    const start = parse(item.startAt);
    if (!start) return null;
    const end = endOf(item);
    if (end.getTime() <= now.getTime()) return null;
    const today = localDate(now);
    const startDay = localDate(start);
    if (start.getTime() <= now.getTime() || startDay === today) return 'now';
    if (startDay <= addDays(today, COMING_DAYS)) return 'coming';
    return 'soon';
  }

  /** מחלק רשימת פריטים ({ startAt, endAt, ... }) לשלושת הטווחים, ממוינים לפי שעת התחלה */
  function bucket(items, now) {
    const out = { now: [], coming: [], soon: [] };
    for (const it of items) {
      const h = horizonOf(it, now);
      if (h) out[h].push(it);
    }
    for (const k of Object.keys(out)) out[k].sort((a, b) => parse(a.startAt) - parse(b.startAt));
    return out;
  }

  const api = { TIME_ZONE, COMING_DAYS, DEFAULT_DURATION_MIN, HORIZONS, localDate, localTime, addDays, zonedToDate, endOf, horizonOf, bucket };
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.RgTime = api;
})(typeof window !== 'undefined' ? window : this);

<script>/* שיתוף של נקודה אחת במפה (28.10.2026, בקשת בעל הפרויקט: "קהילה ושיווק").
 * כל מקום, עסק או אירוע מקבל קישור ישיר משלו (#place/<id>, #business/<id>, #event/<id>),
 * וכפתור "שתפו" שולח אותו: וואטסאפ, העתקת קישור, ובטלפון גם חלון השיתוף של המכשיר.
 * משותף לרמת גן ולגבעתיים; התוכן והכתובות של כל עיר נשארים שלה.
 * window.OsimShare = { ShareItem, linkTo, hashOf } */
(function () {
  const h = React.createElement;
  const { useState } = React;

  /** הכתובת המלאה של העמוד עם הקישור לנקודה */
  function linkTo(hash) {
    return location.origin + location.pathname + location.search + (hash ? '#' + hash : '');
  }
  /** { kind, id } מתוך #kind/id, או null */
  function hashOf(kinds) {
    const m = /^#(\w+)\/([\w.-]+)$/.exec(location.hash || '');
    return m && (!kinds || kinds.includes(m[1])) ? { kind: m[1], id: decodeURIComponent(m[2]) } : null;
  }

  const ICON = {
    share: 'M12 3v12M8 7l4-4 4 4M7 10H5.5v10.5h13V10H17',
    link: 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2',
    chat: 'M4 19.5l1.3-3.8A8 8 0 1 1 8.4 18.6z',
    more: 'M6 12h.01M12 12h.01M18 12h.01',
  };
  const Icon = ({ name }) => h('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true', focusable: 'false', className: 'osh-icon' },
    h('path', { d: ICON[name], fill: 'none', stroke: 'currentColor', strokeWidth: 1.9, strokeLinecap: 'round', strokeLinejoin: 'round' }));

  /** כפתור "שתפו" לנקודה אחת. title: מה רואים בהודעה; hash: הקישור הישיר (בלי #) */
  function ShareItem({ title, hash, label }) {
    const [open, setOpen] = useState(false);
    const [copied, setCopied] = useState(false);
    const url = linkTo(hash);
    const text = title + '\n' + url;
    const copy = () => {
      const ok = () => { setCopied(true); setTimeout(() => setCopied(false), 1800); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, () => window.prompt('העתיקו את הקישור:', url));
      else window.prompt('העתיקו את הקישור:', url);
    };
    const more = async () => { try { await navigator.share({ title, text: title, url }); } catch (_) { /* החלון נסגר */ } };
    return h('div', { className: 'osh' + (open ? ' is-open' : ''), 'data-share-hash': hash },
      h('button', { type: 'button', className: 'osh-btn', 'aria-expanded': open, onClick: () => setOpen((o) => !o) },
        h(Icon, { name: 'share' }), label || 'שתפו'),
      open ? h('div', { className: 'osh-row', role: 'group', 'aria-label': 'שיתוף ' + title },
        h('a', { className: 'osh-net osh-net--wa', href: 'https://wa.me/?text=' + encodeURIComponent(text), target: '_blank', rel: 'noopener noreferrer' },
          h(Icon, { name: 'chat' }), 'וואטסאפ'),
        h('button', { type: 'button', className: 'osh-net', onClick: copy, 'data-action': 'copy-link' },
          h(Icon, { name: 'link' }), copied ? 'הקישור הועתק' : 'העתקת קישור'),
        typeof navigator.share === 'function'
          ? h('button', { type: 'button', className: 'osh-net', onClick: more }, h(Icon, { name: 'more' }), 'עוד')
          : null) : null);
  }

  window.OsimShare = { ShareItem, linkTo, hashOf };
})();

</script>
<script>/* ramat-gan.js - אב-טיפוס מפת המשפחות של רמת גן (/ramat-gan), בעיצוב הסקיצה של רמת גן.
   מפה אמיתית עם זום (Leaflet + אריחי OpenStreetMap), גבול העיר והשכונות (ramat-gan/geo.json), וארבע שכבות. שכבה אחת פעילה בכל רגע: טבע, קהילה, עסק מקומי,
   מה קורה בעיר. כל שכבה מציגה רק את הנקודות שלה, בצבע שלה, עם תווית קצרה.
   פס "מה קורה בעיר?" מתחת למפה בשלושה טווחים (עכשיו / ימים קרובים / בקרוב, ramat-gan/timeHorizons.js),
   חיפוש, וסינון לפי תחומי עניין שנשמר רק בזיכרון של העמוד (לא ב-localStorage ולא בשרת).

   רכיבים קיימים מ-anchor-map.js (נטען עם OSIM_EMBED, כך שמפת ארמון הנציב לא מופעלת):
     BusinessDirectoryPanel - אינדקס העסקים (/api/business-directory, עסקים לדוגמה מה-DB של רמת גן)
     SharePanel - "יש לי משהו להציע" (שכבת הקהילה הקיימת, עם תור אישורים של מפעיל)
     NowItemDetail / NowMeta / NowDemoBadge - פרטי אירוע; אירוע אמיתי מטבלת events נפתח בהרשמה הקיימת
   h / useState / useEffect / useFetch מוגדרים ב-anchor-map.js. כל התוכן כאן לדוגמה (ramat-gan/config.json). */

const { useMemo, useLayoutEffect, useRef } = React;
const T = window.RgTime;
const RG_DEMO_EVENT_NOTE = 'תוכן לדוגמה לאב-טיפוס - לא אירוע מאומת';
// כשבוחרים שכבה המפה מתמקדת בנקודות שלה; השוליים משאירים מקום למה שצף מעל המפה (המפה על כל המסך):
// פס המקרא משמאל, הכותרת והחיפוש למעלה, ופס הפעולות למטה
const RG_FIT = { paddingTopLeft: [56, 150], paddingBottomRight: [40, 90], maxZoom: 15 };
const RG_FIT_WITH_TOOLS = { paddingTopLeft: [90, 150], paddingBottomRight: [56, 100], maxZoom: 15 };
// התאמת העיר כולה (בפתיחה ובמעבר סגנון)
const rgCityFit = (el) => (el.clientWidth < 520
  ? { paddingTopLeft: [10, 150], paddingBottomRight: [10, 80] }
  : { paddingTopLeft: [90, 70], paddingBottomRight: [20, 90] });
// מי שביקש פחות תנועה: המפה קופצת ליעד בלי טיסה ובלי אנימציית זום
const rgReducedMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- המפה: Leaflet, אריחי OpenStreetMap, ושני סגנונות ----------
   "מאוירת" (ברירת המחדל): פאזל השכונות - כל שכונה חלק בצבע רך, בצורה כללית ומעוגלת - ועליו הפארקים,
   האגם ורחוב ביאליק בצורות כלליות (ramat-gan/illustrated.json). הכיוונים והשכנויות נכונים, הגבולות לא מדויקים.
   "מפורטת": המפה כמו שהיא, עם גבולות השכונות כפי שמופו ב-OSM (קו מקווקו; שכונה שמופתה רק כנקודה - שם בלבד).
   בשני הסגנונות מחוץ לעיר המפה מעומעמת, ושמות השכונות לא מוצגים בזום רחוק, כדי שלא יעמיסו. */
const RG_PIECE_TONES = ['#f6e4c1', '#dfeccf', '#f6d9c9', '#dbe8f0', '#ece0ef'];

/* "כמו שזוכרים" (ברירת המחדל): מפה קוגניטיבית, כמו שילד מצייר את מקום ילדותו. אותה מפה מאוירת, אבל כל עוגן
   (landmarks ב-config, עם weight ו-reach במטרים) מותח את המרחב סביבו לפי החשיבות שלו, כמו יריעת גומי:
   העוגן והשכונה שלו גדלים, והאזורים הרחוקים מכל עוגן נדחסים. הסדר והכיוונים נשארים נכונים, הגודל לא.
   הנקודות של השכבות עוברות את אותה מתיחה, כך שהן נשארות באותו מקום יחסית לצורות. */
function rgMakeWarp(landmarks) {
  const lat0 = 32.07, kx = 111320 * Math.cos((lat0 * Math.PI) / 180), ky = 110540;
  const anchors = (landmarks || []).filter((l) => l.weight > 0).map((l) => ({ lat: l.lat, lng: l.lng, w: l.weight, r: l.reach || 600 }));
  return (lat, lng) => {
    let dx = 0, dy = 0; // מטרים
    for (const a of anchors) {
      const ex = (lng - a.lng) * kx, ey = (lat - a.lat) * ky;
      const g = a.w * Math.exp(-(ex * ex + ey * ey) / (a.r * a.r));
      dx += ex * g; dy += ey * g;
    }
    return [lat + dy / ky, lng + dx / kx];
  };
}
// מצפיף קווים (כל ~40 מ') כדי שגם קטעים ישרים יתעקמו עם המתיחה
function rgDensify(ring, step = 0.0004) {
  const out = [];
  for (let i = 0; i < ring.length; i++) {
    const a = ring[i], b = ring[i + 1];
    out.push(a);
    if (!b) break;
    const n = Math.floor(Math.hypot(b[0] - a[0], b[1] - a[1]) / step);
    for (let k = 1; k < n; k++) out.push([a[0] + ((b[0] - a[0]) * k) / n, a[1] + ((b[1] - a[1]) * k) / n]);
  }
  return out;
}
function rgWarpGeometry(g, warp) {
  const ring = (r) => rgDensify(r).map(([x, y]) => { const [la, ln] = warp(y, x); return [ln, la]; });
  if (g.type === 'LineString') return { type: g.type, coordinates: ring(g.coordinates) };
  if (g.type === 'Polygon') return { type: g.type, coordinates: g.coordinates.map(ring) };
  if (g.type === 'MultiPolygon') return { type: g.type, coordinates: g.coordinates.map((p) => p.map(ring)) };
  return g;
}

function createRgMap(el, mapCfg, geo, ill) {
  const still = rgReducedMotion();
  const map = L.map(el, {
    zoomAnimation: !still, fadeAnimation: !still, markerZoomAnimation: !still,
    zoomControl: false, minZoom: mapCfg.minZoom, maxZoom: mapCfg.maxZoom, zoomSnap: 0.5, wheelPxPerZoomLevel: 90,
  });
  L.control.zoom({ position: 'bottomleft', zoomInTitle: 'הגדלה', zoomOutTitle: 'הקטנה' }).addTo(map);
  map.attributionControl.setPrefix(false);
  const tiles = L.tileLayer(mapCfg.tiles, { maxZoom: 19, attribution: mapCfg.attribution }).addTo(map);

  const city = geo.features.find((f) => f.properties.kind === 'city');
  const hoods = geo.features.filter((f) => f.properties.kind === 'neighborhood');
  const named = geo.features.filter((f) => f.properties.kind === 'neighborhood' || f.properties.kind === 'neighborhood-label');
  const [w, s, e, n] = geo.bbox;
  const ll = (ring) => ring.map(([x, y]) => [y, x]);
  const pad = 0.6;
  const world = [[s - pad, w - pad], [s - pad, e + pad], [n + pad, e + pad], [n + pad, w - pad]];
  // עמעום מחוץ לעיר: מלבן גדול עם "חור" בצורת העיר
  const mask = (holes, opacity) => L.polygon([world, ...holes], { className: 'rg-geo-mask', stroke: false, fillColor: '#fcf8ee', fillOpacity: opacity, interactive: false });

  const detail = L.layerGroup([
    mask(city.geometry.coordinates.map((poly) => ll(poly[0])), 0.7),
    L.geoJSON({ type: 'FeatureCollection', features: hoods }, {
      interactive: false, style: { className: 'rg-geo-hood', color: '#1f6b33', weight: 1.4, opacity: 0.7, dashArray: '5 5', fillColor: '#1f6b33', fillOpacity: 0.035 },
    }),
    L.geoJSON(city, { interactive: false, style: { className: 'rg-geo-city', color: '#0f2a4f', weight: 3, opacity: 0.85, fill: false } }),
  ]);

  const warp = rgMakeWarp(mapCfg.landmarks);
  const same = (lat, lng) => [lat, lng];
  const buildArt = (W, memory) => {
  const art = L.layerGroup();
  if (ill) {
    const of = (k) => ill.features.filter((f) => f.properties.kind === k)
      .map((f) => (W === same ? f : { ...f, geometry: rgWarpGeometry(f.geometry, W) }));
    const artCity = of('city')[0];
    art.addLayer(mask([ll(artCity.geometry.coordinates[0])], 0.86));
    art.addLayer(L.geoJSON({ type: 'FeatureCollection', features: of('piece') }, {
      interactive: false,
      style: (f) => ({ className: 'rg-art-piece', color: '#fffdf8', weight: 3.5, opacity: 1, fillColor: RG_PIECE_TONES[f.properties.tone % RG_PIECE_TONES.length], fillOpacity: 0.82 }),
    }));
    art.addLayer(L.geoJSON({ type: 'FeatureCollection', features: of('green') }, {
      interactive: false, style: { className: 'rg-art-green', color: '#5f9c55', weight: 1.5, opacity: 0.9, fillColor: '#a8d494', fillOpacity: 0.95 },
    }));
    art.addLayer(L.geoJSON({ type: 'FeatureCollection', features: of('water') }, {
      interactive: false, style: { className: 'rg-art-water', color: '#5a9fd0', weight: 1.2, opacity: 0.9, fillColor: '#9fd0f0', fillOpacity: 1 },
    }));
    // ביאליק: העורק הראשי, קו כתום עבה עם שוליים לבנים ושם, כמו בסקיצה
    for (const road of of('road')) {
      art.addLayer(L.geoJSON(road, { interactive: false, style: { className: 'rg-art-road-casing', color: '#fffdf8', weight: 17, opacity: 1, lineCap: 'round', lineJoin: 'round' } }));
      art.addLayer(L.geoJSON(road, { interactive: false, style: { className: 'rg-art-road', color: '#f0883a', weight: 11, opacity: 1, lineCap: 'round', lineJoin: 'round' } }));
      const c = road.geometry.coordinates;
      const [lng, lat] = c[Math.floor(c.length * (memory ? 0.55 : 0.5))];
      const tag = document.createElement('span');
      tag.textContent = road.properties.name;
      art.addLayer(L.marker([lat, lng], { icon: L.divIcon({ className: 'rg-road-label', html: tag, iconSize: null }), interactive: false, keyboard: false, zIndexOffset: 400 }));
    }
    art.addLayer(L.geoJSON(artCity, { interactive: false, style: { className: 'rg-art-city', color: '#0f2a4f', weight: 3.5, opacity: 0.9, fill: false } }));
    // איורים מהמפה המאוירת שלנו, כל אחד במקום האמיתי שלו
    for (const lm of mapCfg.landmarks || []) {
      // האיור, ונקודה וקו שמחברים אותו למקום האמיתי כשצריך להזיז אותו הצידה (במפה רחוקה, כשאיורים קרובים זה לזה)
      const wrap = document.createElement('span');
      wrap.className = 'rg-landmark-wrap';
      // במפה הקוגניטיבית האיור גדל לפי המשקל שלו
      if (memory) wrap.style.setProperty('--lm', Math.round(68 * (1 + 0.42 * (lm.weight || 0))) + 'px');
      const line = document.createElement('span');
      line.className = 'rg-landmark-line';
      const pin = document.createElement('span');
      pin.className = 'rg-landmark-pin';
      const box = document.createElement('span');
      box.className = 'rg-landmark-box';
      const img = document.createElement('img');
      img.src = lm.img; img.alt = ''; img.width = 68; img.height = 68; img.decoding = 'async';
      const cap = document.createElement('span');
      cap.className = 'rg-landmark-cap'; cap.textContent = lm.label;
      box.append(img, cap);
      wrap.append(line, pin, box);
      art.addLayer(L.marker(W(lm.lat, lm.lng), {
        icon: L.divIcon({ className: 'rg-landmark', html: wrap, iconSize: null }), interactive: false, keyboard: false, zIndexOffset: 500,
      }));
    }
  }
  return art;
  };
  const art = buildArt(same, false);
  const memory = buildArt(warp, true);

  // שמות השכונות: קודם אלה שיש להן גבול ממופה; שם שמתנגש בשם שכבר הוצג (או באיור) מוסתר עד שמגדילים
  const labels = L.layerGroup();
  const spans = [];
  const labelMarkers = [];
  for (const f of [...named].sort((a, b) => (a.properties.kind === 'neighborhood' ? 0 : 1) - (b.properties.kind === 'neighborhood' ? 0 : 1))) {
    const span = document.createElement('span');
    span.textContent = f.properties.name;
    spans.push(span);
    const m = L.marker(f.properties.center, {
      icon: L.divIcon({ className: 'rg-hood-label' + (f.properties.kind === 'neighborhood' ? '' : ' is-name-only'), html: span, iconSize: null }),
      interactive: false, keyboard: false,
    });
    labelMarkers.push([m, f.properties.center]);
    labels.addLayer(m);
  }
  const hit = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
  const declutter = () => {
    // מכשולים: האיורים, והנקודות של השכבה הפעילה עם התוויות שלהן (הן מעל המפה, באותה במה)
    // קודם האיורים, לפי סדר העדיפות בהגדרות. איור שמתנגש באיור שכבר הוצג זז הצידה, עם קו למקום האמיתי;
    // רק אם אין לו מקום בכלל הוא מוסתר עד שמגדילים
    const frame = el.getBoundingClientRect();
    const shownArt = [...el.querySelectorAll('.rg-road-label span'), ...(el.parentNode ? el.parentNode.querySelectorAll('.rg-hint, .rg-style-toggle') : [])]
      .map((x) => x.getBoundingClientRect()).filter((r) => r.width);
    const moves = [[0, 0]];
    for (const rad of [78, 118]) for (let k = 0; k < 8; k++) moves.push([Math.round(rad * Math.cos((k * Math.PI) / 4 - Math.PI / 2)), Math.round(rad * Math.sin((k * Math.PI) / 4 - Math.PI / 2))]);
    for (const w of el.querySelectorAll('.rg-landmark-wrap')) {
      const b = w.querySelector('.rg-landmark-box');
      w.classList.remove('is-hidden', 'is-moved');
      w.style.setProperty('--dx', '0px'); w.style.setProperty('--dy', '0px');
      const r = b.getBoundingClientRect();
      if (!r.width) continue;
      const at = moves.find(([dx, dy]) => {
        const q = { left: r.left + dx, right: r.right + dx, top: r.top + dy, bottom: r.bottom + dy };
        return q.left >= frame.left && q.right <= frame.right && q.top >= frame.top && q.bottom <= frame.bottom && !shownArt.some((o) => hit(q, o));
      });
      if (!at) { w.classList.add('is-hidden'); continue; }
      const [dx, dy] = at;
      if (dx || dy) {
        w.classList.add('is-moved');
        w.style.setProperty('--dx', dx + 'px'); w.style.setProperty('--dy', dy + 'px');
        w.style.setProperty('--len', Math.hypot(dx, dy) + 'px'); w.style.setProperty('--angle', Math.atan2(dy, dx) + 'rad');
      }
      shownArt.push({ left: r.left + dx, right: r.right + dx, top: r.top + dy, bottom: r.bottom + dy });
    }
    const stage = el.parentNode;
    const taken = [...el.querySelectorAll('.rg-landmark-wrap:not(.is-hidden) .rg-landmark-box, .rg-road-label span'), ...(stage ? stage.querySelectorAll('.rg-pt-dot, .rg-pt:not(.is-label-hidden) .rg-pt-label') : [])]
      .map((b) => b.getBoundingClientRect()).filter((r) => r.width);
    const box = el.getBoundingClientRect();
    for (const span of spans) {
      span.classList.remove('is-hidden');
      const r = span.getBoundingClientRect();
      if (!r.width) continue;
      const cut = r.left < box.left || r.right > box.right || r.top < box.top || r.bottom > box.bottom;
      if (cut || taken.some((q) => hit(r, q))) span.classList.add('is-hidden'); else taken.push(r);
    }
  };

  const bounds = L.latLngBounds([s, w], [n, e]);
  const memoryBounds = L.latLngBounds([]);
  if (ill) for (const r of rgWarpGeometry(ill.features.find((f) => f.properties.kind === 'city').geometry, warp).coordinates.flat()) memoryBounds.extend([r[1], r[0]]);
  map.setMaxBounds((memoryBounds.isValid() ? L.latLngBounds(bounds.getSouthWest(), bounds.getNorthEast()).extend(memoryBounds) : bounds).pad(0.35));
  map.fitBounds(bounds, { ...rgCityFit(el), animate: false });
  const zoomClass = () => {
    el.classList.toggle('rg-z-far', map.getZoom() < 14);
    el.classList.toggle('rg-z-xfar', map.getZoom() < 13.5);
  };
  map.on('zoomend', zoomClass);
  zoomClass();
  map.on('zoomend moveend resize', declutter);

  // המקום על המסך של נקודה אמיתית בסגנון הנוכחי (במפה הקוגניטיבית - אחרי המתיחה)
  let current = 'art';
  const place = (lat, lng) => (current === 'memory' ? warp(lat, lng) : [lat, lng]);
  const groups = { art, memory, detail };

  /** מחליף סגנון: 'memory' (כמו שזוכרים), 'art' (מאוירת) או 'detail' (מפורטת) */
  const setStyle = (style) => {
    const next = ill ? style : 'detail';
    const was = current;
    current = next;
    for (const k of Object.keys(groups)) if (k !== next) map.removeLayer(groups[k]);
    groups[next].addTo(map);
    for (const [m, c] of labelMarkers) m.setLatLng(place(c[0], c[1]));
    labels.remove();
    labels.addTo(map); // השמות תמיד מעל הצורות
    // במפה הקוגניטיבית הרחובות האמיתיים כבר לא מתאימים לצורות, ולכן הם לא מוצגים
    tiles.setOpacity(next === 'memory' ? 0 : next === 'art' ? 0.45 : 1);
    el.classList.toggle('rg-style-art', next !== 'detail');
    el.classList.toggle('rg-style-memory', next === 'memory');
    if ((was === 'memory') !== (next === 'memory')) map.fitBounds(next === 'memory' ? memoryBounds : bounds, { ...rgCityFit(el), animate: false });
    declutter();
  };
  return { map, setStyle, declutter, place };
}

/** קובץ יומן (.ics) לאירוע אחד; נפתח בכל יומן בטלפון ובמחשב */
function rgIcs(item) {
  const fmt = (iso) => new Date(iso).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const esc = (t) => String(t || '').replace(/[\\,;]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
  const end = item.endAt || new Date(new Date(item.startAt).getTime() + 3600000).toISOString();
  const desc = [item.description, item.provenance && !item.provenance.verified ? item.provenance.note : null, window.OsimShare ? window.OsimShare.linkTo('event/' + item.id) : null].filter(Boolean).join('\n');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//osim-kehila//ramat-gan//HE', 'BEGIN:VEVENT',
    'UID:' + item.id + '-' + item.date + '@osimkehila.co.il', 'DTSTAMP:' + fmt(new Date().toISOString()),
    'DTSTART:' + fmt(item.startAt), 'DTEND:' + fmt(end), 'SUMMARY:' + esc(item.title),
    item.locationLabel ? 'LOCATION:' + esc(item.locationLabel + ', רמת גן') : null, 'DESCRIPTION:' + esc(desc),
    'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');
}
function RgCalendarButton({ item }) {
  if (!item.startAt) return null;
  const save = () => {
    const url = URL.createObjectURL(new Blob([rgIcs(item)], { type: 'text/calendar;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = (item.title || 'event').replace(/[\\/:*?"<>|]/g, '') + '.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  return h('button', { type: 'button', className: 'osh-btn rg-cal-btn', 'data-action': 'add-to-calendar', onClick: save },
    h(RgIcon, { name: 'now' }), 'הוספה ליומן');
}

/** תוויות שמתנגשות זו בזו (או יוצאות מהמפה) עוברות לצד השני, ואם עדיין מתנגשות - מוסתרות.
 *  הנקודה עצמה נשארת, עם השם ב-aria-label. */
function useLabelLayout(stageRef, deps) {
  useLayoutEffect(() => {
    const stage = stageRef.current;
    if (!stage) return undefined;
    const run = () => {
      const pts = Array.from(stage.querySelectorAll('.rg-pt'));
      const box = stage.getBoundingClientRect();
      const dots = pts.map((p) => p.querySelector('.rg-pt-dot').getBoundingClientRect());

      const placed = [];
      const hit = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
      const fits = (r, i) => r.left >= box.left && r.right <= box.right && r.top >= box.top && r.bottom <= box.bottom &&
        !placed.some((q) => hit(r, q)) && !dots.some((d, j) => j !== i && hit(r, d));
      pts.forEach((p, i) => {
        p.classList.remove('is-flip', 'is-up', 'is-down', 'is-short', 'is-label-hidden');
        const label = p.querySelector('.rg-pt-label');
        let r;
        // הסדר: בצד הרגיל, בצד השני, מעל, מתחת; אחר כך מקוצרת באותו סדר; רק אם אין ברירה - מוסתרת
        const sides = [[], ['is-flip'], ['is-up'], ['is-down']];
        const tries = [...sides, ...sides.map((c) => [...c, 'is-short'])];
        for (const cls of tries) {
          p.classList.remove('is-flip', 'is-up', 'is-down', 'is-short');
          cls.forEach((c) => p.classList.add(c));
          r = label.getBoundingClientRect();
          if (fits(r, i)) { placed.push(r); return; }
        }
        p.classList.remove('is-flip', 'is-up', 'is-down', 'is-short');
        p.classList.add('is-label-hidden');
      });
    };
    run();
    const ro = typeof ResizeObserver === 'function' ? new ResizeObserver(run) : null;
    if (ro) ro.observe(stage);
    return () => { if (ro) ro.disconnect(); };
  }, deps);
}

  const s = q.trim().toLowerCase();
  if (s.length < 2) return [];
  const has = (...xs) => xs.some((x) => x && String(x).toLowerCase().includes(s));
  const out = [];
  for (const p of cfg.points) if (has(p.label, p.nature && p.nature.type, p.community && p.community.kind)) out.push({ kind: 'point', layer: p.layer, title: p.label, ref: p });
  if (layersByKey.business) for (const b of businesses) if (has(b.name, b.category, b.description)) out.push({ kind: 'business', layer: 'business', title: b.name, ref: b });
  for (const e of events) if (has(e.title, e.category, e.locationLabel)) out.push({ kind: 'event', layer: 'now', title: e.title, ref: e });
  return out.slice(0, 8).map((r) => ({ ...r, color: layersByKey[r.layer].color, layerLabel: layersByKey[r.layer].label }));
}

/* ---------- "מהקהילה": יוזמות ורעיונות מאושרים, עם "אני רוצה לעזור" הקיים ----------
   אותם ממשקים ואותן הרשאות כמו בעמוד "מה קורה בקהילה" (/api/initiatives, /api/proposals, .../join).
   לציבור רק מספר המצטרפים; שם והערה מגיעים רק למובילים ולמפעילים (נאכף בשרת, app/lib/ideas.ts).
   ליוזמות ולרעיונות אין עדיין מקום, ולכן הם ברשימה ולא כנקודות במפה. */
const RG_OPEN_INITIATIVE = ['planned', 'active'];
const RG_SEEKING = ['seeking_partners'];

function joinErrorText(r) {
  const code = r.data && r.data.error;
  if (r.status === 0) return 'אין חיבור כרגע. נסו שוב.';
  if (code === 'owner_cannot_join') return 'זו היוזמה שלכם - אין צורך להצטרף אליה.';
  if (code === 'not_open') return 'היוזמה הזו כבר לא מחפשת עזרה.';
  if (r.status === 404) return 'הפריט כבר לא זמין.';
  if (r.status === 429) return 'הרבה פעולות בזמן קצר. נסו שוב בעוד כמה דקות.';
  if (r.status === 400) return 'חלק מהפרטים לא תקינים (למשל הערה ארוכה מ-280 תווים).';
  return 'משהו השתבש. נסו שוב.';
}

    item.description ? h('p', { className: 'rg-card-text' }, item.description) : null,
    h('div', { className: 'rg-ci-meta', 'data-role': 'joiners' }, n ? (n === 1 ? 'הצטרף/ה תושב/ת אחד/ת' : n + ' תושבים הצטרפו') : 'עוד אין מצטרפים'),

              !me ? h('label', { htmlFor: 'rg-ci-name-' + item.id }, 'השם שיוצג למובילים') : null,

              h('label', { htmlFor: 'rg-ci-note-' + item.id }, 'במה תוכלו לעזור? (לא חובה)'),

              h('div', { className: 'rg-card-actions' },
                h('button', { type: 'submit', className: 'am-btn link', 'data-action': 'join', disabled: busy || (!me && !name.trim()) }, busy ? 'שולחים...' : 'הצטרפות'),
                h('button', { type: 'button', className: 'rg-link-btn', onClick: () => setOpen(false) }, 'לא עכשיו'))));

function CommunityPanel({ onClose, onShare }) {
  const [key, setKey] = useState(loadShareKey);
  const [me, setMe] = useState(null);
  const [data, setData] = useState(null);
  const [busy, setBusy] = useState(false);
  const [flash, setFlash] = useState(null);
  const load = async (k) => {
    if (k) {
      const r = await shareRequest('GET', '/api/me', null, k);
      if (r.status === 200) setMe(r.data); else if (r.status === 401 || r.status === 403) { saveShareKey(null); setKey(null); k = null; }
    }
    const [ini, pro] = await Promise.all([shareRequest('GET', '/api/initiatives', null, k), shareRequest('GET', '/api/proposals', null, k)]);
    if (ini.status !== 200 || pro.status !== 200) { setData({ error: true }); return; }
    setData({
      initiatives: (ini.data.items || []).filter((i) => RG_OPEN_INITIATIVE.includes(i.status)),
      proposals: (pro.data.items || []).filter((p) => RG_SEEKING.includes(p.status)),
    });
  };
  useEffect(() => { load(key); }, []); // eslint-disable-line
  const path = (kind, item) => '/api/' + (kind === 'initiative' ? 'initiatives' : 'proposals') + '/' + encodeURIComponent(item.id) + '/join';
  const replace = (kind, next) => setData((d) => {
    const list = kind === 'initiative' ? 'initiatives' : 'proposals';
    return { ...d, [list]: d[list].map((x) => (x.id === next.id ? { ...x, ...next } : x)) };
  });
  async function onJoin(item, kind, note, name) {
    if (busy) return false;
    setBusy(true); setFlash(null);
    try {
      let k = key;
      if (!k || !me) {
        const c = await shareRequest('POST', '/api/users', { displayName: name });
        if (c.status !== 201) { setFlash({ error: true, text: joinErrorText(c) }); return false; }
        k = c.data.token; saveShareKey(k); setKey(k); setMe(c.data.user);
      }
      const r = await shareRequest('POST', path(kind, item), note ? { note } : {}, k);
      if (r.status !== 200) { setFlash({ error: true, text: joinErrorText(r) }); return false; }
      replace(kind, r.data);
      setFlash({ text: 'הצטרפתם ל"' + item.title + '".' });
      return true;
    } finally { setBusy(false); }
  }
  async function onLeave(item, kind) {
    if (busy) return;
    setBusy(true); setFlash(null);
    try {
      const r = await shareRequest('DELETE', path(kind, item), null, key);
      if (r.status !== 200) { setFlash({ error: true, text: joinErrorText(r) }); return; }
      replace(kind, r.data);
      setFlash({ text: 'ההצטרפות בוטלה.' });
    } finally { setBusy(false); }
  }
  const all = data && !data.error ? [...data.initiatives.map((i) => ['initiative', i]), ...data.proposals.map((p) => ['proposal', p])] : [];
  return h(RgSheet, { label: 'יוזמות ורעיונות מהקהילה', onClose },
    h('div', { className: 'am-creators-title' }, 'יוזמות ורעיונות מהקהילה'),
    h('div', { className: 'am-creators-sub' }, 'יוזמות שאושרו ורעיונות שמחפשים שותפים. אפשר להצטרף ולעזור.'),
    flash ? h('div', { className: 'rg-ci-flash' + (flash.error ? ' is-error' : ''), role: 'status' }, flash.text) : null,
    !data ? h('div', { className: 'rg-empty' }, 'טוען...')
      : data.error ? h('div', { className: 'rg-empty' }, 'הרשימה לא זמינה כרגע.')
        : all.length
          ? h('ul', { className: 'rg-ci-list' }, all.map(([kind, it]) => h(CommunityItem, { key: kind + it.id, item: it, kind, me, busy, onJoin, onLeave })))
          : h('div', { className: 'rg-empty' }, 'עוד אין יוזמות או רעיונות שאושרו. אפשר להיות הראשונים.'),
    h('button', { type: 'button', className: 'rg-link-btn', onClick: onShare }, 'יש לי יוזמה או רעיון לשתף'));
}
