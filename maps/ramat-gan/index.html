        : String(business.id || '').startsWith('biz_join_') ? 'מקור: העסק הצטרף דרך טופס ההצטרפות ואושר על ידי מפעיל הקהילה' :
      'מקור: אינדקס עסקים - שכונת תלפ"ז וארנונה הצעירה' + (business.sourceSlides && business.sourceSlides.length ? ' (סליידים ' + business.sourceSlides.join(', ') + ')' : ''))
  );
}

/* ===== הטבה / קופון לעסק =====
   טקסט ההטבה הוא השדה הקיים promotion (מהמקור או מבקשת הצטרפות שאושרה);
   קוד ותוקף - couponCode/couponExpires, אופציונליים. מוצג רק כשיש הטבה,
   וקופון שתוקפו עבר לא מוצג. לא ממציאים הטבות לעסקים. */
function activeCoupon(business) {
  if (!business || !business.promotion) return null;
  const exp = business.couponExpires;
  if (exp && /^\d{4}-\d{2}-\d{2}$/.test(exp) && exp < new Date().toISOString().slice(0, 10)) return null;
  return { text: business.promotion, code: business.couponCode || null, expires: exp || null };
}
function formatCouponDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  return isNaN(d.getTime()) ? iso : d.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: 'numeric' });
}
function BusinessCoupon({ business, compact = false }) {
  const c = activeCoupon(business);
  if (!c) return null;
  return h('div', { className: 'am-business-coupon' + (compact ? ' is-compact' : '') },
    h('span', { className: 'am-business-coupon-label' }, '🎁 הטבה'),
    h('span', { className: 'am-business-coupon-text' }, c.text),
    !compact && c.code ? h('span', { className: 'am-business-coupon-code' }, 'קוד: ', h('bdi', { dir: 'ltr' }, c.code)) : null,
    !compact && c.expires ? h('span', { className: 'am-business-coupon-exp' }, 'בתוקף עד ' + formatCouponDate(c.expires)) : null
  );
}

/* ===== הצטרפות לעסקים - טופס בקשה (POST /api/business-join, lib/businessJoin.ts) =====
   הבקשה נשמרת כ"ממתינה לבדיקה" ולא מתפרסמת אוטומטית; מפעיל קהילה בודק ומוסיף
   למדריך. קבצים: לוגו אחד + עד 3 תמונות, PNG/JPEG/WEBP עד 1.5MB (נבדק גם בשרת). */
const JOIN_MAX_FILE_BYTES = 1500000;
const JOIN_FILE_TYPES = ['image/png', 'image/jpeg', 'image/webp'];
const JOIN_MAX_PHOTOS = 3;

function readAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}

function BusinessJoinAction({ onBack }) {
  const [f, setF] = useState({
    businessName: '', category: '', description: '', address: '', contactName: '', phone: '', email: '',
    website: '', instagram: '', facebook: '', couponText: '', couponCode: '', couponExpires: '',
  });
  const [logo, setLogo] = useState(null);
  const [photos, setPhotos] = useState([]);
  const [consent, setConsent] = useState(false);
  const [fileError, setFileError] = useState(null);
  const [error, setError] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const set = (k) => (e) => setF((cur) => Object.assign({}, cur, { [k]: e.target.value }));

  // Escape: מהטופס חוזרים למדריך (לא סוגרים את כל החלונית ומאבדים את מה שהוקלד)
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') { e.stopImmediatePropagation(); onBack(); } };
    window.addEventListener('keydown', onKey, true);
    return () => window.removeEventListener('keydown', onKey, true);
  }, [onBack]);

  function checkFile(file) {
    if (JOIN_FILE_TYPES.indexOf(file.type) < 0) return 'הקובץ "' + file.name + '" אינו תמונה מסוג PNG, JPG או WEBP';
    if (file.size > JOIN_MAX_FILE_BYTES) return 'הקובץ "' + file.name + '" גדול מ-1.5MB';
    return null;
  }
  function pickLogo(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const err = checkFile(file);
    setFileError(err);
    if (!err) setLogo(file);
  }
  function pickPhotos(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    const errs = files.map(checkFile).filter(Boolean);
    const ok = files.filter((x) => !checkFile(x));
    const next = photos.concat(ok).slice(0, JOIN_MAX_PHOTOS);
    setFileError(errs[0] || (photos.length + ok.length > JOIN_MAX_PHOTOS ? 'אפשר לצרף עד ' + JOIN_MAX_PHOTOS + ' תמונות' : null));
    setPhotos(next);
  }

  function submit(e) {
    e.preventDefault();
    if (!f.businessName.trim() || !f.contactName.trim()) return setError('שם העסק ושם איש הקשר הם שדות חובה');
    if (!f.phone.trim() && !f.email.trim()) return setError('צריך טלפון או אימייל כדי שנחזור אליכם');
    if ((f.couponCode.trim() || f.couponExpires) && !f.couponText.trim()) return setError('כדי לצרף קוד או תוקף, כתבו גם מה ההטבה');
    if (!consent) return setError('יש לאשר את תנאי הפרסום');
    setSubmitting(true);
    setError(null);
    const files = (logo ? [{ kind: 'logo', file: logo }] : []).concat(photos.map((file) => ({ kind: 'photo', file })));
    Promise.all(files.map((x) => readAsDataUrl(x.file).then((dataUrl) => ({ kind: x.kind, dataUrl }))))
      .then((uploads) => {
        const body = { consent: true, uploads };
        Object.keys(f).forEach((k) => { const v = f[k].trim(); if (v) body[k] = v; });
        return fetch('/api/business-join', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      })
      .then((r) => r.json().catch(() => ({})).then((j) => { if (!r.ok) throw Object.assign(new Error('join failed'), { status: r.status, code: j.error, detail: j.detail }); return j; }))
      .then(() => setSubmitted(true))
      .catch((err) => setError(
        err.status === 429 ? 'נשלחו הרבה בקשות מהמכשיר הזה. נסו שוב מאוחר יותר'
          : err.status === 503 ? 'ההצטרפות עדיין לא פתוחה. נסו שוב בקרוב'
          : err.code === 'invalid_upload' ? 'אחד הקבצים לא התקבל. צרפו תמונה מסוג PNG, JPG או WEBP עד 1.5MB'
          : err.status === 400 && err.detail && /https?/.test(err.detail) ? 'קישורים צריכים להתחיל ב-https://'
          : 'השליחה לא הצליחה, נסו שוב'))
      .finally(() => setSubmitting(false));
  }

  const field = (k, label, opts = {}) => h('label', { className: 'am-join-field' },
    h('span', { className: 'am-join-label' }, label, opts.required ? h('span', { className: 'am-join-req', 'aria-hidden': 'true' }, ' *') : null),
    h(opts.multiline ? 'textarea' : 'input', Object.assign({
      className: 'am-directory-search am-join-input', value: f[k], onChange: set(k), required: !!opts.required,
      maxLength: opts.max || 160, rows: opts.multiline ? 3 : undefined,
    }, opts.type ? { type: opts.type } : { type: opts.multiline ? undefined : 'text' }, opts.placeholder ? { placeholder: opts.placeholder } : {}, opts.dir ? { dir: opts.dir } : {}))
  );

  if (submitted) {
    return h('div', { className: 'am-creators-detail am-business-join' },
      h('button', { className: 'am-creators-back', onClick: onBack }, '‹ חזרה'),
      h('div', { className: 'am-creators-title' }, 'הבקשה התקבלה, תודה!'),
      h('p', { className: 'am-creators-sub' }, 'צוות הקהילה יעבור על הפרטים ויחזור אליכם. העסק יופיע במדריך רק אחרי הבדיקה.'),
      h('button', { className: 'am-btn link', onClick: onBack }, 'חזרה למדריך העסקים')
    );
  }

  return h('div', { className: 'am-creators-detail am-business-join' },
    h('button', { className: 'am-creators-back', onClick: onBack }, '‹ חזרה'),
    h('div', { className: 'am-creators-title' }, 'הצטרפות לעסקים'),
    h('p', { className: 'am-creators-sub' }, 'עסק או נותן שירות בשכונה? ספרו לנו עליכם. הבקשה עוברת בדיקה של צוות הקהילה לפני שהיא מופיעה במדריך.'),
    h('form', { className: 'am-event-form am-join-form', onSubmit: submit, noValidate: true },
      h('fieldset', { className: 'am-join-group' },
        h('legend', null, 'פרטי העסק'),
        field('businessName', 'שם העסק', { required: true, max: 80 }),
        field('category', 'תחום', { max: 60, placeholder: 'למשל: אוכל, טיפול, חוגים' }),
        field('description', 'כמה מילים על העסק', { multiline: true, max: 1000 }),
        field('address', 'כתובת (אם יש)', { max: 160 })
      ),
      h('fieldset', { className: 'am-join-group' },
        h('legend', null, 'יצירת קשר'),
        field('contactName', 'שם איש/אשת קשר', { required: true, max: 80 }),
        field('phone', 'טלפון', { type: 'tel', max: 30, dir: 'ltr' }),
        field('email', 'אימייל', { type: 'email', max: 120, dir: 'ltr' }),
        field('website', 'אתר', { type: 'url', max: 300, dir: 'ltr', placeholder: 'https://' }),
        field('instagram', 'אינסטגרם', { type: 'url', max: 300, dir: 'ltr', placeholder: 'https://instagram.com/...' }),
        field('facebook', 'פייסבוק', { type: 'url', max: 300, dir: 'ltr', placeholder: 'https://facebook.com/...' })
      ),
      h('fieldset', { className: 'am-join-group' },
        h('legend', null, 'הטבה לתושבי השכונה (לא חובה)'),
        field('couponText', 'מה ההטבה', { max: 200, placeholder: 'למשל: 10% הנחה לתושבי השכונה' }),
        h('div', { className: 'am-join-row' },
          field('couponCode', 'קוד קופון', { max: 40, dir: 'ltr' }),
          field('couponExpires', 'בתוקף עד', { type: 'date', max: 10 })
        )
      ),
      h('fieldset', { className: 'am-join-group' },
        h('legend', null, 'לוגו ותמונות'),
        h('div', { className: 'am-join-hint' }, 'PNG, JPG או WEBP, עד 1.5MB לקובץ. לוגו אחד ועד ' + JOIN_MAX_PHOTOS + ' תמונות.'),
        h('label', { className: 'am-join-file' },
          h('span', null, logo ? 'לוגו: ' + logo.name : 'בחירת לוגו'),
          h('input', { type: 'file', accept: JOIN_FILE_TYPES.join(','), onChange: pickLogo })
        ),
        logo ? h('button', { type: 'button', className: 'am-join-remove', onClick: () => setLogo(null) }, 'הסרת הלוגו') : null,
        h('label', { className: 'am-join-file' + (photos.length >= JOIN_MAX_PHOTOS ? ' is-disabled' : '') },
          h('span', null, photos.length ? 'הוספת תמונות (' + photos.length + '/' + JOIN_MAX_PHOTOS + ')' : 'בחירת תמונות'),
          h('input', { type: 'file', accept: JOIN_FILE_TYPES.join(','), multiple: true, onChange: pickPhotos, disabled: photos.length >= JOIN_MAX_PHOTOS })
        ),
        photos.length
          ? h('ul', { className: 'am-join-files' }, photos.map((p, i) => h('li', { key: i },
              h('span', null, p.name),
              h('button', { type: 'button', className: 'am-join-remove', onClick: () => setPhotos(photos.filter((_, j) => j !== i)), 'aria-label': 'הסרת ' + p.name }, 'הסרה'))))
          : null,
        fileError ? h('div', { className: 'am-event-error', role: 'alert' }, fileError) : null
      ),
      h('label', { className: 'am-join-consent' },
        h('input', { type: 'checkbox', checked: consent, onChange: (e) => setConsent(e.target.checked) }),
        h('span', null, 'אני מאשר/ת שהפרטים והחומרים שייכים לעסק ושמותר לפרסם אותם במדריך העסקים של השכונה')
      ),
      error ? h('div', { className: 'am-event-error', role: 'alert' }, error) : null,
      h('button', { type: 'submit', className: 'am-btn link am-join-submit', disabled: submitting }, submitting ? 'שולח...' : 'שליחת בקשה')
    )
  );
}

/** title / subtitle / searchPlaceholder / sourceCredit / initialBusinessId - לעמוד מטמיע (למשל /ramat-gan).
 *  allowJoin=false מסתיר את "הצטרפות לעסקים" בעמוד שאין לו מפעיל שמאשר.
 *  בלי props (מפת ארמון הנציב) - בדיוק כמו קודם. */
function BusinessDirectoryPanel({ onClose, title = 'עסקים / משאבים', subtitle = 'עסקים ונותני שירות מקומיים בשכונה',
  searchPlaceholder = 'חיפוש... למשל עורך דין, יוגה, טיפול, אוכל', sourceCredit, initialBusinessId, profileAction, allowJoin = true }) {
  const data = useFetch('/api/business-directory', []);
  const items = (data && data.items) || [];
  const [query, setQuery] = useState('');
  const [activeCategory, setActiveCategory] = useState(null);
  const [activeBusiness, setActiveBusiness] = useState(null);
  const [joining, setJoining] = useState(false);
  // פתיחה ישירה על כרטיס עסק (מנקודה במפה) - פעם אחת, כשהרשימה נטענה
  useEffect(() => {
    if (initialBusinessId && data && data.items) setActiveBusiness(data.items.find((it) => it.id === initialBusinessId) || null);
  }, [initialBusinessId, data]);

  // קטגוריות נגזרות מהדאטה בפועל שחזרה מה-API - לא רשימה גדולה שהומצאה מראש.
  const categories = Array.from(new Set(items.map((it) => it.category).filter(Boolean))).sort();

  const q = query.trim().toLowerCase();
  const filtered = items.filter((it) => {
    if (activeCategory && it.category !== activeCategory) return false;
    if (!q) return true;
    return (it.name || '').toLowerCase().includes(q) ||
      (it.description || '').toLowerCase().includes(q) ||
      (it.category || '').toLowerCase().includes(q) ||
      (it.address || '').toLowerCase().includes(q);
  });

  return h('div', { className: 'am-scrim am-creators-scrim', onClick: onClose },
    h('div', { className: 'am-creators-panel am-directory-panel', onClick: (e) => e.stopPropagation() },
      h('button', { className: 'close-btn', onClick: onClose, 'aria-label': 'סגור' }, '✕'),
      joining
        ? h(BusinessJoinAction, { onBack: () => setJoining(false) })
        : activeBusiness
        ? h(BusinessProfileAction, { business: activeBusiness, onBack: () => setActiveBusiness(null), credit: sourceCredit, extraAction: profileAction })
        : h(React.Fragment, null,
            h('div', { className: 'am-creators-title' }, title),
            h('div', { className: 'am-creators-sub' }, subtitle),
            allowJoin ? h('button', { type: 'button', className: 'am-business-join-cta', onClick: () => setJoining(true) },
              h('span', { className: 'am-business-join-cta-title' }, '+ הצטרפות לעסקים'),
              h('span', { className: 'am-business-join-cta-sub' }, 'יש לכם עסק בשכונה? הצטרפו למדריך')) : null,
            h('input', {
              className: 'am-directory-search', type: 'text',
              placeholder: searchPlaceholder,
              value: query, onChange: (e) => setQuery(e.target.value), 'aria-label': 'חיפוש עסקים',
            }),
            categories.length
              ? h('div', { className: 'am-business-filters' },
                  h('button', {
                    className: 'am-business-filter-chip' + (activeCategory === null ? ' is-active' : ''),
                    onClick: () => setActiveCategory(null),
                  }, 'הכל'),
                  categories.map((cat) =>
                    h('button', {
                      key: cat, className: 'am-business-filter-chip' + (activeCategory === cat ? ' is-active' : ''),
                      onClick: () => setActiveCategory((cur) => (cur === cat ? null : cat)),
                    }, cat)
                  )
                )
              : null,
            // כשחיפוש או קטגוריה מסננים את הרשימה - אומרים את זה במפורש, עם דרך אחת לחזור לכל העסקים
            data && items.length && (q || activeCategory)
              ? h('div', { className: 'am-business-filter-status', role: 'status', 'aria-live': 'polite' },
                  h('span', null,
                    (filtered.length === 1 ? 'נמצא עסק אחד' : 'נמצאו ' + filtered.length + ' עסקים') +
                    (q ? ' עבור "' + query.trim() + '"' : '') +
                    (activeCategory ? ' בקטגוריה ' + activeCategory : '') +
                    ' מתוך ' + items.length),
                  h('button', {
                    type: 'button', className: 'am-business-filter-clear',
                    onClick: () => { setQuery(''); setActiveCategory(null); },
                  }, q ? 'ניקוי חיפוש' : 'הצגת הכל'))
              : null,
            !data
              ? h('div', { className: 'am-directory-empty' }, 'טוען...')
              : filtered.length === 0
              ? h('div', { className: 'am-directory-empty' }, items.length === 0 ? 'כרגע אין כאן עסקים פעילים' : 'לא נמצאו עסקים תואמים')
              : h('div', { className: 'am-directory-list' },
                  filtered.map((it) =>
                    h('button', {
                      key: it.id, className: 'am-directory-item am-directory-item-block am-business-item',
                      onClick: () => setActiveBusiness(it),
                    },
                      h('div', { className: 'am-directory-item-main' },
                        h('div', { className: 'am-directory-item-name' }, it.name || 'עסק לא מזוהה'),
                        it.category ? h('div', { className: 'am-directory-item-type' }, it.category) : null,
                        BUSINESS_DATA_STATUS_LABEL[it.dataStatus] ? h('div', { className: 'am-business-status-note' }, BUSINESS_DATA_STATUS_LABEL[it.dataStatus]) : null,
                        h(BusinessCoupon, { business: it, compact: true })
                      )
                    )
                  )
                )
          )
    )
  );
}

/* ===================== מה קורה עכשיו (Events) =====================
   שימוש ב-API הקיים בלבד (/api/events, /api/events/:id/register ב-server.ts,
   שכבר קיים ומיושם במלואו ב-lib/events.ts - כולל createRegistration).
   שום endpoint/workflow חדש לא נוסף כאן - רק חיבור UI לתשתית קיימת. */

function formatEventDate(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' }) +
    ' · ' + d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
}

/** "אני מצטרף/ת" - טופס הרשמה אמיתי מול /api/events/:id/register הקיים
 *  (createRegistration ב-lib/events.ts) - לא סימולציה, לא alert. */
function EventRegisterAction({ event, onBack }) {
  const [name, setName] = useState('');
  const [contactMethod, setContactMethod] = useState('phone');
  const [contactValue, setContactValue] = useState('');
  const [consentEvent, setConsentEvent] = useState(true);
  const [consentCommunity, setConsentCommunity] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [error, setError] = useState(null);
  const dateLabel = formatEventDate(event.startAt);

  function submit(e) {
    e.preventDefault();
    if (!name.trim() || !contactValue.trim()) return;
    setSubmitting(true);
    setError(null);
    fetch('/api/events/' + event.id + '/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        participantName: name.trim(),
        contactMethod,
        contactValue: contactValue.trim(),
        consentToEventUpdates: consentEvent,
        consentToCommunityUpdates: consentCommunity,
      }),
    })
      .then((r) => { if (!r.ok) throw new Error('register failed'); return r.json(); })
      .then(() => setSubmitted(true))
      .catch(() => setError('ההרשמה לא הצליחה, נסו שוב'))
      .finally(() => setSubmitting(false));
  }

  return h('div', { className: 'am-creators-detail' },
    h('button', { className: 'am-creators-back', onClick: onBack }, '‹ חזרה'),
    h('div', { className: 'am-creators-title' }, event.title),
    dateLabel ? h('div', { className: 'am-directory-item-type' }, dateLabel) : null,
    event.location ? h('div', { className: 'am-directory-item-type' }, event.location) : null,
    event.description ? h('p', { className: 'am-creators-sub', style: { textAlign: 'right' } }, decodeHtmlEntities(event.description)) : null,
    submitted
      ? h('div', { className: 'am-directory-empty' }, 'נרשמת בהצלחה! נתראה שם 🎉')
      : h('form', { className: 'am-event-form', onSubmit: submit },
          h('input', {
            className: 'am-directory-search', type: 'text', placeholder: 'שם מלא', value: name,
            onChange: (e) => setName(e.target.value), required: true, 'aria-label': 'שם מלא',
          }),
          h('select', {
            className: 'am-directory-search', value: contactMethod,
            onChange: (e) => setContactMethod(e.target.value), 'aria-label': 'אמצעי התקשרות',
          },
            h('option', { value: 'phone' }, 'טלפון'),
            h('option', { value: 'whatsapp' }, 'וואטסאפ'),
            h('option', { value: 'email' }, 'אימייל')
          ),
          h('input', {
            className: 'am-directory-search', type: 'text', placeholder: 'פרטי התקשרות', value: contactValue,
            onChange: (e) => setContactValue(e.target.value), required: true, 'aria-label': 'פרטי התקשרות',
          }),
          error ? h('div', { className: 'am-event-error' }, error) : null,
          h('button', { type: 'submit', className: 'am-btn link', disabled: submitting }, submitting ? 'שולח...' : 'אני מצטרף/ת')
        )
  );
}

/* ===================== מה קורה עכשיו (Now layer) =====================
   השכבה החיה של הקהילה: היום / בקרוב / שימושי, מ-/api/now (lib/nowLayer.ts).
   אירועים מפורסמים מטבלת events נכנסים לאותו פיד (וההרשמה אליהם נשארת
   EventRegisterAction הקיים); תוכן הדגמה מסומן תמיד "דוגמה" ולא מוצג כמאומת.
   הרכיב לא מכיר את ארמון הנציב - רק את הפיד של ה-workspace. */

const NOW_TABS = [
  { key: 'today', label: 'היום' },
  { key: 'upcoming', label: 'בקרוב' },
  { key: 'useful', label: 'שימושי' },
];

function nowTimeLabel(item) {
  if (!item.startTime) return null;
  return item.endTime ? item.startTime + '–' + item.endTime : item.startTime;
}

function nowDateLabel(item, today) {
  if (!item.date) return null;
  if (item.date === today) return 'היום';
  const d = new Date(item.date + 'T12:00:00');
  return isNaN(d.getTime()) ? item.date : d.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'numeric' });
}

/** שורת מטא (תאריך · שעה · מקום). השעה עטופה ב-bdi dir=ltr כדי ש"17:00–19:00"
 *  לא יתהפך בהקשר RTL. */
function NowMeta({ parts }) {
  const nodes = [];
  parts.forEach((p) => {
    if (!p) return;
    if (nodes.length) nodes.push(' · ');
    nodes.push(p.ltr ? h('bdi', { key: nodes.length, dir: 'ltr' }, p.text) : p.text);
  });
  return nodes.length ? h('div', { className: 'am-directory-item-type' }, nodes) : null;
}

function NowDemoBadge({ item }) {
  return item.provenance && item.provenance.kind === 'demo'
    ? h('span', { className: 'am-now-badge', title: item.provenance.note }, 'דוגמה')
    : null;
}

function NowItemDetail({ item, today, onBack }) {
  // אירוע אמיתי מטבלת events - מסך ההרשמה הקיים, ללא שינוי
  if (item.provenance && item.provenance.kind === 'events_table') {
    return h(EventRegisterAction, {
      event: { id: item.provenance.eventId, title: item.title, startAt: item.startAt, location: item.locationLabel, description: item.description },
      onBack,
    });
  }
  return h('div', { className: 'am-creators-detail am-now-detail' },
    h('button', { className: 'am-creators-back', onClick: onBack }, '‹ חזרה'),
    h('div', { className: 'am-creators-title' }, item.title, ' ', h(NowDemoBadge, { item })),
    h(NowMeta, { parts: [nowDateLabel(item, today) && { text: nowDateLabel(item, today) }, nowTimeLabel(item) && { text: nowTimeLabel(item), ltr: true }, item.locationLabel && { text: item.locationLabel }] }),
    item.description ? h('p', { className: 'am-creators-sub', style: { textAlign: 'right' } }, item.description) : null,
    item.url ? h('a', { className: 'am-btn link', href: item.url, target: '_blank', rel: 'noreferrer' }, 'לפרטים ↗') : null,
    item.provenance && !item.provenance.verified ? h('div', { className: 'am-now-note' }, item.provenance.note) : null
  );
}

function NowPanel({ data, initialTab, initialItemId, onClose, onFocusItem, onShare }) {
  const [tab, setTab] = useState(initialTab || 'today');
  const [activeId, setActiveId] = useState(initialItemId || null);
  useEffect(() => { setTab(initialTab || 'today'); setActiveId(initialItemId || null); }, [initialTab, initialItemId]);
  const items = data && data.tabs ? data.tabs[tab] || [] : [];
  const all = data && data.tabs ? [...data.tabs.today, ...data.tabs.upcoming, ...data.tabs.useful] : [];
  const active = activeId ? all.find((i) => i.id === activeId) : null;
  const hasDemo = items.some((i) => i.provenance && i.provenance.kind === 'demo');
  // המפה מסמנת רק את הפריט שנבחר (אם יש לו מיקום) - לא את כל פריטי היום
  useEffect(() => { if (onFocusItem) onFocusItem(active && active.mapPosition ? active : null); }, [active && active.id]);
  // בדסקטופ החלון זז לצד הנגדי לנקודה, כדי שלא יסתיר אותה
  const side = active && active.mapPosition ? (active.mapPosition.mapX >= 50 ? ' am-scrim--panel-left' : ' am-scrim--panel-right') : '';

  return h('div', { className: 'am-scrim am-creators-scrim' + side, onClick: onClose },
    h('div', { className: 'am-creators-panel am-directory-panel am-now-panel', role: 'dialog', 'aria-label': 'מה קורה עכשיו', onClick: (e) => e.stopPropagation() },
      h('button', { className: 'close-btn', onClick: onClose, 'aria-label': 'סגור' }, '✕'),
      active
        ? h(NowItemDetail, { item: active, today: data.today, onBack: () => setActiveId(null) })
        : h(React.Fragment, null,
            h('div', { className: 'am-creators-title' }, 'מה קורה עכשיו'),
            h('div', { className: 'am-now-tabs', role: 'tablist' },
              NOW_TABS.map((t) => h('button', {
                key: t.key, role: 'tab', 'aria-selected': tab === t.key,
                className: 'am-business-filter-chip' + (tab === t.key ? ' is-active' : ''),
                onClick: () => setTab(t.key),
              }, t.label))
            ),
            !data
              ? h('div', { className: 'am-directory-empty' }, 'טוען...')
              : data.error
              ? h('div', { className: 'am-directory-empty' }, 'המידע אינו זמין כרגע')
              : items.length === 0
              ? h('div', { className: 'am-directory-empty' }, 'אין כרגע פריטים')
              : h('div', { className: 'am-directory-list', role: 'tabpanel' },
                  items.map((it) => {
                    const body = h('div', { className: 'am-directory-item-main' },
                      h('div', { className: 'am-directory-item-name' }, it.title, ' ', h(NowDemoBadge, { item: it })),
                      h(NowMeta, { parts: [tab === 'upcoming' && { text: nowDateLabel(it, data.today) }, nowTimeLabel(it) && { text: nowTimeLabel(it), ltr: true }, it.locationLabel && { text: it.locationLabel }] }),
                      tab === 'useful' && it.description ? h('div', { className: 'am-directory-item-desc' }, it.description) : null
                    );
                    // "שימושי" בלי קישור אמיתי - שורת מידע בלבד, לא כפתור מזויף
                    return tab === 'useful' && !it.url
                      ? h('div', { key: it.id, className: 'am-directory-item am-directory-item-block', 'data-now-item': it.id }, body)
                      : h('button', { key: it.id, className: 'am-directory-item am-directory-item-block am-event-item', 'data-now-item': it.id, onClick: () => setActiveId(it.id) }, body);
                  })
                ),
            hasDemo ? h('div', { className: 'am-now-note' }, 'פריטים המסומנים "דוגמה" הם תוכן הדגמה - לא מאומת') : null,
            // שיתוף מתושבים: הצעה לזמן מוגבל (אוכל, מסירה, הטבה), אירוע ושאר הדרכים
            onShare ? h('button', { type: 'button', className: 'am-now-share', 'data-action': 'now-share', onClick: onShare },
              h('span', { className: 'am-now-share-plus', 'aria-hidden': 'true' }, '+'),
              h('span', null, h('span', { className: 'am-now-share-title' }, 'יש לי משהו לשתף'),
                h('span', { className: 'am-now-share-sub' }, 'אוכל שנשאר, משהו למסירה, הטבה או אירוע'))) : null,
            // קישור שקט לעמוד "מה קורה בקהילה" (/community) - לא פריט ולא כפתור של הרשימה
            h('a', { className: 'am-now-community', href: '/community' }, 'לכל מה שקורה בקהילה ←')
          )
    )
  );
}

/** סמן לפריט שנבחר בחלון "מה קורה עכשיו" - HTML בלבד, מעל ה-Master Visual (שלא
 *  משתנה). מוצג רק כל עוד הפריט פתוח בחלון; נסגר החלון - הסמן נעלם. */
function NowMarker({ item }) {
  return h('div', {
    className: 'am-now-marker is-focus',
    style: { left: stageX(item.mapPosition.mapX) + '%', top: stageY(item.mapPosition.mapY) + '%' },
    'aria-hidden': 'true',
    'data-now-item': item.id,
  },
    h('span', { className: 'am-now-marker-dot', 'aria-hidden': 'true' }),
    h('span', { className: 'am-now-marker-label', 'aria-hidden': 'true' }, item.title)
  );
}

/* ===================== Rich Place Panel =====================
   חלון-מקום עשיר לשלושת המקומות שבתצורת השרת (app/lib/richPlaces.ts, דרך
   /api/rich-places/:id). משתמש באותה שפת חלון כמו EntityCard (am-scrim /
   am-card / close-btn / am-card-title / am-btn) ובאותה מדיה של הישות. היררכיה:
   כותרת → חזותי גדול (אתר רשמי מוטמע אם האתר מתיר, אחרת מדיה/אייקון) →
   מידע קצר → פעולות. האתר הרשמי נפתח בלשונית חדשה - כפעולה ראשית כשהתצורה
   מבקשת (officialPrimary), אחרת כפעולה משנית. */
function RichPlacePanel({ entityId, onClose, onOpenBusinessDirectory }) {
  const place = useFetch('/api/rich-places/' + entityId, [entityId]);
  const hasEmbed = !!(place && place.hasEmbedCandidate);
  const embed = useFetch(hasEmbed ? '/api/rich-places/' + entityId + '/embed' : null, [entityId, hasEmbed]);
  const [activeImage, setActiveImage] = useState(0);
  const [failedImages, setFailedImages] = useState({});

  if (!place || place.error) {
    return h('div', { className: 'am-scrim', onClick: onClose },
      h('div', { className: 'am-card am-rich', onClick: (e) => e.stopPropagation() },
        h('button', { className: 'close-btn', onClick: onClose, 'aria-label': 'סגור' }, '✕'),
        h('div', { className: 'am-card-body no-hero' }, place && place.error ? 'המידע על המקום אינו זמין כרגע' : 'טוען...')
      )
    );
  }

  const media = (place.media || []).filter((m) => m.url);
  const videos = media.filter((m) => m.type === 'YOUTUBE' || m.type === 'VIDEO');
  const images = media.filter((m) => m.type === 'IMAGE' && !failedImages[m.url]);
  const lockedIcon = LOCKED_ICON_ASSET_BY_TITLE[place.title];
  const showEmbed = !!(embed && embed.embeddable && embed.url);
  const current = images[Math.min(activeImage, Math.max(images.length - 1, 0))];
  const markFailed = (url) => setFailedImages((f) => (f[url] ? f : { ...f, [url]: true }));

  let visual = null;
  if (showEmbed) {
    visual = h('div', { className: 'am-rich-visual am-rich-visual--embed' },
      h('iframe', {
        className: 'am-rich-embed', src: embed.url, title: place.title || 'האתר הרשמי',
        sandbox: 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox',
      })
    );
  } else if (videos.length) {
    visual = h('div', { className: 'am-rich-visual' }, h(VideoGallery, { videos }));
  } else if (current) {
    visual = h('div', { className: 'am-rich-visual am-rich-visual--gallery' },
      h('img', { className: 'am-rich-main-image', src: current.url, referrerPolicy: 'no-referrer', alt: place.title || '', onError: () => markFailed(current.url) }),
      images.length > 1
        ? h('div', { className: 'am-rich-thumbs' },
            images.map((m, i) => h('button', {
              key: m.url, className: 'am-rich-thumb' + (m === current ? ' is-active' : ''),
              onClick: () => setActiveImage(i), 'aria-label': 'תמונה ' + (i + 1),
            }, h('img', { src: m.url, alt: '', referrerPolicy: 'no-referrer', onError: () => markFailed(m.url) })))
          )
        : null
    );
  } else if (lockedIcon && place.showIcon) {
    visual = h('div', { className: 'am-rich-visual am-rich-visual--icon' }, h('img', { src: lockedIcon, alt: '' }));
  }

  const related = place.related && place.related.businessDirectory;
  const hasActions = !!place.directionsUrl || !!related || !!place.officialUrl || !!place.sourceLink;
  // האתר הרשמי: פעולה ראשית (כפתור מלא, ראשון) כשהתצורה מבקשת, אחרת משנית
  const officialAction = place.officialUrl
    ? h('a', {
        className: 'am-btn ' + (place.officialPrimary ? 'link am-rich-official' : 'secondary'),
        href: place.officialUrl, target: '_blank', rel: 'noreferrer',
      }, (place.officialActionLabel || 'פתח באתר הרשמי') + ' ↗')
    : null;

  // מצב "אתר": האתר הרשמי מתיר הטמעה - החלון הופך לחלון אל האתר האמיתי. מחוץ
  // ל-iframe רק כותרת, סגירה, וכפתור משני לפתיחה בלשונית חדשה.
  if (showEmbed) {
    return h('div', { className: 'am-scrim', onClick: onClose },
      h('div', { className: 'am-card am-rich am-rich--site', role: 'dialog', 'aria-label': place.title || '', onClick: (e) => e.stopPropagation() },
        h('button', { className: 'close-btn', onClick: onClose, 'aria-label': 'סגור' }, '✕'),
        h('div', { className: 'am-rich-head' }, h('h2', { className: 'am-card-title' }, place.title || '')),
        visual,
        place.officialUrl
          ? h('div', { className: 'am-rich-site-bar' },
              h('a', { className: 'am-btn secondary', href: place.officialUrl, target: '_blank', rel: 'noreferrer' }, 'פתח באתר הרשמי ↗'))
          : null
      )
    );
  }

  return h('div', { className: 'am-scrim', onClick: onClose },
    h('div', { className: 'am-card am-rich', role: 'dialog', 'aria-label': place.title || '', onClick: (e) => e.stopPropagation() },
      h('button', { className: 'close-btn', onClick: onClose, 'aria-label': 'סגור' }, '✕'),
      h('div', { className: 'am-rich-head' },
        place.eyebrow ? h('div', { className: 'am-rich-eyebrow' }, place.eyebrow) : null,
        h('h2', { className: 'am-card-title' }, place.title || '')
      ),
      visual,
      h('div', { className: 'am-rich-info' },
        place.heading ? h('h3', { className: 'am-rich-heading' }, place.heading) : null,
        place.credit ? h('div', { className: 'am-rich-credit' }, place.credit) : null,
        place.paragraphs.map((t, i) => h('p', { key: i, className: 'am-rich-text' }, t)),
        !place.paragraphs.length && place.fallbackNote ? h('p', { className: 'am-rich-text' }, place.fallbackNote) : null,
        hasActions
          ? h('div', { className: 'am-actions' },
              place.officialPrimary ? officialAction : null,
              place.directionsUrl ? h('a', { className: 'am-btn link', href: place.directionsUrl, target: '_blank', rel: 'noreferrer' }, 'הוראות הגעה ↗') : null,
              related ? h('button', { className: 'am-btn link', onClick: onOpenBusinessDirectory }, related.label) : null,
              place.officialPrimary ? null : officialAction,
              place.sourceLink ? h('a', { className: 'am-btn secondary', href: place.sourceLink.url, target: '_blank', rel: 'noreferrer' }, place.sourceLink.label + ' ↗') : null
            )
          : null,
        h('div', { className: 'am-card-credit' },
          'Genially source: ' + (place.source.slideId || '-').slice(0, 8) + ' / ' + (place.source.elementId || '-').slice(0, 8) +
          (place.officialUrlSource ? ' · ' + place.officialUrlSource : ''))
      )
    )
  );
}

/* ===================== גיבורים וגיבורות השכונה =====================
   אוסף חי של אנשים מעוררי השראה בשכונה (מקור: Genially "אנשי ההשראה שלנו",
   דרך /api/neighborhood-heroes). הקומפוננטה מרנדרת רק מרשומות הפרופיל - הוספת
   אדם היא הוספת רשומה לנתונים, לא שינוי כאן. כל שדה מוצג רק אם קיים במקור:
   בלי תמונה - ראשי-תיבות של השם (עיצוב בלבד, לא תוכן). */
const HEROES_TITLE = 'גיבורים וגיבורות השכונה';

function heroInitials(name) {
  return name.replace(/["'׳״]/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('');
}

const HERO_SOURCE_KIND_LABELS = { neighborhood_source: 'מקור שכונתי', official: 'מקור רשמי', public: 'מקור ציבורי' };

function HeroCard({ profile, index, expanded, onToggle }) {
  const sources = profile.sources || [];
  const videos = profile.videos || (profile.video ? [{ url: profile.video }] : []);
  const hasMore = !!(profile.story || videos.length || sources.length);
  const moreLabel = videos.length ? 'לסיפור ולסרטון' : profile.story ? 'לסיפור המלא' : 'מקורות';
  const credit = profile.imageCredit;
  const showImage = !!(profile.image && credit);
  // כרטיס ייצוגי (ShowcaseFigure): תמונה גדולה במרכז, ומתחתיה שם, תפקיד ושתי שורות מהסיפור.
  return h('article', { className: 'am-showcase-card am-hero-card' + (expanded ? ' is-expanded' : ''), 'data-profile-id': profile.id },
    h(ShowcaseFigure, {
      image: showImage ? profile.image : null, alt: profile.name, credit, fallbackText: heroInitials(profile.name),
      tone: index, aspect: 'portrait', showCredit: !expanded, className: 'am-hero-figure',
    }),
    h('div', { className: 'am-hero-body' },
    h('h3', { className: 'am-hero-name' }, profile.name),
    profile.role ? h('div', { className: 'am-hero-role' }, profile.role) : null,
    profile.story ? h('p', { className: 'am-hero-story' }, profile.story) : null,
    expanded && videos.length
      ? h('div', { className: 'am-hero-video' }, h(VideoGallery, { videos }))
      : null,
    expanded && sources.length
      ? h('ul', { className: 'am-hero-sources', 'aria-label': 'מקורות' },
          sources.map((src, i) => h('li', { key: i },
            h('span', { className: 'am-hero-source-kind' }, HERO_SOURCE_KIND_LABELS[src.kind] || ''),
            src.url ? h('a', { href: src.url, target: '_blank', rel: 'noreferrer' }, src.label + ' ↗') : h('span', null, src.label)
          )))
      : null,
    expanded && showImage
      ? h('div', { className: 'am-hero-credit' }, 'תמונה: ',
          credit.url ? h('a', { href: credit.url, target: '_blank', rel: 'noreferrer' }, credit.label + ' ↗') : credit.label,
          credit.license ? [' · רישיון ', credit.license.url
            ? h('a', { key: 'l', href: credit.license.url, target: '_blank', rel: 'noreferrer license' }, credit.license.label + ' ↗')
            : credit.license.label] : null,
          credit.changes ? ' · ' + credit.changes : null)
      : null,
    hasMore || profile.link
      ? h('div', { className: 'am-hero-actions' },
          hasMore ? h('button', { className: 'am-btn secondary', onClick: onToggle, 'aria-expanded': expanded }, expanded ? 'סגירה' : moreLabel) : null,
          expanded && profile.link ? h('a', { className: 'am-btn link', href: profile.link.url, target: '_blank', rel: 'noreferrer' }, profile.link.label + ' ↗') : null
        )
      : null
    )
  );
}

function NeighborhoodHeroesPanel({ data, onClose }) {
  const [expandedId, setExpandedId] = useState(null);
  const profiles = (data && data.profiles) || [];
  return h('div', { className: 'am-scrim', onClick: onClose },
    h('div', { className: 'am-card am-heroes', role: 'dialog', 'aria-label': HEROES_TITLE, onClick: (e) => e.stopPropagation() },
      h('button', { className: 'close-btn', onClick: onClose, 'aria-label': 'סגור' }, '✕'),
      h('header', { className: 'am-heroes-head' },
        h('h2', { className: 'am-card-title am-heroes-title' }, HEROES_TITLE),
        data && data.sourceContext
          ? h('div', { className: 'am-heroes-source' },
              'מתוך ',
              data.source && data.source.url
                ? h('a', { href: data.source.url, target: '_blank', rel: 'noreferrer' }, '"' + data.sourceContext + '" ↗')
                : '"' + data.sourceContext + '"')
          : null,
        h('div', { className: 'am-heroes-count' }, profiles.length ? 'אוסף מתעדכן · ' + profiles.length + ' באוסף כרגע' : 'אוסף מתעדכן')
      ),
      !data
        ? h('div', { className: 'am-directory-empty' }, 'טוען...')
        : h('div', { className: 'am-heroes-grid' },
            profiles.map((p, i) => h(HeroCard, {
              key: p.id, profile: p, index: i, expanded: expandedId === p.id,
              onToggle: () => setExpandedId((cur) => (cur === p.id ? null : p.id)),
            }))
          )
    )
  );
}

/* ===================== סמן של פריט-משנה בשכבה =====================
   הסמן הוא ייצוג של אותה רשומת סיפור/קהילה (לא רשומה נפרדת). לרשומה עם אייקון
   מקור מאושר - האייקון עצמו הוא הסמן והיעד הלחיץ (כקובץ שסופק, רק בגודל
   ומיקום). לרשומה בלי אייקון - "נגיעת עט" אדומה זעירה. במעבר עכבר מוצגת תווית
   קטנה עם שם הסיפור; במגע - הקשה פותחת את הכרטיס (השם ב-aria-label). */
function SecondaryMarker({ point, active, collection, onOpen }) {
  const off = point.iconOffset || {};
  const size = point.iconSize || 5.5;
  return h('button', {
    className: 'am-secondary' + (point.icon ? ' has-icon' : ' is-dot') + (active ? ' is-active' : ''),
    style: {
      left: stageX(point.display.mapX) + '%', top: stageY(point.display.mapY) + '%',
      '--icon-dx': (off.dx || 0) + 'cqw', '--icon-dy': (off.dy || 0) + 'cqw',
      '--icon-w': size + 'cqw', '--icon-min': Math.round(size * 5.4) + 'px', '--icon-max': Math.round(size * 9) + 'px',
    },
    onClick: onOpen,
    'aria-label': point.title,
    'data-layer': point.layer,
    'data-collection': collection || undefined,
  },
    point.icon
      ? h('img', { className: 'am-secondary-icon', src: point.icon, alt: '', draggable: false })
      : h('span', { className: 'am-secondary-dot', 'aria-hidden': 'true' }),
    h('span', { className: 'am-secondary-label', 'aria-hidden': 'true' }, point.title)
  );
}

/* ===================== "יש לי משהו לשתף" =====================
   כניסה אחת לשיתוף מתושבים. כל אפשרות נשלחת לנתיב הקיים של שכבת הקהילה
   (/api/proposals, /api/initiatives, /api/events, /api/reports) - כמו SHARE_INTENTS
   ב-lib/communityModel.ts. מדיניות האישור נאכפת בשרת: רעיון, יוזמה ואירוע של
   תושב ממתינים לאישור מפעיל; דיווח פרטי לשולח ולמפעיל. המסך רק מסביר את זה.
   זהות: שם תצוגה בלבד, ורק כשצריך. המפתח שהשרת מנפיק נשמר בדפדפן (localStorage). */

const SHARE_KEY_STORAGE = 'osimKehila.residentKey';
let shareKeyFallback = null; // דפדפן שחוסם אחסון: המפתח נשמר רק עד סגירת הדף
function loadShareKey() {
  try { return window.localStorage.getItem(SHARE_KEY_STORAGE) || shareKeyFallback; } catch (e) { return shareKeyFallback; }
}
function saveShareKey(key) {
  shareKeyFallback = key;
  try { if (key) window.localStorage.setItem(SHARE_KEY_STORAGE, key); else window.localStorage.removeItem(SHARE_KEY_STORAGE); return true; } catch (e) { return false; }
}

const SHARE_OPTIONS = [

  { id: 'partners', label: 'אני מחפש שותפים', sub: 'למשהו שרוצים לעשות יחד', path: '/api/proposals', status: 'submitted_seeking_partners', moderated: true,
    fields: [{ ...SHARE_TITLE, placeholder: 'למשל: קבוצת הליכה בבוקר' }, { key: 'description', label: 'במה תשמחו לעזרה?', area: true, max: 2000 }] },
  { id: 'initiative', label: 'אני רוצה ליזום', sub: 'יוזמה שאתם מתכוונים להוביל', path: '/api/initiatives', status: 'pending', moderated: true,
    fields: [{ ...SHARE_TITLE, placeholder: 'למשל: ספריית רחוב' }, { key: 'description', label: 'מה תרצו לעשות?', area: true, max: 2000 }] },
  { id: 'event', label: 'אני רוצה לפרסם אירוע', sub: 'מפגש, פעילות או חגיגה', path: '/api/events', status: 'pending', moderated: true,
    fields: [{ ...SHARE_TITLE, placeholder: 'למשל: ערב שירה בגינה' }, { key: 'startAt', label: 'מתי?', type: 'datetime-local', required: true },
      { key: 'location', label: 'איפה?', max: 200 }, { key: 'description', label: 'פרטים', area: true, max: 2000 }] },
  { id: 'new_info', label: 'יש לי מידע חדש', sub: 'מקום, שירות או משהו שכדאי לדעת', path: '/api/reports', kind: 'new_info',
    fields: [{ key: 'body', label: 'מה חשוב לדעת?', area: true, required: true, max: 2000 }] },
  { id: 'wrong_info', label: 'מצאתי מידע לא נכון', sub: 'מה לא נכון, ואיפה', path: '/api/reports', kind: 'wrong_info',
    fields: [{ key: 'place', label: 'על איזה מקום? (לא חובה)', type: 'place' },
      { key: 'body', label: 'מה לא נכון, ואיפה?', area: true, required: true, max: 2000, placeholder: 'למשל: בכרטיס של הספרייה כתוב שהיא פתוחה בשישי' }] },
  { id: 'resource', label: 'יש לי משאב להציע', sub: 'ציוד, מקום, זמן או ידע', path: '/api/reports', kind: 'resource_offer',
    fields: [{ key: 'body', label: 'מה תרצו להציע?', area: true, required: true, max: 2000 }] },
  { id: 'operator', label: 'יש לי פנייה למפעיל הקהילה', sub: 'שאלה, בקשה או הערה', path: '/api/reports', kind: 'operator_message',
    fields: [{ key: 'body', label: 'מה תרצו לכתוב?', area: true, required: true, max: 2000 }] },
];

/** "יש לי משהו להציע עכשיו": אוכל שנשאר, חפץ למסירה, הטבה לזמן מוגבל. עובר בנתיב
 *  הקיים של משאב להציע (reports, resource_offer) - נשלח לרכזת הקהילה ולא מתפרסם
 *  אוטומטית. שדות append מצורפים לטקסט הפנייה ("עד מתי: ..."). */
const SHARE_OFFER_NOW = { id: 'offer_now', label: 'יש לי משהו להציע עכשיו', sub: 'אוכל שנשאר, חפץ למסירה, הטבה לזמן מוגבל', path: '/api/reports', kind: 'resource_offer',
  bodyPrefix: '[הצעה לזמן מוגבל] ', note: 'זה נשלח לרכזת הקהילה ולא מתפרסם אוטומטית. בלי טלפון ובלי מייל: מי שירצה יפנה דרך הרכזת.',
  fields: [{ key: 'body', label: 'מה מציעים?', area: true, required: true, max: 1700, placeholder: 'למשל: נשארו מאפים מהיום, אפשר לאסוף' },
    { key: 'until', label: 'עד מתי? (לא חובה)', max: 80, placeholder: 'למשל: היום עד 19:00', append: true },
    { key: 'where', label: 'איפה? (לא חובה)', max: 120, placeholder: 'למשל: ליד המרכז המסחרי', append: true }] };
/** כפתור "יש לי משהו לשתף" בחלון "מה קורה עכשיו": קודם הדברים של עכשיו (הצעה לזמן
 *  מוגבל, אירוע), אחר-כך שאר דרכי השיתוף הקיימות */
const NOW_SHARE_OPTIONS = [SHARE_OFFER_NOW].concat(['event', 'resource', 'partners', 'initiative', 'idea', 'new_info', 'wrong_info', 'operator'].map((id) => SHARE_OPTIONS.find((o) => o.id === id)));

/** סטטוסים של "ממתין לאישור" (או טיוטה) - מה שהשרת מחזיר לתושב שאינו מפעיל */
const SHARE_WAITING = ['submitted', 'submitted_seeking_partners', 'pending', 'draft'];

function shareBody(opt, values) {
  const v = (k) => (values[k] || '').trim();
  if (opt.kind) {
    // bodyPrefix: אפשרות של עמוד מטמיע שעוברת דרך אותו מנגנון (למשל "הצעת מקום" ברמת גן)
    const extra = opt.fields.filter((f) => f.append && v(f.key)).map((f) => '\n' + f.label.replace(/ \(לא חובה\)$/, '').replace(/\?$/, '') + ': ' + v(f.key)).join('');
    const out = { kind: opt.kind, body: (opt.bodyPrefix || '') + v('body') + extra };
    if (v('place')) { out.targetType = 'entity'; out.targetId = v('place'); }
    return out;
  }
  const out = { title: v('title'), status: opt.status };
  for (const k of ['description', 'location']) if (v(k)) out[k] = v(k);
  // datetime-local הוא זמן מקומי בלי אזור זמן - שולחים רגע מוחלט (ISO), לא תלוי בשעון השרת
  if (v('startAt') && !Number.isNaN(Date.parse(v('startAt')))) out.startAt = new Date(v('startAt')).toISOString();
  return out;
}

/** הודעת שגיאה בעברית פשוטה לפי תשובת השרת */
function shareErrorText(status, code) {
  if (status === 0) return 'אין חיבור כרגע. בדקו את החיבור ונסו שוב.';
  if (status === 429) return 'נשלחו הרבה שיתופים בזמן קצר. נסו שוב בעוד כמה דקות.';
  if (code === 'account_suspended') return 'אי אפשר לשתף מהחשבון הזה כרגע. אפשר לפנות למפעיל הקהילה.';
  if (code === 'community_layer_not_migrated' || code === 'moderation_unavailable') return 'השיתוף עדיין לא פתוח באתר. נסו שוב בהמשך.';
  if (code === 'target_not_found') return 'לא מצאנו את המקום שבחרתם. אפשר לשלוח בלי לבחור מקום.';
  if (code === 'neighborhood_proposals_not_migrated') return 'הצעות התושבים עדיין לא פתוחות באתר. נסו שוב בהמשך.';
  if (code === 'contact_details_not_allowed') return 'נא לא לכתוב טלפון או מייל. פרטי קשר לא נאספים כאן.';
  if (code === 'too_many_pending') return 'יש לכם כבר 5 הצעות שמחכות לאישור. אפשר לשלוח עוד אחרי שהרכזת תעבור עליהן.';
  if (status === 400 || status === 413) return 'חלק מהפרטים לא תקינים או ארוכים מדי. בדקו ונסו שוב.';
  return 'משהו השתבש בשליחה. נסו שוב בעוד רגע.';
}

async function shareRequest(method, path, body, key) {
  let r;
  try {
    r = await fetch(path, {
      method,
      headers: { ...(key ? { Authorization: 'Bearer ' + key } : {}), ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) { return { status: 0, data: null }; }
  let data = null;
  try { data = await r.json(); } catch (e) {}
  return { status: r.status, data };
}

function ShareField({ field, value, onChange, places }) {
  const common = { className: 'am-flow-input am-share-input', name: field.key, value: value || '', onChange: (e) => onChange(e.target.value), required: !!field.required };
  let input;
  if (field.type === 'place') {
    input = h('select', common,
      h('option', { value: '' }, 'בלי מקום מסוים'),
      places.map((p) => h('option', { key: p.entityId, value: p.entityId }, p.title)));
  } else if (field.area) {
    input = h('textarea', { ...common, rows: 3, maxLength: field.max, placeholder: field.placeholder });
  } else {
    input = h('input', { ...common, type: field.type || 'text', maxLength: field.max, placeholder: field.placeholder });
  }
  return h('label', { className: 'am-flow-field' }, h('span', { className: 'am-flow-label' }, field.label), input);
}

/* ---------- "השיתופים שלי": קריאה בלבד. השרת מחזיר רק את של מחזיק המפתח
   (lib/mySubmissions.ts); סיבת דחייה מגיעה רק לשולח, רק מכאן. ---------- */
const MINE_STATE = {
  pending: 'ממתין לאישור', published: 'פורסם', rejected: 'לא אושר', converted: 'הפך ליוזמה', draft: 'טיוטה',
  cancelled: 'בוטל', received: 'פנייה פרטית: התקבלה', handled: 'פנייה פרטית: טופלה', in_review: 'בטיפול',
};
const MINE_REPORT_KIND = {
  wrong_info: 'מידע לא נכון', new_info: 'מידע חדש', resource_offer: 'משאב להציע', operator_message: 'פנייה למפעיל',
  place_closed: 'מקום שנסגר', event_cancelled: 'אירוע שבוטל', event_changed: 'אירוע שהשתנה', new_place: 'מקום חדש',
  new_initiative: 'יוזמה חדשה', suggestion: 'הצעה', problem: 'בעיה', event_submission: 'בקשה לפרסם אירוע',
};
function mineType(it) {
  if (it.type === 'proposal') return it.partners ? 'חיפוש שותפים' : 'רעיון';
  return { initiative: 'יוזמה', event: 'אירוע', report: 'פנייה' }[it.type] || it.type;
}
function mineDate(iso) {
  const d = new Date(iso);
  if (!iso || Number.isNaN(d.getTime())) return '';
  try { return d.toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short', timeZone: 'Asia/Jerusalem' }); } catch (e) { return d.toISOString(); }
}

function MySubmissions({ shareKey, onBack, onKeyInvalid }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  useEffect(() => {
    let alive = true;
    shareRequest('GET', '/api/me/submissions', null, shareKey).then((r) => {
      if (!alive) return;
      if (r.status === 200) setData(r.data);
      else if (r.status === 401) { onKeyInvalid(); setError('הזיהוי בדפדפן הזה כבר לא תקף, ולכן אי אפשר להציג את השיתופים שלו.'); }
      else setError(shareErrorText(r.status, r.data && r.data.error));
    });
    return () => { alive = false; };
  }, [shareKey]);
  return h('div', { className: 'am-share-mine' },
    h('button', { type: 'button', className: 'am-creators-back', onClick: onBack }, '‹ חזרה'),
    h('div', { className: 'am-creators-title am-share-form-title' }, 'השיתופים שלי'),
    h('p', { className: 'am-share-note' }, 'רק אתם רואים את הרשימה הזו, בדפדפן הזה.'),
    error ? h('p', { className: 'am-share-error', role: 'alert' }, error)
      : !data ? h('div', { className: 'am-directory-empty' }, 'טוען...')
      : !data.items.length ? h('div', { className: 'am-directory-empty' }, 'עוד לא שיתפתם כלום.')
      : h('ul', { className: 'am-share-mine-list' }, data.items.map((it) => h('li', {
          key: it.type + it.id, className: 'am-share-mine-item', 'data-type': it.type, 'data-state': it.state,
        },
          h('div', { className: 'am-share-mine-top' },
            h('span', { className: 'am-share-mine-type' }, mineType(it)),
            h('span', { className: 'am-share-mine-state', 'data-state': it.state }, MINE_STATE[it.state] || MINE_STATE.in_review)),
          h('div', { className: 'am-share-mine-title' }, it.type === 'report' ? (MINE_REPORT_KIND[it.kind] || 'פנייה') : it.title),
          h('div', { className: 'am-share-mine-meta' },
            'נשלח: ' + mineDate(it.createdAt) + (it.startAt ? ' · מועד האירוע: ' + mineDate(it.startAt) : '')),
          it.state === 'rejected'
            ? h('div', { className: 'am-share-mine-reason' }, it.rejectionReason ? 'הסיבה: ' + it.rejectionReason : 'לא נמסרה סיבה.')
            : null))));
}

/* ===================== "הצעות תושבים" (19.10.2026) =====================
   אותה מערכת כמו מפת שכונה ט׳ בבאר שבע (app/lib/neighborhoodProposals.ts), עם שכונה משלה:
   /api/neighborhoods/armon-hanatziv/proposals. השרת מסנן כל שאילתה לפי השכונה, כך שהצעות
   מבאר שבע לא מגיעות לכאן. כל הצעה ממתינה לאישור הרכזת (/moderation, לשונית "הצעות תושבים");
   עד אז רק המציע רואה אותה. לא נאספים טלפון או מייל (נבדק גם בשרת). שם התצוגה מוצג ליד הצעה שאושרה. */
const SUGGESTIONS_PATH = '/api/neighborhoods/armon-hanatziv/proposals';
const SUGGESTION_GREEN = '#4e8a3a';
const CONTACT_RE = /(\+?\d[\d\s-]{7,}\d)|(\S+@\S+\.\S+)/;
const SUGGESTION_STATUS = {
  submitted: 'ממתינה לאישור הרכזת. עד אז רק אתם רואים אותה.',
  approved: 'אושרה ומוצגת לכולם',
  closed: 'נסגרה (נשארת במפה לתיעוד)',
  rejected: 'לא אושרה. רק אתם רואים אותה.',
};

/** בדיקת הטופס - אותם כללים כמו בשרת (כותרת 3-80, תיאור 10-400, בלי טלפון ומייל) */
function validateSuggestion(d, needsName) {
  const e = {};
  const title = (d.title || '').trim(), body = (d.body || '').trim(), name = (d.displayName || '').trim();
  if (title.length < 3) e.title = 'נא לכתוב כותרת קצרה (לפחות 3 תווים).';
  if (body.length < 10) e.body = 'נא לכתוב כמה מילים על ההצעה (לפחות 10 תווים).';
  if (CONTACT_RE.test(title)) e.title = 'נא לא לכתוב טלפון או מייל.';
  if (CONTACT_RE.test(body)) e.body = 'נא לא לכתוב טלפון או מייל. פרטי קשר לא נאספים כאן.';
  if (needsName && name.length < 2) e.displayName = 'נא לכתוב שם תצוגה (לפחות 2 תווים).';
  if (needsName && CONTACT_RE.test(name)) e.displayName = 'נא לכתוב שם בלבד, בלי טלפון או מייל.';
  return e;
}

function SuggestionField({ name, label, value, onChange, error, area, max, placeholder, hint }) {
  const props = { className: 'am-flow-input am-share-input', name, value: value || '', maxLength: max, placeholder, 'aria-invalid': error ? 'true' : undefined,
    onChange: (e) => onChange(e.target.value) };
  return h('label', { className: 'am-flow-field' },
    h('span', { className: 'am-flow-label' }, label),
    area ? h('textarea', { ...props, rows: 3 }) : h('input', { ...props, type: 'text' }),
    hint ? h('span', { className: 'am-suggest-hint' }, hint) : null,
    error ? h('span', { className: 'am-suggest-field-error' }, error) : null);
}

/** כותרת קצרה ליד הנקודה (כמו בבאר שבע): המילים הראשונות, עד כ-16 תווים. השם המלא במעבר עכבר. */
function shortSuggestionLabel(title) {
  const words = String(title || '').trim().split(/\s+/);
  let out = '';
  for (const w of words) {
    const next = out ? out + ' ' + w : w;
    if (out && next.length > 16) return out + '…';
    out = next;
  }
  return out.length > 18 ? out.slice(0, 16) + '…' : out;
}

/** הצעות שנשלחו בלי מקום במפה (בבקשת בעל הפרויקט, 19.10): מקבלות נקודה באחד המקומות הפנויים
 *  שבתוך קו השכונה, בין האייקונים (באחוזי הבמה). הבחירה קבועה לפי מזהה ההצעה, כך שההצעה לא
 *  "קופצת" בין טעינות, ושתי הצעות לא נופלות על אותו מקום. זה מיקום לתצוגה בלבד - לא נשמר בשרת,
 *  ובכרטיס כתוב שהמקום לא סומן. */
const UNPLACED_SPOTS = [[48.2, 52.2], [75.8, 50.0], [74.9, 71.6], [42.9, 28.3], [64.2, 76.2], [61.5, 67.0], [83.0, 65.0], [44.0, 62.0]];
function spreadUnplaced(items) {
  const hash = (id) => { let x = 0; for (const c of String(id)) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x; };
  const used = new Set();
  return items.slice().sort((a, b) => String(a.id).localeCompare(String(b.id))).map((it, i) => {
    let k = hash(it.id) % UNPLACED_SPOTS.length;
    for (let n = 0; n < UNPLACED_SPOTS.length && used.has(k); n++) k = (k + 1) % UNPLACED_SPOTS.length;
    used.add(k);
    const [sx, sy] = UNPLACED_SPOTS[k];
    const ring = Math.floor(i / UNPLACED_SPOTS.length) * 3; // יותר מ-8 הצעות: הזזה קטנה כדי שלא יכסו זו את זו
    return { ...it, mapX: frameX(sx + ring), mapY: frameY(sy + ring), unplaced: true };
  });
}

/** סמן הצעה: נקודה ירוקה מלאה עם כותרת קצרה לידה (לא כפתור תלת-ממדי כמו העוגנים).
 *  ממתינה (רק השולחת רואה): אותה נקודה מלאה, והכותרת מסומנת "ממתינה". */
function SuggestionMarker({ item, active, onOpen }) {
  return h('button', {
    className: 'am-suggestion' + (item.status === 'submitted' ? ' is-pending' : '') + (active ? ' is-active' : ''),
    style: { left: stageX(item.mapX) + '%', top: stageY(item.mapY) + '%', '--suggest-color': SUGGESTION_GREEN },
    onClick: onOpen, 'aria-label': 'הצעת תושבים: ' + item.title, 'data-id': item.id, 'data-status': item.status,
  }, h('span', { className: 'am-suggestion-dot', 'aria-hidden': 'true' }),
    h('span', { className: 'am-suggestion-short', 'aria-hidden': 'true' },
      shortSuggestionLabel(item.title) + (item.status === 'submitted' ? ' · ממתינה' : '')),
    h('span', { className: 'am-suggestion-name', 'aria-hidden': 'true' }, item.title));
}

/** כרטיס הצעה קומפקטי: כותרת, תיאור, מי הציע, מקום ומצב. בלי פרטי קשר ובלי הצבעות. */
/** "אני בעד" ו"אני רוצה להצטרף" בהצעה שאושרה - כמו בבאר שבע (בלי "נגד", בקשת בעלת הפרויקט 16.10.2026).
 *  קול אחד והצטרפות אחת לכל תושב; לחיצה שנייה מבטלת. בלי זיהוי בדפדפן - שם תצוגה פעם אחת (כמו בטופס ההצעה). */
function SuggestionActions({ item, onChanged }) {
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [ask, setAsk] = useState(null); // הפעולה שמחכה לשם תצוגה ('for' / 'join')
  const [name, setName] = useState('');
  const votesFor = (item.votes && item.votes.for) || 0, joins = item.joinCount || 0;
  async function run(action, keyArg) {
    const key = keyArg || loadShareKey();
    if (!key) { setAsk(action); return; }
    setBusy(true); setError(null);
    const base = SUGGESTIONS_PATH + '/' + encodeURIComponent(item.id);
    const r = action === 'for'
      ? (item.myVote === 'for' ? await shareRequest('DELETE', base + '/vote', null, key) : await shareRequest('PUT', base + '/vote', { side: 'for' }, key))
      : (item.joinedByMe ? await shareRequest('DELETE', base + '/join', null, key) : await shareRequest('POST', base + '/join', null, key));
    setBusy(false);
    if (r.status === 200 && r.data) { onChanged(r.data); return; }
    if (r.status === 401) { saveShareKey(null); setAsk(action); setError('הזיהוי בדפדפן הזה כבר לא תקף. כתבו שם תצוגה ונסו שוב.'); return; }
    setError(shareErrorText(r.status, r.data && r.data.error));
  }
  async function withName(e) {
    e.preventDefault();
    const n = name.trim();
    if (n.length < 2) { setError('כתבו שם תצוגה (לפחות 2 תווים).'); return; }
    if (CONTACT_RE.test(n)) { setError('בלי טלפון או מייל - רק שם תצוגה.'); return; }
    setBusy(true); setError(null);
    const created = await shareRequest('POST', '/api/users', { displayName: n });
    setBusy(false);
    if (created.status !== 201) { setError(shareErrorText(created.status, created.data && created.data.error)); return; }
    saveShareKey(created.data.token);
    const action = ask; setAsk(null);
    run(action, created.data.token);
  }
  return h('div', { className: 'am-suggestion-actions', 'data-actions': item.id },
    h('p', { className: 'am-suggestion-counts' },
      h('span', { 'data-votes-for': String(votesFor) }, 'בעד ההצעה: ' + votesFor),
      h('span', { 'data-joins': String(joins) }, joins ? (joins === 1 ? 'מצטרף אחד' : joins + ' מצטרפים') : 'עדיין אין מצטרפים')),
    h('div', { className: 'am-suggestion-buttons' },
      h('button', { type: 'button', className: 'am-suggestion-act', 'data-action': 'vote-for', 'aria-pressed': String(item.myVote === 'for'), disabled: busy, onClick: () => run('for') },
        item.myVote === 'for' ? 'סימנתם בעד (לחיצה מבטלת)' : 'אני בעד ההצעה'),
      h('button', { type: 'button', className: 'am-suggestion-act', 'data-action': 'join', 'aria-pressed': String(!!item.joinedByMe), disabled: busy, onClick: () => run('join') },
        item.joinedByMe ? 'הצטרפתם (לחיצה מבטלת)' : 'אני רוצה להצטרף')),
    ask ? h('form', { className: 'am-suggestion-ask', onSubmit: withName, noValidate: true },
      h('label', null, h('span', null, 'שם תצוגה (פעם אחת בדפדפן הזה)'),
        h('input', { className: 'am-share-input', name: 'displayName', value: name, maxLength: 40, autoComplete: 'nickname', onChange: (e) => setName(e.target.value) })),
      h('button', { type: 'submit', className: 'am-suggestion-act', disabled: busy }, 'המשך')) : null,
    error ? h('p', { className: 'am-share-error', role: 'alert' }, error) : null,
    h('small', { className: 'am-suggestion-note' }, 'רק שם תצוגה, בלי טלפון או מייל. רכזת הקהילה רואה מי הצטרף.'));
}

        h('h2', { className: 'am-card-title' }, item.title),

        h('dl', { className: 'am-suggestion-meta' },
          h('dt', null, 'הציע/ה'), h('dd', null, item.proposer ? item.proposer.displayName : 'תושב/ת השכונה'),
          h('dt', null, 'מקום'), h('dd', null, item.unplaced || item.mapX == null ? 'לא סומן מקום (הנקודה במפה לתצוגה בלבד)' : 'מסומן במפה'),
          h('dt', null, 'מצב'), h('dd', { 'data-status': item.status }, SUGGESTION_STATUS[item.status] || item.status)),

        h('p', { className: 'am-suggestion-note' }, 'הצעה של תושבים, לא יוזמה רשמית. רכזת הקהילה בודקת כל הצעה לפני שהיא מוצגת לכולם.'))));
}

/** הצעות בלי מקום במפה - רשימה קצרה (נפתחת מהקישור מתחת למקרא) */
function SuggestionsList({ items, onOpen, onClose }) {

        h('span', { className: 'am-creators-option-text' }, h('span', null, it.title),
