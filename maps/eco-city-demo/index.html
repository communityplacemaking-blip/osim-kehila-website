<title>מפת משמעות · דמו להתחדשות עירונית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* פלטת המותג במקום אחד */
:root{
  --brand:#1F3A2E;      /* ירוק עמוק */
  --brand-2:#2E5A45;
  --accent:#9CC43D;     /* ירוק עלה */
  --accent-ink:#4E6B12;
  --sand:#F5F0E6;
  --ink:#1B1F1D;
  --muted:#5F6B64;
  --line:#E3E0D7;
  --white:#fff;
  --shadow:0 10px 30px rgba(20,35,28,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--sand);color:var(--ink);font-family:Heebo,Arial,sans-serif}
#map{position:fixed;inset:0;background:#EAE6DC}
/* מפת הרקע: מושתקת וחמה, כדי שהמותג יבלוט */
.leaflet-tile-pane .base{filter:grayscale(.85) sepia(.28) saturate(.9) brightness(1.04) contrast(.92)}
.leaflet-tile-pane .labels{opacity:.55}
.leaflet-container{font-family:Heebo,Arial,sans-serif}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.7)!important}

/* כותרת צפה */
.brandbar{position:fixed;top:16px;right:16px;z-index:500;background:var(--brand);color:#fff;border-radius:18px;padding:16px 20px 14px;box-shadow:var(--shadow);max-width:380px}
.brandbar .kicker{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:500}
.brandbar h1{margin:4px 0 2px;font-size:21px;font-weight:800;line-height:1.15}
.brandbar p{margin:0;font-size:13.5px;font-weight:300;opacity:.85}
.stats{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:700;color:#fff}
.stat span{font-size:11px;opacity:.8}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="false"]{opacity:.4}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.demo{position:fixed;bottom:22px;right:16px;z-index:500;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.demo b{color:var(--brand);font-weight:500}

/* עוגנים */
.anc{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.anc .ring{position:relative;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(31,58,46,.25);border:2px solid var(--accent)}
.anc .ring::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px solid var(--accent);opacity:.35}
.anc svg{width:58%;height:58%;stroke:var(--brand);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.anc .nm{margin-top:6px;font-size:12.5px;font-weight:700;color:var(--brand);white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff}
.anc.dim{opacity:.35}
.zlow .anc .nm{display:none}
.zlow .anc .ring{transform:scale(.7)}
.zlow .sale{transform:scale(.8)}

/* בניינים מאוכלסים */
.bld{width:22px;height:22px;border-radius:7px;background:var(--brand);border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.bld svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2}
.bld:hover,.bld.on{transform:scale(1.25)}
/* פרויקטים בשיווק: סיכה עם תמונה */
.sale{position:relative;cursor:pointer;transition:transform .2s}
.sale .ph{width:54px;height:54px;border-radius:50%;border:3px solid var(--accent);background:var(--brand-2) center/cover no-repeat;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.sale .tag{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--brand);font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap}
.sale .pulse{position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--accent);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.sale:hover,.sale.on{transform:translateY(-4px) scale(1.08)}
.bld.dim,.sale.dim{opacity:.35}
.tip{font-family:Heebo,Arial,sans-serif;font-size:13px;font-weight:500}

/* חוטי משמעות */
.thread{stroke-dasharray:3 7;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}

/* מגירת פרויקט */
.drawer{position:fixed;top:0;left:0;bottom:0;width:420px;max-width:100%;z-index:800;background:#fff;box-shadow:var(--shadow);transform:translateX(-105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow:auto}
.drawer.open{transform:none}
.drawer .hero{height:250px;background:var(--brand-2) center/cover no-repeat;position:relative}
.drawer .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,35,28,.75),rgba(20,35,28,0) 55%)}
.drawer .hero .ttl{position:absolute;bottom:14px;right:20px;left:20px;color:#fff;z-index:1}
.drawer .hero h2{margin:0;font-size:28px;font-weight:800}
.drawer .hero .city{font-size:14px;opacity:.9}
.drawer .hero.ill{background:linear-gradient(135deg,var(--brand),var(--brand-2))}
.drawer .hero.ill svg{position:absolute;inset:0;margin:auto;width:150px;height:150px;opacity:.9;stroke:var(--accent);fill:none;stroke-width:1.2}
.x{position:absolute;top:12px;left:12px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:20px;cursor:pointer;color:var(--brand)}
.body{padding:18px 20px 26px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.badge{font-size:12px;font-weight:500;border-radius:999px;padding:4px 10px;background:var(--sand);color:var(--brand)}
.badge.hot{background:var(--accent);color:var(--brand);font-weight:800}
.lead{font-size:16px;line-height:1.55;font-weight:400;margin:0 0 14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.fact{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.fact b{display:block;font-size:17px;color:var(--brand)}
.fact span{font-size:11.5px;color:var(--muted)}
h3{font-size:14px;margin:18px 0 6px;color:var(--brand)}
.near{list-style:none;margin:0;padding:0}
.near li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px;cursor:pointer}
.near li:last-child{border:0}
.near .ic{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;flex:none}
.near .ic svg{width:18px;height:18px;stroke:var(--brand);fill:none;stroke-width:1.6}
.near small{margin-inline-start:auto;color:var(--muted);white-space:nowrap}
.nearby{font-size:14px;line-height:1.6;color:var(--muted);margin:6px 0 0}
.cta{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;border:0;border-radius:12px;padding:13px 10px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
.btn.pri{background:var(--brand);color:#fff}
.btn.sec{background:var(--sand);color:var(--brand)}
form.leadf{display:none;margin-top:12px;background:var(--sand);border-radius:14px;padding:14px}
form.leadf.open{display:block}
form.leadf input{width:100%;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;background:#fff}
.rep{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.rep .av{width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--accent);display:grid;place-items:center;font-weight:800}
.ok{font-size:14.5px;color:var(--brand);font-weight:500}
.src{font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.5}
@media (max-width:760px){
  .brandbar{left:12px;right:12px;top:12px;max-width:none;padding:12px 14px}
  .brandbar h1{font-size:19px}
  .brandbar p{display:none}
  .stats{margin-top:8px}
  .drawer{top:auto;left:0;right:0;width:100%;height:68vh;border-radius:20px 20px 0 0;transform:translateY(105%)}
  .drawer .hero{height:200px;border-radius:20px 20px 0 0}
  .demo{right:12px;bottom:12px;left:12px;text-align:center;border-radius:12px}
}
</style>
</head>

 {n:'מינץ 8',c:'תל אביב',y:2023,u:24,a:'ADMA',lat:32.109615,lng:34.823713},
 {n:'שלמה המלך 93',c:'תל אביב',y:2018,u:21,a:'החדר אדריכלים',lat:32.084304,lng:34.778493},
 {n:'רמברנדט 18',c:'תל אביב',y:2025,u:20,a:'גרוסברד וינציגסטר',lat:32.082783,lng:34.783034},
 {n:'גליצנשטיין 8',c:'תל אביב',y:2020,u:15,a:'ADMA',lat:32.081258,lng:34.784230}
];
B.forEach(function(b,i){b.id=i;if(!b.s)b.s='live';});

/* מפה */
var map=L.map('map',{zoomControl:false,attributionControl:true,zoomSnap:.25,minZoom:12,maxZoom:18}).setView([32.083,34.792],14);
L.control.zoom({position:'bottomleft'}).addTo(map);
var ATT='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>';
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',{className:'base',attribution:ATT,subdomains:'abcd',maxZoom:19}).addTo(map);
map.createPane('labels');map.getPane('labels').style.zIndex=350;map.getPane('labels').style.pointerEvents='none';
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',{className:'labels',pane:'labels',subdomains:'abcd',maxZoom:19}).addTo(map);

var threads=L.layerGroup().addTo(map);
var anchorLayer=L.layerGroup().addTo(map),liveLayer=L.layerGroup().addTo(map),saleLayer=L.layerGroup().addTo(map);

A.forEach(function(a,i){
  a.id=i;var d=24+a.w*5;
  a.m=L.marker([a.lat,a.lng],{icon:L.divIcon({className:'',iconSize:[d,d],iconAnchor:[d/2,d/2],
    html:'<div class="anc" data-a="'+i+'"><div class="ring" style="width:'+d+'px;height:'+d+'px">'+svg(a.k)+'</div><div class="nm">'+a.n+'</div></div>'}),keyboard:true,title:a.n,zIndexOffset:-100})
   .on('click',function(){showA(a);}).addTo(anchorLayer);
});
B.forEach(function(b){
  var ic=b.s==='sale'
    ? L.divIcon({className:'',iconSize:[54,54],iconAnchor:[27,27],html:'<div class="sale" data-b="'+b.id+'"><div class="pulse"></div><div class="ph" style="background-image:url(\''+b.thumb+'\')"></div><div class="tag">בשיווק</div></div>'})
    : L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],html:'<div class="bld" data-b="'+b.id+'">'+svg('home')+'</div>'});
  b.m=L.marker([b.lat,b.lng],{icon:ic,title:b.n,zIndexOffset:b.s==='sale'?1000:500})
   .bindTooltip(b.n,{direction:'top',offset:[0,b.s==='sale'?-34:-12],className:'tip'})
   .on('click',function(){showB(b);}).addTo(b.s==='sale'?saleLayer:liveLayer);
});

/* מרחקים וזמני הליכה */
function meters(p,q){var dx=(p.lng-q.lng)*94300,dy=(p.lat-q.lat)*110540;return Math.sqrt(dx*dx+dy*dy);}
function walk(m){var min=Math.max(1,Math.round(m*1.3/80));return min+' דק׳ הליכה';}
function nearestA(b,k){return A.map(function(a){return {a:a,m:meters(a,b)};}).sort(function(x,y){return x.m-y.m;}).slice(0,k);}
function nearestB(a,k){return B.filter(vis).map(function(b){return {b:b,m:meters(a,b)};}).sort(function(x,y){return x.m-y.m;}).slice(0,k);}

/* חוט מעוגל בין שתי נקודות */
function arc(p,q){
  var pts=[],mx=(p.lat+q.lat)/2,my=(p.lng+q.lng)/2,dx=q.lng-p.lng,dy=q.lat-p.lat,cx=mx-dx*.22,cy=my+dy*.22;
  for(var t=0;t<=1.0001;t+=.05){var u=1-t;pts.push([u*u*p.lat+2*u*t*cx+t*t*q.lat,u*u*p.lng+2*u*t*cy+t*t*q.lng]);}
  return L.polyline(pts,{color:COL.brand,weight:2.4,opacity:.85,className:'thread',interactive:false});
}

var on={live:true,sale:true,anc:true};
function vis(b){return on[b.s];}

function mark(bid,aids){
  document.querySelectorAll('[data-b]').forEach(function(e){var id=+e.dataset.b;e.classList.toggle('on',id===bid);e.classList.toggle('dim',bid!=null&&id!==bid&&!(aids&&aids.indexOf(id)>=0));});
}

var drawer=document.getElementById('drawer');
function close(){drawer.classList.remove('open');threads.clearLayers();mark(null);}
function facts(list){return '<div class="facts">'+list.filter(function(f){return f[0]!=null;}).map(function(f){return '<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>';}).join('')+'</div>';}

function showB(b){
  var near=nearestA(b,3);
  threads.clearLayers();near.forEach(function(n){arc(b,n.a).addTo(threads);});
  mark(b.id);
  var sale=b.s==='sale';
  var hero=sale?'<div class="hero" style="background-image:url(\''+b.photo+'\')">':'<div class="hero ill">'+svg('home');
  drawer.innerHTML='<button class="x" aria-label="סגירה">×</button>'+hero+'<div class="ttl"><h2>'+b.n+'</h2><div class="city">'+b.c+'</div></div></div>'+
   '<div class="body"><div class="badges">'+(sale?'<span class="badge hot">עכשיו בשיווק</span>':'<span class="badge">מאוכלס · נבנה באקו סיטי</span>')+(b.types?'<span class="badge">'+b.types+'</span>':'')+'</div>'+
   (sale?'<p class="lead">'+b.lead+'</p>':'<p class="lead">בניין שהתחדש בפרויקט התחדשות עירונית של אקו סיטי, והיום הוא בית ל־'+b.u+' משפחות.</p>')+
   facts([[b.y,sale?'אכלוס צפוי':'אוכלס'],[b.u,'דירות'],[b.fl,'קומות'],[b.a?b.a.split(' ')[0]:null,'אדריכלות']].slice(0,3))+
   (b.a?'<div class="nearby">אדריכלות: '+b.a+'</div>':'')+
   '<h3>מה קרוב לבית</h3><ul class="near">'+near.map(function(n){return '<li data-ga="'+n.a.id+'"><span class="ic">'+svg(n.a.k)+'</span>'+n.a.n+'<small>'+walk(n.m)+'</small></li>';}).join('')+'</ul>'+
   (b.near?'<p class="nearby">'+b.near+'</p>':'')+
   (sale?'<div class="cta"><button class="btn pri" id="go">לתיאום פגישה עם נציג</button><a class="btn sec" href="'+b.url+'" target="_blank" rel="noopener">לדף הפרויקט</a></div>'+
     '<form class="leadf" id="lf"><div class="rep"><div class="av">EC</div><div><b>נציג/ת מכירות</b><br>אקו סיטי · '+b.n+'</div></div><input required placeholder="שם מלא" autocomplete="name"><input required type="tel" placeholder="טלפון" autocomplete="tel"><button class="btn pri" style="width:100%">שלחו ונחזור אליכם</button></form>'
     :'<div class="cta"><a class="btn sec" href="https://www.ecocity.co.il/your-project" target="_blank" rel="noopener">רוצים פרויקט כזה בבניין שלכם?</a></div>')+
   '<div class="src">מקור: האתר הציבורי של אקו סיטי. זמני ההליכה בקירוב. בדמו הטופס לא נשלח.</div></div>';
  bindDrawer();
  drawer.classList.add('open');
  var z=Math.max(map.getZoom(),15),pt=map.project([b.lat,b.lng],z);
  pt=pt.add(innerWidth>760?[-210,0]:[0,innerHeight*.3]);
  map.flyTo(map.unproject(pt,z),z,{duration:.8});
}
function showA(a){
  var near=nearestB(a,4);
  threads.clearLayers();near.forEach(function(n){arc(n.b,a).addTo(threads);});
  mark(-1,near.map(function(n){return n.b.id;}));
  drawer.innerHTML='<button class="x" aria-label="סגירה">×</button><div class="hero ill">'+svg(a.k)+'<div class="ttl"><h2>'+a.n+'</h2><div class="city">'+a.t+'</div></div></div>'+
   '<div class="body"><h3>הבניינים של אקו סיטי סביב '+a.n+'</h3><ul class="near">'+near.map(function(n){return '<li data-gb="'+n.b.id+'"><span class="ic">'+svg('home')+'</span>'+n.b.n+(n.b.s==='sale'?' · <b style="color:var(--accent-ink)">בשיווק</b>':'')+'<small>'+walk(n.m)+'</small></li>';}).join('')+'</ul></div>';
  bindDrawer();
  drawer.classList.add('open');
}
function bindDrawer(){
  drawer.querySelector('.x').onclick=close;
  drawer.querySelectorAll('[data-ga]').forEach(function(li){li.onclick=function(){showA(A[+li.dataset.ga]);};});
  drawer.querySelectorAll('[data-gb]').forEach(function(li){li.onclick=function(){showB(B[+li.dataset.gb]);};});
  var go=drawer.querySelector('#go'),lf=drawer.querySelector('#lf');
  if(go)go.onclick=function(){lf.classList.add('open');lf.querySelector('input').focus();};
  if(lf)lf.onsubmit=function(e){e.preventDefault();lf.innerHTML='<p class="ok">תודה! נציג/ה של אקו סיטי יחזרו אליכם בהקדם.</p>';};
}
map.on('click',close);
document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});

/* מקרא ומונים */
function stats(){
  var v=B.filter(vis),u=v.reduce(function(s,b){return s+(b.u||0);},0);
  document.getElementById('stats').innerHTML='<div class="stat"><b>'+v.length+'</b><span>בניינים</span></div><div class="stat"><b>'+u+'</b><span>דירות ידועות</span></div><div class="stat"><b>'+A.length+'</b><span>מקומות בעיר</span></div>';
}
[['sale','בשיווק',COL.accent,saleLayer],['live','מאוכלסים','#fff',liveLayer],['anc','מקומות בעיר','transparent;border:1.5px solid '+COL.accent,anchorLayer]].forEach(function(f){
  var b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed','true');
  b.innerHTML='<i style="background:'+f[2]+'"></i>'+f[1];
  b.onclick=function(){on[f[0]]=!on[f[0]];b.setAttribute('aria-pressed',on[f[0]]);on[f[0]]?map.addLayer(f[3]):map.removeLayer(f[3]);close();stats();};
  document.getElementById('filters').appendChild(b);
});
stats();
function zcls(){document.getElementById('map').classList.toggle('zlow',map.getZoom()<14.5);}
map.on('zoomend',zcls);
map.fitBounds(L.latLngBounds(B.filter(function(b){return b.lng<34.82;}).map(function(b){return [b.lat,b.lng];})).pad(.08),innerWidth>760?{paddingTopLeft:[40,40],paddingBottomRight:[40,40]}:{paddingTopLeft:[10,190],paddingBottomRight:[10,40]});
zcls();
})();
</script>
</body>
</html>
